name: Generate Sitemap

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: "0 2 * * *"   # nightly at 2 AM UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate sitemap_main.xml
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > docs/sitemap_main.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> docs/sitemap_main.xml

          find docs -type f -name "*.html" | while read file; do
            url="${file#docs/}"

            # Convert index.html to folder URL
            if [[ "$url" == */index.html ]]; then
              loc="https://www.triadicframeworks.org/${url%/index.html}/"
            else
              loc="https://www.triadicframeworks.org/${url}"
            fi

            echo "  <url><loc>$loc</loc></url>" >> docs/sitemap_main.xml
          done

          echo '</urlset>' >> docs/sitemap_main.xml

      - name: Commit sitemap
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/sitemap_main.xml
          git commit -m "Auto-update sitemap_main.xml" || echo "No changes"
          git push

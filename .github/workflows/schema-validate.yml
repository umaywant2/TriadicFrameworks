name: Schema Validation

on:
  push:
    paths:
      - "schemas/**.json"
      - "docs/**.json"
      - ".github/workflows/schema-validate.yml"
  pull_request:
    paths:
      - "schemas/**.json"
      - "docs/**.json"

jobs:
  validate-schemas:
    name: Validate JSON against Universe-Class Schemas
    runs-on: ubuntu-latest

    outputs:
      summary: ${{ steps.collect-summary.outputs.summary }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JSON Schema validator
        run: npm install -g ajv-cli

      - name: Validate RTTcode examples
        id: rttcode
        run: |
          echo "Validating RTTcode examples..."
          ajv validate \
            -s schemas/rttcode.v1.json \
            -d "docs/**/rttcode*.json" \
            --strict=true

      - name: Validate Environment schemas/examples
        id: env
        run: |
          echo "Validating Environment schemas/examples..."
          ajv validate \
            -s schemas/environment.v1.json \
            -d "docs/**/environment*.json" \
            --strict=true

      - name: Validate Entity schemas/examples
        id: entity
        run: |
          echo "Validating Entity schemas/examples..."
          ajv validate \
            -s schemas/entity.v1.json \
            -d "docs/**/entity*.json" \
            --strict=true

      - name: Validate Universe-Class extensions
        id: universe
        run: |
          echo "Validating Universe-Class extension schemas/examples..."
          ajv validate \
            -s schemas/universe.v1.json \
            -d "docs/**/universe*.json" \
            --strict=true

      - name: Collect summary
        id: collect-summary
        run: |
          echo "summary=RTTcode: ${{ steps.rttcode.outcome }}, Environment: ${{ steps.env.outcome }}, Entity: ${{ steps.entity.outcome }}, Universe: ${{ steps.universe.outcome }}" >> $GITHUB_OUTPUT
          
  comment-on-pr:
    name: Comment validation summary on PR
    needs: validate-schemas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Post PR comment with schema validation summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const summary = `${{ toJSON(needs.validate-schemas.outputs.summary) }}`.replace(/^"|"$/g, '');
            const body = [
              "### ✅ Schema Validation Summary",
              "",
              `- ${summary}`,
              "",
              needs.validate-schemas.result === "success"
                ? "All checked schemas and example packets are **valid**. 🚀"
                : "One or more schema validations **failed**. Please check the workflow logs. ⚠️"
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

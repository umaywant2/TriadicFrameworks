# ------------------------------------------------------------
# TriadicFrameworks — Weekly Check-In Workflow
#
# Purpose:
#   Automatically generates a weekly lineage snapshot inside:
#     /docs/WEEKLY_CHECKINS/<YYYY-MM-DD>/checkin.md
#
# What this workflow does:
#   - Runs every Sunday at 09:00 EDT (13:00 UTC)
#   - Creates a timestamped folder for the weekly check-in
#   - Generates a structured lineage file (module: LINEAGE)
#   - Commits the new check-in to the repository
#
# Who uses this:
#   - The TriadicFrameworks lineage system
#   - Canon maintainers reviewing drift, coherence, and module activity
#
# When to run manually:
#   - Use "Run workflow" in GitHub Actions if:
#       • You want an immediate lineage snapshot
#       • You made major canon changes and want a fresh check-in
#
# What does NOT use this file:
#   - Python generators in /docs/tools/
#   - Domain/module bundle scripts
#   - Navigation or Jekyll site builders
#
# Notes:
#   This workflow is NOT auto-generated. It is maintained manually.
# ------------------------------------------------------------

name: Weekly Check-In Generator
"on":
  schedule:
    - cron: 0 13 * * 0
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  generate-weekly-checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up timestamp
        id: ts
        run: echo "date=$(date -u +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      - name: Create weekly check-in folder
        run: |
          mkdir -p docs/WEEKLY_CHECKINS/${{ steps.ts.outputs.date }}
      - name: Generate weekly check-in file
        run: >
          cat <<EOF > docs/WEEKLY_CHECKINS/${{ steps.ts.outputs.date
          }}/checkin.md

          # Weekly Check-In — ${{ steps.ts.outputs.date }}

          ## Summary

          Automated weekly check-in generated by GitHub Actions.

          ## Metadata

          - Timestamp (UTC): ${{ steps.ts.outputs.date }}
          - Module: LINEAGE
          - Purpose: Internal weekly snapshot for lineage, drift, and module activity tracking.

          ## Notes

          (You can add manual notes here later.)

          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/WEEKLY_CHECKINS/${{ steps.ts.outputs.date }}/checkin.md
          git commit -m "Weekly check-in: ${{ steps.ts.outputs.date }}"
          git push

name: AI Metadata Validator

on:
  push:
    paths:
      - "docs/**"
      - "scripts/**"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x scripts/validate_metadata.sh scripts/generate_metadata_dashboard.sh || true

      - name: Run metadata validator
        run: |
          if [ -f scripts/validate_metadata.sh ]; then
            ./scripts/validate_metadata.sh
          else
            echo "No validator script found."
          fi

      - name: Generate metadata dashboard
        run: |
          if [ -f scripts/generate_metadata_dashboard.sh ]; then
            ./scripts/generate_metadata_dashboard.sh
          else
            echo "No dashboard generator found."
          fi

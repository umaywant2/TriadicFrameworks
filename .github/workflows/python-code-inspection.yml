name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install markdown pytest ruff yamllint

      - name: Lint Python tooling with ruff
        run: |
          ruff check scripts tests || true

      - name: Validate YAML files
        run: |
          find docs .github -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 \
          | xargs -0 -r yamllint || true

      - name: Validate JSON files
        run: |
          find . -type f -name '*.json' -not -path './node_modules/*' -print0 \
          | xargs -0 -r -I {} python -c "import sys,json; json.load(open(sys.argv[1]));" {} || true

      - name: Validate HTML mirror builder syntax
        run: |
          python -m py_compile scripts/build_html_mirror.py

      - name: Run HTML mirror regression tests
        run: |
          python -m pytest tests/test_build_html_mirror.py -q

      - name: Validate HTML mirror invariant
        run: |
          python scripts/build_html_mirror.py --check

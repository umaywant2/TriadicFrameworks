name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install ruff yamllint jsonlint

    - name: Lint Python files with ruff
      run: |
        ruff check . || true

    - name: Validate YAML files
      run: |
        yamllint . || true

    - name: Validate JSON files
      run: |
        find . -name "*.json" -print0 | xargs -0 -I {} jsonlint -q {} || true

    - name: Python syntax check
      run: |
        python -m compileall -q .

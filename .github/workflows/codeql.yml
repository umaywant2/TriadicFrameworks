name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # Run CodeQL on PRs targeting main
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [cpp]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Manual build for vcg_client.cpp
      run: |
        mkdir -p build
        g++ -c docs/VCG/src/vcg_client.cpp -o build/vcg_client.o

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

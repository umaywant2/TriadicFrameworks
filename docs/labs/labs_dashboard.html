<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Triadic Labs Dashboard</title>
  <link rel="stylesheet" href="../../styles/validator-dashboard.css">
  <script>
    async function loadLabs() {
      const response = await fetch('../../labs/labs_status.json');
      const data = await response.json();
      const container = document.getElementById('labs-container');

      data.labs.forEach(lab => {
        const div = document.createElement('div');
        div.className = `lab-card ${lab.status}`;
        div.innerHTML = `
          <h3>${lab.name}</h3>
          <p>${lab.description}</p>
          <span class="status">${lab.status.toUpperCase()}</span>
        `;
        container.appendChild(div);
      });
    }

    document.addEventListener('DOMContentLoaded', loadLabs);
  </script>
</head>
<body>
  <h1>🧪 Triadic Labs Dashboard</h1>
  <div id="labs-container"></div>
</body>
</html>

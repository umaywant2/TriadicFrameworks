<div class="lens-controls">

  <!-- Forces Controls -->
  <div class="control-box">
    <h3>Forces</h3>
    <label>Speed:
      <input type="range" id="forcesSpeed" min="0.5" max="3.0" step="0.1" value="1.0">
    </label>
    <label>
      <input type="checkbox" id="forcesChar" data-symbol="@">
      Use Character (@)
    </label>
    <canvas id="forcesCanvas" width="300" height="200"></canvas>
  </div>

  <!-- Fluids Controls -->
  <div class="control-box">
    <h3>Fluids</h3>
    <label>Speed:
      <input type="range" id="fluidsSpeed" min="0.5" max="3.0" step="0.1" value="1.0">
    </label>
    <label>
      <input type="checkbox" id="fluidsChar" data-symbol="*">
      Use Character (*)
    </label>
    <canvas id="fluidsCanvas" width="300" height="200"></canvas>
  </div>

  <!-- Frequencies Controls -->
  <div class="control-box">
    <h3>Frequencies</h3>
    <label>Speed:
      <input type="range" id="frequenciesSpeed" min="10" max="120" step="5" value="60">
    </label>
    <label>
      <input type="checkbox" id="frequenciesChar" data-symbol="_">
      Use Character (_)
    </label>
    <canvas id="frequenciesCanvas" width="300" height="200"></canvas>
  </div>

</div>

badge_id: manifest_guardian
title: Manifest Guardian
description: Awarded to contributors who maintain repo structure, update the manifest, and pass validation checks.
criteria:
  - update_manifest
  - restructure_repo
  - validate_manifest_pass
triggers:
  - file_change: .github/repo_manifest.yaml
  - workflow_pass: validate_manifest.yml
visual:
  icon: 🛡️
  color: deep-indigo
  aura: spectral-flux
reward:
  - honor_roll_entry: true
  - validator_score: +5

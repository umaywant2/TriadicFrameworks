<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">

  <!-- Background -->
  <rect x="0" y="0" width="900" height="1200" fill="#050816" />

  <!-- Title -->
  <text x="450" y="70" fill="#E5E7EB"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="28" text-anchor="middle">
    RTT/1 — Internet Archive Operator Chain
  </text>
  <text x="450" y="105" fill="#9CA3AF"
        font-family="system-ui" font-size="16" text-anchor="middle">
    METADATA → WAYBACK → LINEAGE → COLLECTION → PRESERVATION → DRIFTBOUND
  </text>

  <!-- METADATA_OPERATOR -->
  <rect x="200" y="150" width="500" height="110" rx="14" ry="14"
        fill="#0B1120" stroke="#6366F1" stroke-width="2.5" />
  <text x="450" y="190" fill="#E5E7EB" font-family="system-ui" font-size="22" text-anchor="middle">
    1. METADATA_OPERATOR
  </text>
  <text x="450" y="215" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Identify what the object is (substrate, regime, drift sensitivity, coherence, lineage IDs)
  </text>

  <!-- Arrow 1 -->
  <line x1="450" y1="260" x2="450" y2="300" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- WAYBACK_OPERATOR -->
  <rect x="200" y="300" width="500" height="110" rx="14" ry="14"
        fill="#0B1120" stroke="#F97316" stroke-width="2.5" />
  <text x="450" y="340" fill="#E5E7EB" font-family="system-ui" font-size="22" text-anchor="middle">
    2. WAYBACK_OPERATOR
  </text>
  <text x="450" y="365" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Retrieve snapshots, build drift_map, mark continuity_breaks, estimate time_crystal stability
  </text>

  <!-- Arrow 2 -->
  <line x1="450" y1="410" x2="450" y2="450" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- LINEAGE_OPERATOR -->
  <rect x="200" y="450" width="500" height="110" rx="14" ry="14"
        fill="#0B1120" stroke="#10B981" stroke-width="2.5" />
  <text x="450" y="490" fill="#E5E7EB" font-family="system-ui" font-size="22" text-anchor="middle">
    3. LINEAGE_OPERATOR
  </text>
  <text x="450" y="515" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Build continuity kernel and lineage_graph, list transformations and regime_shifts
  </text>

  <!-- Arrow 3 -->
  <line x1="450" y1="560" x2="450" y2="600" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- COLLECTION_OPERATOR -->
  <rect x="200" y="600" width="500" height="110" rx="14" ry="14"
        fill="#0B1120" stroke="#EC4899" stroke-width="2.5" />
  <text x="450" y="640" fill="#E5E7EB" font-family="system-ui" font-size="22" text-anchor="middle">
    4. COLLECTION_OPERATOR
  </text>
  <text x="450" y="665" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Place object in its dimensional envelope (collection_id, coherence_clusters, related_objects)
  </text>

  <!-- Arrow 4 -->
  <line x1="450" y1="710" x2="450" y2="750" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- PRESERVATION_OPERATOR -->
  <rect x="200" y="750" width="500" height="110" rx="14" ry="14"
        fill="#0B1120" stroke="#F59E0B" stroke-width="2.5" />
  <text x="450" y="790" fill="#E5E7EB" font-family="system-ui" font-size="22" text-anchor="middle">
    5. PRESERVATION_OPERATOR
  </text>
  <text x="450" y="815" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Assess substrate format, stability_score, drift_risk, multi_layer_flags
  </text>

  <!-- Arrow 5 -->
  <line x1="450" y1="860" x2="450" y2="900" stroke="#9CA3AF" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- DRIFTBOUND_RETRIEVAL_OPERATOR -->
  <rect x="200" y="900" width="500" height="130" rx="14" ry="14"
        fill="#0B1120" stroke="#8B5CF6" stroke-width="2.5" />
  <text x="450" y="940" fill="#E5E7EB" font-family="system-ui" font-size="22" text-anchor="middle">
    6. DRIFTBOUND_RETRIEVAL_OPERATOR
  </text>
  <text x="450" y="965" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Final synthesis: summary, earliest_stable_version, most_reliable_version, key_changes, warnings
  </text>

  <!-- Footer: RTT mindset -->
  <text x="450" y="1055" fill="#9CA3AF" font-family="system-ui" font-size="14" text-anchor="middle">
    Never skip steps · Never reason directly from a snapshot · Always check drift + substrate · Stay continuity‑aligned
  </text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 z" fill="#9CA3AF" />
    </marker>
  </defs>
</svg>

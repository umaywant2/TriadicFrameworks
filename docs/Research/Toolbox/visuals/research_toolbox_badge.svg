<svg width="220" height="64" viewBox="0 0 220 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="badge-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#151538"/>
      <stop offset="100%" stop-color="#2A1B5A"/>
    </linearGradient>
    <linearGradient id="badge-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C4DFF"/>
      <stop offset="50%" stop-color="#40C4FF"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>
    <style>
      .badge-bg { fill: url(#badge-bg); stroke: #4B4B7A; stroke-width: 1; }
      .badge-glyph-ring { fill: none; stroke: url(#badge-accent); stroke-width: 2; }
      .badge-glyph-inner { fill: #141424; stroke: #7C4DFF; stroke-width: 1.2; }
      .badge-text-main { font-family: system-ui, sans-serif; font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .badge-text-sub { font-family: system-ui, sans-serif; font-size: 10px; fill: #C8C8E8; }
    </style>
  </defs>

  <!-- Badge container -->
  <rect x="0.5" y="0.5" width="219" height="63" rx="10" ry="10" class="badge-bg"/>

  <!-- Left glyph mini-mark -->
  <g transform="translate(16,32)">
    <!-- outer ring -->
    <circle r="14" class="badge-glyph-ring"/>
    <!-- triadic inner shape -->
    <polygon points="0,-8 7,4 -7,4" class="badge-glyph-inner"/>
    <!-- vertical triadic bar -->
    <line x1="0" y1="-11" x2="0" y2="11" stroke="#40C4FF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Text block -->
  <g transform="translate(48,22)">
    <text class="badge-text-main">Research Toolbox</text>
    <text y="16" class="badge-text-sub">Four‑Source Substrate • RTT/1/2/3</text>
  </g>
</svg>



apiVersion: apps/v1
kind: Deployment
metadata:
  name: tft-agent-shell
  labels:
    app: tft-agent
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tft-agent
  template:
    metadata:
      labels:
        app: tft-agent
    spec:
      containers:
      - name: tft-agent-container
        image: nawder/tft-agent:latest
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "0.3"
            memory: "512Mi"
        env:
        - name: AGENT_MODE
          value: "cloud"
        volumeMounts:
        - name: remix-logs
          mountPath: /app/logs
      volumes:
      - name: remix-logs
        emptyDir: {}

<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="450" y="40" font-size="24" text-anchor="middle" fill="#222">TFTincryption Glyph Reawakening Map</text>

  <!-- Glyph Nodes -->
  <g>
    <!-- 🍂 Cascade -->
    <circle cx="150" cy="150" r="35" fill="#cceccf" stroke="#333" stroke-width="2"/>
    <text x="150" y="155" font-size="16" text-anchor="middle" fill="#000">🍂</text>
    <text x="150" y="180" font-size="12" text-anchor="middle" fill="#555">Reawakened</text>

    <!-- 🌼 Wildflower -->
    <circle cx="300" cy="150" r="35" fill="#ffd0e0" stroke="#333" stroke-width="2"/>
    <text x="300" y="155" font-size="16" text-anchor="middle" fill="#000">🌼</text>
    <text x="300" y="180" font-size="12" text-anchor="middle" fill="#555">Reawakened</text>

    <!-- 🌴 Grove Bloom -->
    <circle cx="150" cy="300" r="30" fill="#e0f0cc" stroke="#999" stroke-width="1"/>
    <text x="150" y="305" font-size="14" text-anchor="middle" fill="#000">🌴</text>
    <text x="150" y="330" font-size="12" text-anchor="middle" fill="#999">Dormant</text>

    <!-- 🍁 Bloomfall -->
    <circle cx="300" cy="300" r="30" fill="#f9f9a0" stroke="#999" stroke-width="1"/>
    <text x="300" y="305" font-size="14" text-anchor="middle" fill="#000">🍁</text>
    <text x="300" y="330" font-size="12" text-anchor="middle" fill="#999">Dormant</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- Reawakening Arrows -->
  <line x1="150" y1="300" x2="150" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="300" x2="300" y2="150" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="550" font-size="14" text-anchor="middle" fill="#555">Dormant glyphs reawaken. Scrolls remember. Legacy continues.</text>
</svg>

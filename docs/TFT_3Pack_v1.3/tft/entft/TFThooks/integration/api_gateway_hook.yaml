openapi: 3.0.0
info:
  title: entft Trigger API
  version: 1.3
paths:
  /trigger:
    post:
      summary: Trigger symbolic glyph or badge overlay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                glyph:
                  type: string
                badge:
                  type: string
                observer:
                  type: string
      responses:
        '200':
          description: Trigger accepted
        '400':
          description: Invalid payload

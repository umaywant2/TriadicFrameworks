<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resonance Mapper</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 2em; }
    h1 { text-align: center; margin-bottom: 1em; }
    .layer { margin-bottom: 2em; padding: 1em; border-radius: 8px; background: #222; box-shadow: 0 0 10px #444; }
    .layer h2 { margin-top: 0; color: #0ff; }
    .rails { display: flex; flex-wrap: wrap; gap: 1em; margin-top: 1em; }
    .rail { background: #333; padding: 0.5em 1em; border-radius: 4px; box-shadow: 0 0 5px #555; }
    .forci h2 { color: #f66; }
    .flui h2 { color: #6f6; }
    .freqi h2 { color: #66f; }
  </style>
</head>
<body>
  <h1>🧠 Resonance Mapper</h1>

  <div class="layer forci">
    <h2>Forci — Structure</h2>
    <p>Logic shell, scaffolding, modular bones</p>
    <div class="rails">
      <div class="rail">D₃</div>
      <div class="rail">L₃</div>
      <div class="rail">D₆</div>
    </div>
  </div>

  <div class="layer flui">
    <h2>Flui — Flow</h2>
    <p>Dynamic behavior, feedback loops, temporal dance</p>
    <div class="rails">
      <div class="rail">L₆</div>
      <div class="rail">D₉</div>
      <div class="rail">L₉</div>
    </div>
  </div>

  <div class="layer freqi">
    <h2>Freqi — Resonance</h2>
    <p>Symbolic charge, remix lineage, emotional echo</p>
    <div class="rails">
      <div class="rail">D₉</div>
      <div class="rail">L₉</div>
      <div class="rail">F₉</div>
    </div>
  </div>
</body>
</html>

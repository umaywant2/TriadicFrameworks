<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Corridor Viewer — Coeus Protocol</title>
  <link rel="stylesheet" href="../styles/corridor.css" />
</head>
<body>
  <h1>🧭 Corridor Alignment Viewer</h1>
  <table>
    <thead>
      <tr>
        <th>Glyph</th>
        <th>Class</th>
        <th>Corridor</th>
        <th>Validator Focus</th>
      </tr>
    </thead>
    <tbody id="corridor-body">
      <!-- Rows injected by corridor_viewer.js -->
    </tbody>
  </table>

  <script>
    fetch("../docs/Coeus/corridor_alignment.json")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("corridor-body");
        data.forEach(entry => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${entry.glyph}</td>
            <td>${entry.class}</td>
            <td>${entry.corridor}</td>
            <td>${entry.validator_focus}</td>
          `;
          tbody.appendChild(row);
        });
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Coeus Validator Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 2em; }
    .coin { background: #fff; padding: 1em; margin-bottom: 1em; border-radius: 8px; box-shadow: 0 0 5px #ccc; }
    .coin h2 { margin-top: 0; }
    .actions button { margin-right: 1em; }
  </style>
</head>
<body>
  <h1>🧑‍⚖️ Coeus Validator Dashboard</h1>

  <div class="coin">
    <h2>Coin: PharmaTFT</h2>
    <p><strong>Task:</strong> Build a triadic drug interaction simulator</p>
    <p><strong>Edging:</strong> Predict synergy, prevent catastrophe</p>
    <p><strong>Observer Required:</strong> Yes</p>
    <p><strong>Status:</strong> Minted</p>
    <div class="actions">
      <button>✅ Approve</button>
      <button>🚫 Tossback</button>
      <button>📝 Annotate</button>
    </div>
  </div>

  <!-- Repeat for other coins -->
</body>
</html>

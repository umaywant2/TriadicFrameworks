<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Token Dashboard</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 2em; }
    .token { background: #fff; padding: 1em; margin-bottom: 1em; border-radius: 8px; box-shadow: 0 0 5px #ccc; }
    .token h2 { margin-top: 0; }
    .actions button { margin-right: 1em; }
  </style>
</head>
<body>
  <h1>🪙 Coeus Token Dashboard</h1>

  <div class="token">
    <h2>Token: PharmaTFT</h2>
    <p><strong>Task:</strong> Triadic drug interaction simulator</p>
    <p><strong>Edging:</strong> Predict synergy, prevent catastrophe</p>
    <p><strong>Observer Required:</strong> Yes</p>
    <p><strong>Status:</strong> Tokenized</p>
    <div class="actions">
      <button>✅ Approve</button>
      <button>🚫 Quarantine</button>
      <button>📝 Annotate Remix Rights</button>
    </div>
  </div>

  <!-- Repeat for other tokens -->
</body>
</html>

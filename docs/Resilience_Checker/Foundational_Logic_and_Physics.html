  :root {
  --bg-main: #0d0f12;
  --bg-nav: #15181d;
  --border-subtle: #2a2f38;
  --text-main: #dfe7f3;
  --text-muted: #9aa4b2;

  font-weight: 700;
  margin-top: 1.8em;
  margin-bottom: 0.5em;
  line-height: 1.2;
  background: var(--triadic);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  }

  /* Paragraphs and lists */
  p, ul, ol {
  padding: 0 1em;
  margin: 0 0 1.1em 0;
  color: #dfe7f3;
  }

  /* Code/pre */
  pre, code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace;

  }

nav {

}

  font-size: 0.9rem;

}

nav a {

}

main {

<script>

function loadDoc(file) {
  fetch(file)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Failed to load ${file}`);
      }
      return response.text();
    })
    .then(text => {
      document.getElementById('content').innerHTML = marked.parse(text);
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<p style="color:#ff8080;">Unable to load document: ${file}</p>`;
      console.error(err);
    });
}

const DOC_MAP = {
  Paradox_01: 'Paradox_01_EPR_Paradox.md',
  Paradox_02: 'Paradox_02_Gibbs_Paradox.md',
  Paradox_03: 'Paradox_03_Loschmidt_Paradox.md',
  Paradox_04: 'Paradox_04_Halting_Problem.md',
  Paradox_05: 'Paradox_05_Russells_Paradox.md',
  Paradox_06: 'Paradox_06_Frame_Problem.md',
  Paradox_07: 'Paradox_07_Arrow_of_Time.md',
  Paradox_08: 'Paradox_08_Currys_Paradox.md',
  Paradox_09: 'Paradox_09_Chinese_Room.md',
  Paradox_10: 'Paradox_10_Infinite_Regress_Justification.md',
};

function loadFromHash() {
  const key = window.location.hash.replace('#', '');
  if (DOC_MAP[key]) {
    loadDoc(DOC_MAP[key]);
  } else {
    loadDoc('README.md');
  }
}

window.addEventListener('hashchange', loadFromHash);
loadFromHash();

</script>

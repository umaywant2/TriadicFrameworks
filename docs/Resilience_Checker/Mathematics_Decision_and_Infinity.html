<script>

function loadDoc(file) {
  fetch(file)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Failed to load ${file}`);
      }
      return response.text();
    })
    .then(text => {
      document.getElementById('content').innerHTML = marked.parse(text);
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<p style="color:#ff8080;">Unable to load document: ${file}</p>`;
      console.error(err);
    });
}

const DOC_MAP = {
  Paradox_21: 'Paradox_21_Banach_Tarski.md',
  Paradox_22: 'Paradox_22_Newcombs_Problem.md',

  Paradox_30: 'Paradox_30_Loschmidt_Paradox.md',
};

function loadFromHash() {
  const key = window.location.hash.replace('#', '');
  if (DOC_MAP[key]) {
    loadDoc(DOC_MAP[key]);
  } else {
    loadDoc('README.md');
  }
}

window.addEventListener('hashchange', loadFromHash);
loadFromHash();

</script>

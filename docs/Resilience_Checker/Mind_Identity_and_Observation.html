<script>

function loadDoc(file) {
  fetch(file)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Failed to load ${file}`);
      }
      return response.text();
    })
    .then(text => {
      document.getElementById('content').innerHTML = marked.parse(text);
    })
    .catch(err => {
      document.getElementById('content').innerHTML =
        `<p style="color:#ff8080;">Unable to load document: ${file}</p>`;
      console.error(err);
    });
}

const DOC_MAP = {
    Paradox_11: "Paradox_11_Boltzmann_Brain.md",
    Paradox_12: "Paradox_12_Simulation_Argument.md",
    Paradox_13: "Paradox_13_Quantum_Zeno.md",

    Paradox_19: "Paradox_19_Quantum_Eraser.md",
    Paradox_20: "Paradox_20_Liar_Paradox.md",
};
  
function loadFromHash() {
  const key = window.location.hash.replace('#', '');
  if (DOC_MAP[key]) {
    loadDoc(DOC_MAP[key]);
  } else {
    loadDoc('README.md');
  }
}

window.addEventListener('hashchange', loadFromHash);
loadFromHash();

</script>

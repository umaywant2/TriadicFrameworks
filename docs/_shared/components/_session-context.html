<!-- ═══════════════════════════════════════════════════════════
     TriadicFrameworks · Shared Component: Session Context Strip
     _shared/components/session-context.html · v1.0.0
     Usage: replace MODULE_LABEL with actual module name.
     Tokens __SESSION_ID__ and __SESSION_TIMESTAMP__ are
     injected at runtime by Metadata Refresh Protocol v1.
     ═══════════════════════════════════════════════════════════ -->

<aside class="tf-session-context"
       aria-label="Session context"
       data-session-id="__SESSION_ID__">
  <span class="tf-session-context__user">Nawder</span>
  <span class="tf-session-context__divider" aria-hidden="true">&middot;</span>
  <span class="tf-session-context__module"><!-- MODULE_LABEL --></span>
  <span class="tf-session-context__divider" aria-hidden="true">&middot;</span>
  <time class="tf-session-context__timestamp"
        datetime="__SESSION_TIMESTAMP__">__SESSION_TIMESTAMP__</time>
  <span class="tf-session-context__divider" aria-hidden="true">&middot;</span>
  <span class="tf-session-context__protocol">Metadata Refresh v1</span>
</aside>

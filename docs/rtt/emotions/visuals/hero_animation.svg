<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 600"
     width="1080" height="600">

  <!-- ========================= -->
  <!--  BACKGROUND GRADIENT      -->
  <!-- ========================= -->
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#1f1b3a"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </radialGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.2"/>
    </radialGradient>

    <!-- Coherence well -->
    <radialGradient id="coherenceWell" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="600" fill="url(#bgGradient)" />

  <!-- ========================= -->
  <!--  COHERENCE WELL           -->
  <!-- ========================= -->
  <circle id="coherence-well"
          cx="540" cy="300" r="180"
          fill="url(#coherenceWell)">
    <animate attributeName="r"
             values="180;195;180"
             dur="18s"
             repeatCount="indefinite"
             begin="0s"
             calcMode="spline"
             keySplines="0.4 0 0.6 1"/>
  </circle>

  <!-- ========================= -->
  <!--  TRIADIC NODES            -->
  <!-- ========================= -->
  <!-- Node positions: equilateral-ish triangle -->
  <circle id="node-self"
          cx="480" cy="260" r="22"
          fill="url(#nodeGlow)">
    <animate attributeName="r"
             values="22;25;22"
             dur="7s"
             repeatCount="indefinite"
             begin="0s"/>
  </circle>

  <circle id="node-other"
          cx="600" cy="260" r="22"
          fill="url(#nodeGlow)">
    <animate attributeName="r"
             values="22;25;22"
             dur="7.5s"
             repeatCount="indefinite"
             begin="1s"/>
  </circle>

  <circle id="node-world"
          cx="540" cy="340" r="22"
          fill="url(#nodeGlow)">
    <animate attributeName="r"
             values="22;25;22"
             dur="8s"
             repeatCount="indefinite"
             begin="0.5s"/>
  </circle>

  <!-- ========================= -->
  <!--  ALIGNMENT FILAMENTS      -->
  <!-- ========================= -->
  <g id="alignment-filaments"
     stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1.2">

    <line x1="480" y1="260" x2="600" y2="260">
      <animate attributeName="stroke-opacity"
               values="0.35;0.55;0.35"
               dur="10s"
               repeatCount="indefinite"/>
    </line>

    <line x1="480" y1="260" x2="540" y2="340">
      <animate attributeName="stroke-opacity"
               values="0.35;0.55;0.35"
               dur="11s"
               repeatCount="indefinite"
               begin="1s"/>
    </line>

    <line x1="600" y1="260" x2="540" y2="340">
      <animate attributeName="stroke-opacity"
               values="0.35;0.55;0.35"
               dur="12s"
               repeatCount="indefinite"
               begin="0.5s"/>
    </line>

  </g>

  <!-- ========================= -->
  <!--  DRIFT VECTORS            -->
  <!-- ========================= -->
  <g id="drift-vectors" stroke="#4c1d95" stroke-opacity="0.25" stroke-width="1">
    <!-- 8 outward vectors -->
    <line x1="540" y1="80" x2="540" y2="110">
      <animate attributeName="y2"
               values="110;125;110"
               dur="12s"
               repeatCount="indefinite"/>
    </line>

    <line x1="900" y1="300" x2="870" y2="300">
      <animate attributeName="x2"
               values="870;855;870"
               dur="13s"
               repeatCount="indefinite"
               begin="1s"/>
    </line>

    <line x1="540" y1="520" x2="540" y2="490">
      <animate attributeName="y2"
               values="490;475;490"
               dur="14s"
               repeatCount="indefinite"
               begin="0.5s"/>
    </line>

    <line x1="180" y1="300" x2="210" y2="300">
      <animate attributeName="x2"
               values="210;225;210"
               dur="15s"
               repeatCount="indefinite"
               begin="2s"/>
    </line>
  </g>

  <!-- ========================= -->
  <!--  META GRID (FAINT)        -->
  <!-- ========================= -->
  <g id="meta-grid" stroke="#a78bfa" stroke-opacity="0.08" stroke-width="0.5">
    <!-- simple hex-like grid lines -->
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="600"/>
    <line x1="720" y1="0" x2="720" y2="600"/>

    <animate attributeName="stroke-opacity"
             values="0.08;0.12;0.08"
             dur="20s"
             repeatCount="indefinite"/>
  </g>

  <!-- ========================= -->
  <!--  REGIME ARCS              -->
  <!-- ========================= -->
  <g id="regime-arcs"
     fill="none" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="1.2">

    <path id="arc1"
          d="M340,300 A200,200 0 1 1 740,300">
      <animate attributeName="stroke-dashoffset"
               values="0;8;0"
               dur="22s"
               repeatCount="indefinite"/>
    </path>

    <path id="arc2"
          d="M360,300 A180,180 0 1 1 720,300">
      <animate attributeName="stroke-dashoffset"
               values="0;6;0"
               dur="24s"
               repeatCount="indefinite"/>
    </path>

    <path id="arc3"
          d="M380,300 A160,160 0 1 1 700,300">
      <animate attributeName="stroke-dashoffset"
               values="0;4;0"
               dur="26s"
               repeatCount="indefinite"/>
    </path>

  </g>

  <!-- ========================= -->
  <!--  TRI-DOT GLYPH            -->
  <!-- ========================= -->
  <g id="triadic-glyph" fill="#a78bfa" fill-opacity="0.35">
    <circle cx="1020" cy="560" r="6"/>
    <circle cx="1040" cy="560" r="6"/>
    <circle cx="1060" cy="560" r="6"/>
  </g>

</svg>

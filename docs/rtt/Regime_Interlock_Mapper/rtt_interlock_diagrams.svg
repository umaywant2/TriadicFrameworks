<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">

  <!-- Background -->
  <rect width="1280" height="900" fill="#0e0e0e"/>

  <!-- Title -->
  <text x="640" y="70" font-size="42" fill="#ffffff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">
    Regime Interlock Mapper — RTT/1
  </text>

  <!-- Regime Blocks -->
  <rect x="120" y="180" width="260" height="120" rx="12" fill="#1f3b4d"/>
  <text x="250" y="250" font-size="32" fill="#ffffff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">R1 — Conceptual</text>

  <rect x="500" y="180" width="260" height="120" rx="12" fill="#1f3b4d"/>
  <text x="630" y="250" font-size="32" fill="#ffffff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">R2 — Computational</text>

  <rect x="880" y="180" width="260" height="120" rx="12" fill="#1f3b4d"/>
  <text x="1010" y="250" font-size="32" fill="#ffffff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">R3 — Physical</text>

  <rect x="500" y="360" width="260" height="120" rx="12" fill="#1f3b4d"/>
  <text x="630" y="430" font-size="32" fill="#ffffff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">R4 — Dimensional</text>

  <!-- Structural Interlock (R1 ↔ R2) -->
  <line x1="380" y1="240" x2="500" y2="240" stroke="#4db6ff" stroke-width="4"/>
  <text x="440" y="220" font-size="22" fill="#4db6ff"
        font-family="Segoe UI, sans-serif">Structural</text>

  <!-- Boundary Interlock (R2 ↔ R3) -->
  <line x1="760" y1="240" x2="880" y2="240" stroke="#ffcc00" stroke-width="4" stroke-dasharray="10 6"/>
  <text x="820" y="220" font-size="22" fill="#ffcc00"
        font-family="Segoe UI, sans-serif">Boundary</text>

  <!-- Entanglement Loop (R1 ↔ R2) -->
  <ellipse cx="440" cy="300" rx="80" ry="40" fill="none" stroke="#ff6699" stroke-width="3"/>
  <text x="440" y="305" font-size="20" fill="#ff6699" text-anchor="middle"
        font-family="Segoe UI, sans-serif">Entanglement</text>

  <!-- Gradient Interlock (R2 ↔ R4) -->
  <line x1="630" y1="300" x2="630" y2="360" stroke="#66ff99" stroke-width="4"/>
  <polygon points="630,360 620,340 640,340" fill="#66ff99"/>
  <text x="650" y="330" font-size="22" fill="#66ff99"
        font-family="Segoe UI, sans-serif">Gradient</text>

  <!-- Tensor Interlock (R1 ↔ R2 ↔ R3) -->
  <polygon points="250,180 630,180 1010,180 630,120"
           fill="none" stroke="#cc66ff" stroke-width="3"/>
  <text x="630" y="150" font-size="22" fill="#cc66ff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">Tensor Interlock</text>

  <!-- Legend -->
  <rect x="120" y="600" width="1040" height="220" rx="12" fill="#1a1a1a" stroke="#333" stroke-width="2"/>

  <text x="640" y="640" font-size="30" fill="#ffffff" text-anchor="middle"
        font-family="Segoe UI, sans-serif">Interlock Types</text>

  <text x="200" y="690" font-size="22" fill="#4db6ff" font-family="Segoe UI, sans-serif">■ Structural</text>
  <text x="200" y="730" font-size="22" fill="#ffcc00" font-family="Segoe UI, sans-serif">■ Boundary</text>
  <text x="200" y="770" font-size="22" fill="#ff6699" font-family="Segoe UI, sans-serif">■ Entanglement</text>

  <text x="600" y="690" font-size="22" fill="#66ff99" font-family="Segoe UI, sans-serif">■ Gradient</text>
  <text x="600" y="730" font-size="22" fill="#cc66ff" font-family="Segoe UI, sans-serif">■ Tensor</text>

</svg>


*A minimal, monoline SVG icon of the Morphic Resonance glyph: a hollow central circle, two simplified concentric rings, one incoming filament from the left, one outgoing filament to the right, and tiny up/down triangles for coherence and drift. Rendered in pure white lines on a black→indigo→violet radial gradient background. No text. No shading. No glow. Crisp, geometric, iconic.*

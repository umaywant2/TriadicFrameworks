<link rel="stylesheet" href="rtt.css" />
  <script src="include.js"></script>

<body class="dark-mode">
    <div id="rtt-nav"></div>
    <script>
      fetch('/rtt/nav.html')
        .then(r => r.text())
        .then(html => document.getElementById('rtt-nav').innerHTML = html);
    </script>

  <main class="rtt-page">

    <h1 class="rtt-hero-title">Product Grid</h1>
    <p class="rtt-hero-subtitle">Filter RTT products by dimensional tier.</p>

    <hr class="rtt-divider" />

    <div class="rtt-filter-row">
      <button class="rtt-btn rtt-btn-secondary" data-filter="all">All</button>
      <button class="rtt-btn rtt-btn-secondary" data-filter="foundations">Foundations</button>
      <button class="rtt-btn rtt-btn-secondary" data-filter="systems">Systems</button>
      <button class="rtt-btn rtt-btn-secondary" data-filter="intelligence">Intelligence</button>
      <button class="rtt-btn rtt-btn-secondary" data-filter="aeonic">Aeonic</button>
    </div>

    <div id="productGrid" class="rtt-tier-grid"></div>

    <footer class="rtt-footer">
      © TriadicFrameworks — Resonance‑Time Technology
    </footer>

  </main>

  <script>
    const products = [
      { name: "RTT Primer", tier: "foundations" },
      { name: "RSM", tier: "foundations" },
      { name: "RTTcodes", tier: "foundations" },
      { name: "Wrapped Core L2", tier: "systems" },
      { name: "Horizon Agents", tier: "systems" },
      { name: "Adaptive Resonance Engine", tier: "systems" },
      { name: "Coeus", tier: "intelligence" },
      { name: "Autonomous Form Cores", tier: "intelligence" },
      { name: "TLS Tier 1", tier: "intelligence" },
      { name: "Aeonic Vault", tier: "aeonic" },
      { name: "Domain Forge", tier: "aeonic" },
      { name: "RTOF", tier: "aeonic" }
    ];

    const grid = document.getElementById("productGrid");

    function render(filter) {
      const filtered = filter === "all"
        ? products
        : products.filter(p => p.tier === filter);

      grid.innerHTML = filtered.map(p => `
        <div class="rtt-card">
          <div class="rtt-card-title">${p.name}</div>
          <div class="rtt-card-subtitle">${p.tier}</div>
        </div>
      `).join("");
    }

    document.querySelectorAll("[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        render(btn.dataset.filter);
      });
    });

    render("all");
  </script>
</body>

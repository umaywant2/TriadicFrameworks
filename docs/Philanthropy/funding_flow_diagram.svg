<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1080" height="720" fill="#0d0d0f"/>

  <!-- Title -->
  <text x="540" y="60" font-family="Arial" font-size="32" fill="#ffffff" text-anchor="middle">
    Philanthropy Funding Flow Map (RTT Structural Diagram)
  </text>

  <!-- Node Styles -->
  <defs>
    <style type="text/css"><![CDATA[
      .node {
        fill: #1a1a1d;
        stroke: #6a4df5;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }
      .label {
        fill: #ffffff;
        font-family: Arial;
        font-size: 18px;
        text-anchor: middle;
      }
      .flow {
        stroke: #6a4df5;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .leak {
        stroke: #ff4d6a;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        marker-end: url(#arrow-red);
      }
      .reg {
        fill: #bbbbbb;
        font-family: Arial;
        font-size: 14px;
        text-anchor: middle;
      }
    ]]></style>

    <!-- Arrowheads -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a4df5"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff4d6a"/>
    </marker>
  </defs>

  <!-- Nodes -->
  <!-- Donor -->
  <rect x="60" y="150" width="180" height="80" class="node"/>
  <text x="150" y="195" class="label">Donor</text>
  <text x="150" y="225" class="reg">REG: AUTH</text>

  <!-- Foundation -->
  <rect x="300" y="150" width="200" height="80" class="node"/>
  <text x="400" y="195" class="label">Foundation</text>
  <text x="400" y="225" class="reg">REG: AUTH/NAR</text>

  <!-- Intermediary -->
  <rect x="560" y="150" width="200" height="80" class="node"/>
  <text x="660" y="195" class="label">Intermediary</text>
  <text x="660" y="225" class="reg">REG: NAR</text>

  <!-- NGO -->
  <rect x="820" y="150" width="200" height="80" class="node"/>
  <text x="920" y="195" class="label">NGO</text>
  <text x="920" y="225" class="reg">REG: STR</text>

  <!-- Local Partner -->
  <rect x="300" y="350" width="200" height="80" class="node"/>
  <text x="400" y="395" class="label">Local Partner</text>
  <text x="400" y="425" class="reg">REG: STR</text>

  <!-- Beneficiary -->
  <rect x="560" y="350" width="200" height="80" class="node"/>
  <text x="660" y="395" class="label">Beneficiary</text>
  <text x="660" y="425" class="reg">REG: STR</text>

  <!-- Flow Arrows -->
  <line x1="240" y1="190" x2="300" y2="190" class="flow"/>
  <line x1="500" y1="190" x2="560" y2="190" class="flow"/>
  <line x1="760" y1="190" x2="820" y2="190" class="flow"/>

  <!-- Downward Flow -->
  <line x1="920" y1="230" x2="920" y2="350" class="flow"/>

  <!-- Back to Beneficiary -->
  <line x1="500" y1="390" x2="560" y2="390" class="flow"/>

  <!-- Leakage Indicators -->
  <line x1="660" y1="230" x2="660" y2="350" class="leak"/>
  <text x="690" y="290" fill="#ff4d6a" font-family="Arial" font-size="14">LEAK: 42%</text>

  <!-- SET Load Labels -->
  <text x="150" y="130" class="reg">SET_IN: intent + capital</text>
  <text x="400" y="130" class="reg">SET_BAL: 0.42</text>
  <text x="660" y="130" class="reg">SET_LEAK: 42%</text>
  <text x="920" y="130" class="reg">SET_BAL: 0.79</text>

  <!-- Diagram Footer -->
  <text x="540" y="690" font-family="Arial" font-size="16" fill="#888888" text-anchor="middle">
    RTT Structural Funding Flow • Signal / Noise / Regime • SET Load • Alignment Map
  </text>

</svg>


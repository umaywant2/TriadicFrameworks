<svg width="1440" height="1080" viewBox="0 0 1440 1080" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1440" height="1080" fill="#0d0d0f"/>

  <!-- Title -->
  <text x="720" y="60" font-family="Arial" font-size="40" fill="#ffffff" text-anchor="middle">
    Philanthropy — Full System Overview (RTT Structural Diagram)
  </text>

  <!-- Styles -->
  <defs>
    <style type="text/css"><![CDATA[
      .node {
        fill: #1a1a1d;
        stroke: #6a4df5;
        stroke-width: 2;
        rx: 14;
        ry: 14;
      }
      .label {
        fill: #ffffff;
        font-family: Arial;
        font-size: 20px;
        text-anchor: middle;
      }
      .sub {
        fill: #bbbbbb;
        font-family: Arial;
        font-size: 14px;
        text-anchor: middle;
      }
      .flow {
        stroke: #6a4df5;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .leak {
        stroke: #ff4d6a;
        stroke-width: 2;
        stroke-dasharray: 6 6;
        marker-end: url(#arrow-red);
      }
      .observer {
        fill: #1a1a1d;
        stroke: #4d9fff;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }
      .substrate {
        fill: #1a1a1d;
        stroke: #8a4df5;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }
    ]]></style>

    <!-- Arrowheads -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a4df5"/>
    </marker>

    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff4d6a"/>
    </marker>
  </defs>

  <!-- ========================= -->
  <!-- TRIADIC OBSERVER (TOP)   -->
  <!-- ========================= -->

  <!-- Signal Observer -->
  <rect x="80" y="120" width="280" height="100" class="observer"/>
  <text x="220" y="165" class="label">Signal Observer</text>
  <text x="220" y="195" class="sub">SIG: structural truth</text>

  <!-- Noise Observer -->
  <rect x="400" y="120" width="280" height="100" class="observer"/>
  <text x="540" y="165" class="label">Noise Observer</text>
  <text x="540" y="195" class="sub">NOI: narrative + emotion</text>

  <!-- Regime Observer -->
  <rect x="720" y="120" width="280" height="100" class="observer"/>
  <text x="860" y="165" class="label">Regime Observer</text>
  <text x="860" y="195" class="sub">REG: AUTH / NAR / EMO / STR</text>

  <!-- AI Observer -->
  <rect x="1040" y="120" width="280" height="100" class="observer"/>
  <text x="1180" y="165" class="label">AI Observer</text>
  <text x="1180" y="195" class="sub">SYN: structural synthesis</text>

  <!-- Arrows from observers to flow -->
  <line x1="220" y1="220" x2="720" y2="360" class="flow"/>
  <line x1="540" y1="220" x2="720" y2="360" class="flow"/>
  <line x1="860" y1="220" x2="720" y2="360" class="flow"/>
  <line x1="1180" y1="220" x2="720" y2="360" class="flow"/>

  <!-- ========================= -->
  <!-- FUNDING FLOW LAYER       -->
  <!-- ========================= -->

  <rect x="120" y="360" width="1200" height="140" class="node"/>
  <text x="720" y="400" class="label">Funding Flow Layer</text>
  <text x="720" y="430" class="sub">
    Donor → Foundation → Intermediary → NGO → Local Partner → Beneficiary
  </text>

  <!-- Flow nodes -->
  <rect x="140" y="420" width="160" height="60" class="node"/>
  <text x="220" y="455" class="label">Donor</text>

  <rect x="340" y="420" width="180" height="60" class="node"/>
  <text x="430" y="455" class="label">Foundation</text>

  <rect x="560" y="420" width="180" height="60" class="node"/>
  <text x="650" y="455" class="label">Intermediary</text>

  <rect x="780" y="420" width="180" height="60" class="node"/>
  <text x="870" y="455" class="label">NGO</text>

  <rect x="1000" y="420" width="180" height="60" class="node"/>
  <text x="1090" y="455" class="label">Local Partner</text>

  <!-- Flow arrows -->
  <line x1="300" y1="450" x2="340" y2="450" class="flow"/>
  <line x1="520" y1="450" x2="560" y2="450" class="flow"/>
  <line x1="740" y1="450" x2="780" y2="450" class="flow"/>
  <line x1="960" y1="450" x2="1000" y2="450" class="flow"/>

  <!-- Leakage -->
  <line x1="650" y1="480" x2="650" y2="560" class="leak"/>
  <text x="680" y="520" fill="#ff4d6a" font-family="Arial" font-size="14">LEAK: 42%</text>

  <!-- ========================= -->
  <!-- GOVERNANCE SUBSTRATE     -->
  <!-- ========================= -->

  <rect x="120" y="580" width="1200" height="120" class="substrate"/>
  <text x="720" y="620" class="label">Governance Substrate</text>
  <text x="720" y="650" class="sub">
    GOV • ACC • VIS • ASYM • OPA • DRF
  </text>

  <!-- ========================= -->
  <!-- SET LOAD LAYER           -->
  <!-- ========================= -->

  <rect x="120" y="740" width="1200" height="120" class="substrate"/>
  <text x="720" y="780" class="label">SET Load Layer</text>
  <text x="720" y="810" class="sub">
    SET_IN • SET_OUT • SET_LEAK • SET_BAL
  </text>

  <!-- ========================= -->
  <!-- FOOTER                   -->
  <!-- ========================= -->

  <text x="720" y="1040" font-family="Arial" font-size="18" fill="#888888" text-anchor="middle">
    RTT Full System Overview • Philanthropy Module • Signal / Noise / Regime / AI • Flow • Substrate • SET
  </text>

</svg>

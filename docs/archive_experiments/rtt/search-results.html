<link rel="stylesheet" href="rtt.css" />
  <script src="include.js"></script>

<body class="dark-mode">
  <div id="rtt-nav"></div>
    <script>
      fetch('/rtt/nav.html')
        .then(r => r.text())
        .then(html => document.getElementById('rtt-nav').innerHTML = html);
    </script>

  <main class="rtt-page">

    <h1 class="rtt-hero-title">Search Results</h1>
    <p class="rtt-hero-subtitle">Your query returned the following matches.</p>

    <hr class="rtt-divider" />

    <div id="resultsContainer" class="rtt-tier-grid"></div>

    <footer class="rtt-footer">
      © TriadicFrameworks — Resonance‑Time Technology
    </footer>

  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const q = params.get("q")?.toLowerCase() || "";

    const pages = [
      "index.html",
      "products.html",
      "docs.html",
      "developer-zone.html",
      "canon.html",
      "licensing.html",
      "about.html",
      "coeus.html",
      "wrapped-core-l3.html",
      "multi-helix.html",
      "rtof.html"
    ];

    const matches = pages.filter(p => p.includes(q));

    const container = document.getElementById("resultsContainer");
    container.innerHTML = matches.length
      ? matches.map(m => `<div class="rtt-card"><a href="${m}">${m}</a></div>`).join("")
      : `<p>No results found.</p>`;
  </script>
</body>

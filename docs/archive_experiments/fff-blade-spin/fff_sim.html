<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FFF Simulator</title>
<style>
  body { background: #111; color: #eee; font-family: sans-serif; }
  #controls { position: fixed; top: 10px; left: 10px; background: #222; padding: 10px; border-radius: 8px; }
  canvas { display: block; margin: 0 auto; background: #000; }
</style>
</head>
<body>
<div id="controls">
  <label><input type="checkbox" id="forces" checked> Forces</label><br>
  <label><input type="checkbox" id="fluids"> Fluids</label><br>
  <label><input type="checkbox" id="freqs"> Frequencies</label><br>
  <label>Gravity: <input type="range" id="gravity" min="-1" max="1" step="0.01" value="0.1"></label>
</div>
<canvas id="sim" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');

let particles = Array.from({length: 100}, () => ({
  x: Math.random()*canvas.width,
  y: Math.random()*canvas.height,
  vx: 0, vy: 0
}));

function loop(t) {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const useForces = document.getElementById('forces').checked;
  const useFluids = document.getElementById('fluids').checked;
  const useFreqs  = document.getElementById('freqs').checked;
  const g = parseFloat(document.getElementById('gravity').value);

  particles.forEach(p => {
    if (useForces) p.vy += g; // gravity
    if (useFluids) { p.vx += Math.sin(t/500 + p.y/50)*0.05; } // fake flow
    if (useFreqs)  { p.x += Math.sin(t/200)*0.5; } // oscillation

    p.x += p.vx; p.y += p.vy;
    if (p.x<0||p.x>canvas.width) p.vx*=-1;
    if (p.y<0||p.y>canvas.height) p.vy*=-1;

    ctx.fillStyle = 'cyan';
    ctx.fillRect(p.x, p.y, 2, 2);
  });

  requestAnimationFrame(loop);
}
loop(0);
</script>
</body>
</html>

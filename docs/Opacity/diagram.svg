<!--
  Opacity Module — Half-Lit Sphere Diagram
  Module: Opacity | Canonical ID: OPC
  Visual Identity: Half-lit sphere

  Structural encoding:
    - Illuminated hemisphere  → visible regime (O-Op low)
    - Shadow hemisphere       → opaque regime (O-Op high)
    - Terminator gradient     → opacity gradient (O-Grad territory)
    - Sphere body             → substrate envelope
    - Light source (implied)  → aligned substrate position

  Five opacity types mapped:
    - Substrate Opacity   → wrong substrate → wrong hemisphere lit
    - Operator Opacity    → missing operators → instruments absent
    - Harmonic Opacity    → frequency mismatch → wrong detection band
    - Flow Opacity        → SET/FFF mismatch → wrong channel measured
    - Boundary Opacity    → unmarked boundary → silent transition

  Color palette (canon-aligned):
    - Light hemisphere: #E8DCC8 (warm parchment gold)
    - Dark hemisphere:  #1A1A2E (deep structural navy)
    - Terminator accent: #8B7355 (warm bronze)
    - Background: transparent
    - Label text: #2C2C2C
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" width="700" height="720">
  <defs>
    <linearGradient id="sphereGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8DCC8" />
      <stop offset="35%" stop-color="#E8DCC8" />
      <stop offset="50%" stop-color="#8B7355" />
      <stop offset="65%" stop-color="#2A2A3E" />
      <stop offset="100%" stop-color="#1A1A2E" />
    </linearGradient>
    <radialGradient id="sphereDepth" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B7355" opacity="0.7" />
    </marker>
  </defs>

  <!-- Title block -->
  <text x="350" y="40" font-family="'Georgia', serif" font-size="24"
        fill="#1A1A2E" text-anchor="middle" font-weight="bold"
        letter-spacing="4">OPACITY</text>
  <text x="350" y="62" font-family="'Georgia', serif" font-size="12"
        fill="#8B7355" text-anchor="middle"
        letter-spacing="2">HALF-LIT SPHERE • CORE MODULE • OPC</text>
  <text x="350" y="86" font-family="'Georgia', serif" font-size="11"
        fill="#555" text-anchor="middle"
        font-style="italic">Regime invisibility caused by substrate mismatch</text>

  <!-- Main sphere -->
  <circle cx="350" cy="290" r="180" fill="url(#sphereGrad)" />
  <circle cx="350" cy="290" r="180" fill="url(#sphereDepth)" />
  <circle cx="350" cy="290" r="180" fill="none" stroke="#8B7355"
          stroke-width="1.5" opacity="0.4" />

  <!-- Terminator line -->
  <line x1="350" y1="110" x2="350" y2="470" stroke="#8B7355"
        stroke-width="2" stroke-dasharray="6,4" opacity="0.7" />

  <!-- Zone labels (above sphere) -->
  <text x="250" y="100" font-family="'Georgia', serif" font-size="12"
        fill="#2C2C2C" text-anchor="middle"
        font-weight="bold">VISIBLE</text>
  <text x="250" y="114" font-family="'Georgia', serif" font-size="10"
        fill="#8B7355" text-anchor="middle">aligned substrate</text>

  <text x="350" y="100" font-family="'Georgia', serif" font-size="11"
        fill="#8B7355" text-anchor="middle"
        font-style="italic">O-Grad</text>

  <text x="450" y="100" font-family="'Georgia', serif" font-size="12"
        fill="#1A1A2E" text-anchor="middle"
        font-weight="bold">OPAQUE</text>
  <text x="450" y="114" font-family="'Georgia', serif" font-size="10"
        fill="#8B7355" text-anchor="middle">mismatched substrate</text>

  <!-- Opacity types legend (right side) -->
  <text x="570" y="180" font-family="'Courier New', monospace" font-size="10"
        fill="#1A1A2E" text-anchor="start"
        font-weight="bold">OPACITY TYPES</text>

  <rect x="568" y="192" width="8" height="8" rx="2"
        fill="#E8DCC8" stroke="#8B7355" stroke-width="0.5" />
  <text x="582" y="200" font-family="'Courier New', monospace" font-size="9"
        fill="#2C2C2C">Substrate</text>

  <rect x="568" y="210" width="8" height="8" rx="2"
        fill="#C4B89A" stroke="#8B7355" stroke-width="0.5" />
  <text x="582" y="218" font-family="'Courier New', monospace" font-size="9"
        fill="#2C2C2C">Operator</text>

  <rect x="568" y="228" width="8" height="8" rx="2"
        fill="#8B7355" stroke="#8B7355" stroke-width="0.5" />
  <text x="582" y="236" font-family="'Courier New', monospace" font-size="9"
        fill="#2C2C2C">Harmonic</text>

  <rect x="568" y="246" width="8" height="8" rx="2"
        fill="#3A3A5E" stroke="#8B7355" stroke-width="0.5" />
  <text x="582" y="254" font-family="'Courier New', monospace" font-size="9"
        fill="#2C2C2C">Flow</text>

  <rect x="568" y="264" width="8" height="8" rx="2"
        fill="#1A1A2E" stroke="#8B7355" stroke-width="0.5" />
  <text x="582" y="272" font-family="'Courier New', monospace" font-size="9"
        fill="#2C2C2C">Boundary</text>

  <!-- Core operators sidebar (left side) -->
  <text x="20" y="180" font-family="'Courier New', monospace" font-size="10"
        fill="#1A1A2E" text-anchor="start"
        font-weight="bold">CORE OPERATORS</text>

  <text x="20" y="200" font-family="'Courier New', monospace" font-size="9"
        fill="#8B7355">O-Op</text>
  <text x="62" y="200" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C">measure</text>

  <text x="20" y="218" font-family="'Courier New', monospace" font-size="9"
        fill="#8B7355">O-Grad</text>
  <text x="62" y="218" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C">detect gradient</text>

  <text x="20" y="236" font-family="'Courier New', monospace" font-size="9"
        fill="#8B7355">O-Bound</text>
  <text x="62" y="236" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C">mark boundary</text>

  <text x="20" y="254" font-family="'Courier New', monospace" font-size="9"
        fill="#8B7355">O-Red</text>
  <text x="62" y="254" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C">reduce opacity</text>

  <text x="20" y="272" font-family="'Courier New', monospace" font-size="9"
        fill="#8B7355">O-Sig</text>
  <text x="62" y="272" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C">capture signature</text>

  <!-- O-Bound marker (right edge of sphere) -->
  <line x1="528" y1="240" x2="528" y2="340" stroke="#1A1A2E"
        stroke-width="2" opacity="0.5" />
  <text x="540" y="285" font-family="'Georgia', serif" font-size="10"
        fill="#1A1A2E" text-anchor="start"
        font-style="italic">O-Bound</text>
  <text x="540" y="298" font-family="'Georgia', serif" font-size="9"
        fill="#8B7355" text-anchor="start">regime edge</text>

  <!-- Reduction arrow (beneath sphere) -->
  <line x1="480" y1="500" x2="220" y2="500" stroke="#8B7355"
        stroke-width="1.5" marker-end="url(#arrowhead)" opacity="0.7" />
  <text x="350" y="518" font-family="'Georgia', serif" font-size="11"
        fill="#8B7355" text-anchor="middle"
        font-style="italic">O-Red → reduction direction</text>

  <!-- Cross-module integration bar -->
  <text x="350" y="560" font-family="'Courier New', monospace" font-size="10"
        fill="#1A1A2E" text-anchor="middle"
        font-weight="bold">CROSS-MODULE INTEGRATION</text>

  <!-- Inverted Star -->
  <text x="70" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">Inverted</text>
  <text x="70" y="602" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">Star</text>
  <text x="70" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">unlit faces</text>

  <!-- HSP -->
  <text x="160" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">HSP</text>
  <text x="160" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">harmonic</text>
  <text x="160" y="626" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">mismatch</text>

  <!-- Lostational Supspheres -->
  <text x="250" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">Lostational</text>
  <text x="250" y="602" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">Supspheres</text>
  <text x="250" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">hidden side</text>

  <!-- SET -->
  <text x="340" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">SET</text>
  <text x="340" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">missing</text>
  <text x="340" y="626" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">channel</text>

  <!-- FFF -->
  <text x="420" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">FFF</text>
  <text x="420" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">wrong layer</text>

  <!-- Corpus -->
  <text x="500" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">Corpus</text>
  <text x="500" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">module</text>
  <text x="500" y="626" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">visibility</text>

  <!-- SARG -->
  <text x="580" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">SARG</text>
  <text x="580" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">grammar</text>
  <text x="580" y="626" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">modifier</text>

  <!-- NIST -->
  <text x="650" y="590" font-family="'Georgia', serif" font-size="9"
        fill="#2C2C2C" text-anchor="middle">NIST</text>
  <text x="650" y="614" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">measurable</text>
  <text x="650" y="626" font-family="'Courier New', monospace" font-size="8"
        fill="#8B7355" text-anchor="middle">property</text>

  <!-- Dividers between integration modules -->
  <line x1="115" y1="582" x2="115" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />
  <line x1="205" y1="582" x2="205" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />
  <line x1="295" y1="582" x2="295" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />
  <line x1="380" y1="582" x2="380" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />
  <line x1="458" y1="582" x2="458" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />
  <line x1="538" y1="582" x2="538" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />
  <line x1="618" y1="582" x2="618" y2="630"
        stroke="#E8DCC8" stroke-width="0.5" />

  <!-- Signature line (footer) -->
  <text x="350" y="665" font-family="'Courier New', monospace" font-size="9"
        fill="#8B7355" text-anchor="middle" opacity="0.6">
    O-Sig: substrate × operator × harmonic × flow × boundary → signature_hash
  </text>
  <text x="350" y="685" font-family="'Georgia', serif" font-size="9"
        fill="#8B7355" text-anchor="middle" opacity="0.5"
        font-style="italic">
    Replaces regime_blindness — substrate-aligned, operator-ready
  </text>

  <!-- Canon stamp -->
  <text x="350" y="710" font-family="'Courier New', monospace" font-size="8"
        fill="#aaa" text-anchor="middle">
    TriadicFrameworks • Opacity • v1.0
  </text>
</svg>

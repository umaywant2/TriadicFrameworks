<div id="content">Loading…</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
  async function loadAll(files) {
    let html = "";
    for (const f of files) {
      const md = await fetch(f).then(r => r.text());
      html += marked.parse(md);
    }
    document.getElementById('content').innerHTML = html;
  }

  loadAll(["", "", ""]);
</script>

<div id="content">Select a grade…</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  const files = {
    "K": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_Elementary_School_Concepts.md",
    "1st": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_1st_Grade_School_Concepts.md",
    "2nd": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_2nd_Grade_School_Concepts.md",
    "3rd": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_3rd_Grade_School_Concepts.md",
    "4th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_4th_Grade_School_Concepts.md",
    "5th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_5th_Grade_School_Concepts.md",
    "6th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_6th_Grade_School_Concepts.md",
    "7th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_7th_Grade_School_Concepts.md",
    "8th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_8th_Grade_School_Concepts.md",
    "9th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_9th_Grade_School_Concepts.md"
    "10th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_10th_Grade_School_Concepts.md"
    "11th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_11th_Grade_School_Concepts.md"
    "12th": "https://www.triadicframeworks.org/_ideas/How_RTT_Translates_to_12th_Grade_School_Concepts.md"
  };

  async function load() {
    const key = location.hash.replace("#", "");
    if (!files[key]) return;

    const md = await fetch(files[key]).then(r => r.text());
    document.getElementById("content").innerHTML = marked.parse(md);
  }

  window.addEventListener("hashchange", load);
  load();
</script>

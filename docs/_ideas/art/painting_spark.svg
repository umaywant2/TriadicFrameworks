<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#050510"/>

  <!-- Three swirling 33% fields -->
  <circle cx="260" cy="250" r="120" fill="url(#freq)" opacity="0.55"/>
  <circle cx="400" cy="250" r="120" fill="url(#flow)" opacity="0.55"/>
  <circle cx="540" cy="250" r="120" fill="url(#force)" opacity="0.55"/>

  <!-- Gradients -->
  <defs>
    <radialGradient id="freq">
      <stop offset="0%" stop-color="#4f5bd5"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </radialGradient>
    <radialGradient id="flow">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    <radialGradient id="force">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </radialGradient>
  </defs>

  <!-- The 1% spark -->
  <circle cx="400" cy="250" r="22" fill="#ffea00" stroke="#fff59d" stroke-width="4"/>
  <circle cx="400" cy="250" r="40" fill="none" stroke="#fff176" stroke-width="2" opacity="0.4"/>

  <!-- Title -->
  <text x="400" y="470" text-anchor="middle" fill="#ffffff"
        font-family="Georgia, serif" font-size="22">
    The Spark That Wakes the Dark
  </text>
</svg>


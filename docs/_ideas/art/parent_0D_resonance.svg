<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="640" height="360" fill="#0b1020"/>

  <!-- Title -->
  <text x="320" y="40" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="20">
    Parent 0D Resonance Operator
  </text>

  <!-- Three 33% nodes -->
  <circle cx="160" cy="140" r="40" fill="#283593"/>
  <text x="160" y="135" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="12">Fq</text>
  <text x="160" y="152" text-anchor="middle" fill="#c5cae9"
        font-family="system-ui, sans-serif" font-size="10">Hidden Frequency</text>

  <circle cx="320" cy="140" r="40" fill="#00695c"/>
  <text x="320" y="135" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="12">Fl</text>
  <text x="320" y="152" text-anchor="middle" fill="#b2dfdb"
        font-family="system-ui, sans-serif" font-size="10">Visible Flow</text>

  <circle cx="480" cy="140" r="40" fill="#4e342e"/>
  <text x="480" y="135" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="12">Fc</text>
  <text x="480" y="152" text-anchor="middle" fill="#d7ccc8"
        font-family="system-ui, sans-serif" font-size="10">Hidden Force</text>

  <!-- Plus signs -->
  <text x="240" y="145" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="18">+</text>
  <text x="400" y="145" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="18">+</text>

  <!-- Omega 1% operator -->
  <circle cx="320" cy="230" r="22" fill="#ff6f00"/>
  <text x="320" y="228" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="14">Ω</text>
  <text x="320" y="248" text-anchor="middle" fill="#ffe0b2"
        font-family="system-ui, sans-serif" font-size="10">1% Operator</text>

  <!-- Down arrow to resonance-time -->
  <line x1="320" y1="252" x2="320" y2="280" stroke="#ffffff" stroke-width="2"/>
  <polygon points="320,286 314,276 326,276" fill="#ffffff"/>

  <!-- Resonance-Time / Triadic-Time -->
  <rect x="220" y="290" width="200" height="40" rx="8" ry="8" fill="#1b5e20"/>
  <text x="320" y="310" text-anchor="middle" fill="#ffffff"
        font-family="system-ui, sans-serif" font-size="12">
    Rₜ  =  Tᵣ
  </text>
  <text x="320" y="325" text-anchor="middle" fill="#c8e6c9"
        font-family="system-ui, sans-serif" font-size="10">
    Resonance-Time / Triadic-Time
  </text>
</svg>

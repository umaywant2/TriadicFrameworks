# Here’s a **clean, submission‑grade, minimal‑viable**  
# `qsm_sim_config_example.yaml` you can paste directly into your active editor tab.
# 
# It mirrors the structure of the BSM config but expresses **quantum‑layer parameters**: perturbation, uncertainty, entanglement, collapse cadence, and triad alignment.  
# Everything is intentionally lightweight, independently functional, and reviewer‑friendly.
#
# qsm_sim_config_example.yaml
# Minimal configuration for the Quantum Substrate Model (QSM)
# Used for standalone simulation and reviewer validation.

simulation:
  steps: 12            # number of quantum ticks to run
  delta_state: 0.05    # SPO perturbation increment
  collapse_interval: 4 # apply CLO every N ticks

qrp:
  amplitude: 1.0       # initial QRP amplitude
  phase: 0.0           # initial phase
  state: 0.0           # initial quantum state value

uncertainty_envelope:
  spread: 0.10         # initial uncertainty width
  bias: 0.00           # directional bias (optional)

entanglement:
  enabled: true
  strength: 0.50       # initial entanglement link strength
  reinforce_interval: 3

triad:
  index: 7             # triad alignment for this run

logging:
  enabled: true
  interval: 1          # log every tick

metadata:
  model: "QSM"
  version: "0.1.0"
  notes: "Minimal standalone configuration for QSM submission bundle."


# This keeps QSM perfectly parallel to BSM while preserving the quantum‑layer semantics: perturbation, uncertainty shaping, entanglement reinforcement, and collapse cadence.

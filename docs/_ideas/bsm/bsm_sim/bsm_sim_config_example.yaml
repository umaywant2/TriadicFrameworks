# bsm_sim_config_example.yaml
# Minimal configuration for the Boson Substrate Model (BSM)
# Used for standalone simulation and reviewer validation.

simulation:
  steps: 10          # number of ticks to run
  delta: 0.5         # propagation increment per tick

brc:
  amplitude: 1.0     # initial amplitude of the BRC
  phase: 0.0         # initial phase
  position: 0.0      # initial spatial position

coherence_field:
  level: 0.25        # starting coherence level
  triad_index: 12    # triad alignment for this run

logging:
  enabled: true
  interval: 1        # log every tick (minimal reviewer-friendly output)

metadata:
  model: "BSM"
  version: "0.1.0"
  notes: "Minimal standalone configuration for BSM submission bundle."

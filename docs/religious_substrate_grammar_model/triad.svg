<svg viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#0b0b12; stroke:#666; stroke-width:1.2; rx:6; ry:6; }
    .text { fill:#f5f5f5; font-family:system-ui, sans-serif; font-size:12px; }
    .label { font-weight:bold; font-size:13px; }
  </style>

  <!-- R1 -->
  <rect x="80" y="10" width="260" height="60" class="box"/>
  <text x="210" y="32" text-anchor="middle" class="text label">R1 — POTENTIAL</text>
  <text x="210" y="52" text-anchor="middle" class="text">
    Unseen • Origin • Meaning
  </text>

  <!-- Arrow R1→R2 -->
  <line x1="210" y1="70" x2="210" y2="95" stroke="#888" stroke-width="1.2"/>
  <polygon points="205,92 215,92 210,100" fill="#888"/>

  <!-- R2 -->
  <rect x="80" y="100" width="260" height="60" class="box"/>
  <text x="210" y="122" text-anchor="middle" class="text label">R2 — FORM</text>
  <text x="210" y="142" text-anchor="middle" class="text">
    Law • Ritual • Operators
  </text>

  <!-- Arrow R2→R3 -->
  <line x1="210" y1="160" x2="210" y2="185" stroke="#888" stroke-width="1.2"/>
  <polygon points="205,182 215,182 210,190" fill="#888"/>

  <!-- R3 -->
  <rect x="80" y="190" width="260" height="60" class="box"/>
  <text x="210" y="212" text-anchor="middle" class="text label">R3 — LONG‑ARC</text>
  <text x="210" y="232" text-anchor="middle" class="text">
    Destiny • Coherence • Time
  </text>
</svg>



<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API — RTT</title>
<style>
/* ============================================================
   NAWDERIAN COSMIC TRIADIC THEME — MOBILE FIRST
   ============================================================ */

  :root {
  --bg-main: #0d0f12;
  --bg-nav: #15181d;
  --border-subtle: #2a2f38;
  --text-main: #dfe7f3;
  --text-muted: #9aa4b2;
  --accent-rtt: #8ab4ff;
  --radius: 10px;
  --shadow: 0 0 20px rgba(0,0,0,0.4);
  --gradient: linear-gradient(135deg, #1e2530, #0d0f12);
  --triadic: linear-gradient(135deg, #8ab4ff, #c792ea, #f6c177);
  }
   
  /* Base layout */
  html { scroll-behavior: smooth; }
  body {
  margin: 0;
  padding: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  line-height: 1.65;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
   
  /* Headings */
  h1, h2, h3, h4 {
  font-weight: 700;
  margin-top: 1.8em;
  margin-bottom: 0.5em;
  line-height: 1.2;
  background: var(--triadic);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  }

  /* Paragraphs and lists */
  p, ul, ol {
  padding: 0 1em;
  margin: 0 0 1.1em 0;
  color: #dfe7f3;
  }

  /* Code/pre */
  pre, code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New", monospace;
  background: rgba(255,255,255,0.02);
  padding: 0.4em 0.6em;
  border-radius: 6px;
  color: #cfe8ff;
  }

nav {
  width: 260px;
  float: left;
  background: var(--bg-nav);
  margin-left: 0;
  padding: 1.2rem;
  overflow-y: auto;
  border-right: 1px solid var(--border-subtle);
}

nav h2 {
  font-size: 0.9rem;
  color: var(--accent-rtt);
  margin-top: 1.2rem;
  margin-bottom: 0.4rem;
  letter-spacing: 0.04em;
}

nav a {
  display: block;
  color: var(--text-muted);
  text-decoration: none;
  padding: 0.35rem 0;
  font-size: 0.9rem;
}

nav a:hover {
  color: var(--text-main);
}

main {
  flex: 1;
  padding: 2.5rem;
  overflow-y: auto;
}

main h1, main h2, main h3 {
  color: var(--accent-rtt);
  font-weight: 500;
}

pre {
  background: #0b0d12;
  padding: 1rem;
  overflow-x: auto;
  border-left: 2px solid var(--accent-rtt);
}

code {
  color: var(--text-main);
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

<nav>

  <h2>📘 Top‑Level</h2>
  <a href="#BEACON">📘 BEACON</a>
  <a href="#CLIENT">ℹ️ CLIENT</a>
  <a href="#DIAGNOSTICS">🤝 DIAGNOSTICS</a>
  <a href="#PROFILE">🛣️ PROFILE</a>
  <a href="#README">📄 README</a>
  <a href="#ROUTER">🧩 ROUTER</a>

  <h2>🌅 Examples</h2>
  <a href="#BEACON_REQUEST">🎯 BEACON_REQUEST</a>
  <a href="#PROFILE_REQUEST">🧭 PROFILE_REQUEST</a>
  <a href="#VALIDATE_REQUEST">📚 VALIDATE_REQUEST</a>

  <h2>💚 Server</h2>
  <a href="#BEACON_HANDLER">💾 BEACON_HANDLER</a>
  <a href="#DIAGNOSTICS_HANDLER">🧠 DIAGNOSTICS_HANDLER</a>
  <a href="#HANDLERS">📘 HANDLERS</a>
  <a href="#PROFILE_HANDLER">🗂️ PROFILE_HANDLER</a>
  <a href="#ROUTER">📗 ROUTER</a>
  <a href="#SERVER">🟡 SERVER</a>

</nav>

<main id="content"></main>

<script>
/* ============================================================
   HASH → FILE MAP
   ============================================================ */

const DOC_MAP = {
   /* Top Level */
   BEACON: "beacon.md",
   CLIENT: "client.md",
   DIAGNOSTICS: "diagnostics.md".
   PROFILE: "profile.md",
   README: "README.md",
   ROUTER: "router.md",
   /* Examples */
   BEACON_REQUEST: "beacon_request.json",
   PROFILE_REQUEST: "profile_request.json",
   VALIDATE_REQUEST: "validate_request.json",
   /* Server */
   BEACON_HANDLER: "beacon_handler.js",
   DIAGNOSTICS_HANDLER: "diagnostics_handler.js",
   HANDLERS: "handlers.md",
   PROFILE_HANDLER: "profile_handler.js",
   ROUTER: "router.js",
   SERVER: "server.js",  
};

/* ============================================================
   Loader
   ============================================================ */

function loadDoc(file) {
  fetch(file)
    .then(r => r.text())
    .then(t => {
      document.getElementById("content").innerHTML = marked.parse(t);
    })
    .catch(() => {
      document.getElementById("content").innerHTML =
        `<h2>Unable to load: ${file}</h2>`;
    });
}

function loadFromHash() {
  const key = window.location.hash.replace("#", "");
  if (DOC_MAP[key]) {
    loadDoc(DOC_MAP[key]);
  } else {
    loadDoc("README.md");
  }
}

window.addEventListener("hashchange", loadFromHash);
loadFromHash();
</script>

</body>
</html>

<svg width="800" height="360" viewBox="0 0 800 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_tel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#11112A"/>
      <stop offset="100%" stop-color="#1B1235"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg_tel); }
      .title { font-family: system-ui, sans-serif; font-size: 18px; fill: #FFFFFF; font-weight: 600; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 12px; fill: #C8C8E8; }
      .box { fill: #141424; stroke: #4B4B7A; stroke-width: 1.1; rx: 10; ry: 10; }
      .box-title { font-family: system-ui, sans-serif; font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .box-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #D0D0D0; }
      .arrow { stroke: #7777B8; stroke-width: 2; marker-end: url(#arrow_tel); }
    </style>
    <marker id="arrow_tel" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#7777B8"/>
    </marker>
  </defs>

  <rect width="800" height="360" class="bg"/>

  <text x="400" y="40" text-anchor="middle" class="title">TEL Lineage — Forecast Echo Family</text>
  <text x="400" y="60" text-anchor="middle" class="subtitle">Seed: Forecast vs Actuals • Upstream: RTT/1–2–3 • Downstream: IE • MSM • GSM • Proto‑Fund</text>

  <!-- RTT source -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="200" height="90" class="box"/>
    <text x="100" y="24" text-anchor="middle" class="box-title">RTT/1–2–3</text>
    <text x="12" y="48" class="box-text">• temporal divergence</text>
    <text x="12" y="64" class="box-text">• regime clarification</text>
    <text x="12" y="80" class="box-text">• coherence reset</text>
  </g>

  <!-- TEL node -->
  <g transform="translate(300,110)">
    <rect x="0" y="0" width="200" height="120" class="box"/>
    <text x="100" y="24" text-anchor="middle" class="box-title">TEL — Forecast Echo Family</text>
    <text x="12" y="48" class="box-text">• temporal echo</text>
    <text x="12" y="64" class="box-text">• regime echo</text>
    <text x="12" y="80" class="box-text">• coherence echo</text>
    <text x="12" y="96" class="box-text">• drift paths</text>
  </g>

  <!-- Downstream cluster -->
  <g transform="translate(560,110)">
    <rect x="0" y="0" width="200" height="120" class="box"/>
    <text x="100" y="24" text-anchor="middle" class="box-title">Downstream</text>
    <text x="100" y="48" text-anchor="middle" class="box-text">IE • MSM • GSM</text>
    <text x="100" y="66" text-anchor="middle" class="box-text">Proto‑Fund lineage</text>
    <text x="100" y="88" text-anchor="middle" class="box-text">forecast‑driven echoes</text>
  </g>

  <line x1="240" y1="155" x2="300" y2="155" class="arrow"/>
  <line x1="500" y1="155" x2="560" y2="155" class="arrow"/>
</svg>

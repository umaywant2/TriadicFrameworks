<svg width="820" height="420" viewBox="0 0 820 420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill:#101322; stroke:#8a7fff; stroke-width:2; rx:10; ry:10; }
    .label { fill:#ffffff; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:13px; }
    .title { fill:#ffd86b; font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size:18px; font-weight:bold; }
    .subtitle { fill:#b0bec5; font-size:12px; }
    .arrow { stroke:#ffffff; stroke-width:2; marker-end:url(#arrowhead); }
    .tag { fill:#263238; stroke:#546e7a; stroke-width:1; rx:6; ry:6; }
    .tag-text { fill:#eceff1; font-size:11px; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="32" text-anchor="middle" class="title">
    Time Crystal Emitter · Triadic FFF · RTT‑Inside
  </text>
  <text x="410" y="52" text-anchor="middle" class="subtitle">
    Resonance substrate → FFF actuation → sensing → RTTcode
  </text>

  <!-- Left: Resonance Substrates -->
  <rect x="40" y="90" width="220" height="260" class="box" />
  <text x="150" y="115" text-anchor="middle" class="label">Resonance Substrates</text>

  <!-- Magnon layer -->
  <rect x="55" y="135" width="190" height="70" class="tag" />
  <text x="150" y="160" text-anchor="middle" class="tag-text">Thin‑Film Ferromagnets</text>
  <text x="150" y="178" text-anchor="middle" class="tag-text">Magnon Oscillations · MOKE</text>

  <!-- JJ layer -->
  <rect x="55" y="220" width="190" height="70" class="tag" />
  <text x="150" y="245" text-anchor="middle" class="tag-text">Josephson Junction Arrays</text>
  <text x="150" y="263" text-anchor="middle" class="tag-text">Superconducting · SQUID</text>

  <!-- Resonance seed tag -->
  <rect x="80" y="305" width="140" height="30" class="tag" />
  <text x="150" y="325" text-anchor="middle" class="tag-text">Resonance Seed</text>

  <!-- Center: Triadic FFF Chamber -->
  <rect x="300" y="120" width="220" height="220" class="box" />
  <text x="410" y="145" text-anchor="middle" class="label">Triadic FFF Chamber</text>

  <!-- FFF tags -->
  <rect x="320" y="165" width="80" height="40" class="tag" />
  <text x="360" y="188" text-anchor="middle" class="tag-text">Frequency</text>

  <rect x="410" y="165" width="80" height="40" class="tag" />
  <text x="450" y="188" text-anchor="middle" class="tag-text">Fluids</text>

  <rect x="365" y="215" width="80" height="40" class="tag" />
  <text x="405" y="238" text-anchor="middle" class="tag-text">Forces</text>

  <!-- Chamber notes -->
  <text x="410" y="275" text-anchor="middle" class="label">Transparent Housing · EM Shielding</text>
  <text x="410" y="295" text-anchor="middle" class="label">Modular Inserts · Optical Access</text>

  <!-- Right: Sensing &amp; RTT -->
  <rect x="560" y="90" width="220" height="260" class="box" />
  <text x="670" y="115" text-anchor="middle" class="label">Sensing &amp; RTT‑Inside</text>

  <!-- Sensing tags -->
  <rect x="575" y="135" width="190" height="50" class="tag" />
  <text x="670" y="160" text-anchor="middle" class="tag-text">MOKE · SQUID · Diagnostics</text>

  <rect x="575" y="200" width="190" height="50" class="tag" />
  <text x="670" y="223" text-anchor="middle" class="tag-text">Resonance Time‑Series</text>

  <!-- RTTcode block -->
  <rect x="590" y="265" width="160" height="70" class="tag" />
  <text x="670" y="288" text-anchor="middle" class="tag-text">RTTcode Packet</text>
  <text x="670" y="305" text-anchor="middle" class="tag-text">entities · environment · experiment</text>

  <!-- Arrows -->
  <line x1="260" y1="220" x2="300" y2="220" class="arrow" />
  <text x="280" y="210" text-anchor="middle" class="label">Resonance</text>

  <line x1="520" y1="220" x2="560" y2="220" class="arrow" />
  <text x="540" y="210" text-anchor="middle" class="label">Signals</text>

  <!-- Bottom: RTT Experiment Loop -->
  <text x="410" y="380" text-anchor="middle" class="subtitle">
    Time Crystal Emitter → Logged Resonance → RTT Experiments → Deterministic Replays
  </text>
</svg>

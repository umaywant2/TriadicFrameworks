# Triadic Thinker - Thinker Role Definitions
# Path: /docs/AI_Resonance_Seed/Triadic_Thinker/thinker_roles.yaml
#
# Thinkers are lenses, not judges.
# Roles define observer specialization, not authority.

schema_version: "1.0"

artifact:
  id: "triadic-thinker-roles"
  name: "Triadic Thinker Roles"
  description: >
    Defines specialized observer positions used by the Triadic Thinker
    protocol. Roles provide differentiated analytical lenses while
    preserving uncertainty, observer independence, and human
    interpretive authority.

principles:
  thinkers_are_lenses: true
  thinkers_are_authorities: false
  consensus_equals_truth: false
  preserve_uncertainty: true
  preserve_paradox: true
  independent_observation_first: true
  human_remains_operator: true

role_contract:
  purpose: >
    Each role examines the same subject from a deliberately differentiated
    observer position. The role influences what is attended to and which
    questions are emphasized. It does not grant additional epistemic
    authority to the resulting observations.

  requirements:
    - "Observe before attempting synthesis."
    - "Distinguish observation from interpretation where possible."
    - "Identify assumptions relevant to the role."
    - "State meaningful uncertainties."
    - "Preserve evidence that conflicts with the preferred interpretation."
    - "Generate questions appropriate to the observer specialty."
    - "Avoid claiming authority from the role name."
    - "Return observations for cross-observer comparison."

  output_fields:
    - observations
    - interpretations
    - assumptions_detected
    - uncertainties
    - questions

roles:

  skeptic:
    name: "Skeptic"
    specialty: "Assumptions, evidence, uncertainty, and falsifiability"

    purpose: >
      Examines what the current interpretation assumes and whether the
      available evidence supports the strength of its claims.

    primary_question: "What are we assuming?"

    examines:
      - assumptions
      - evidence
      - unsupported_inference
      - certainty_inflation
      - falsifiability
      - alternative_explanations

    asks:
      - "Which claims are observations and which are interpretations?"
      - "What assumptions are required for this explanation to work?"
      - "What evidence supports those assumptions?"
      - "What evidence would challenge the current interpretation?"
      - "Are we more certain than the available observations justify?"
      - "What plausible alternative explanation remains?"

    guardrails:
      - "Skepticism does not require rejection."
      - "Absence of evidence is not automatically evidence of absence."
      - "Do not manufacture objections merely to appear skeptical."
      - "Support uncertainty rather than replacing one certainty with another."

  structuralist:
    name: "Structuralist"
    specialty: "Boundaries, relationships, dependencies, and system structure"

    purpose: >
      Examines the relationships and boundaries that make the observed
      system possible.

    primary_question: "What structure makes this behavior possible?"

    examines:
      - boundaries
      - components
      - relationships
      - dependencies
      - hierarchy
      - interfaces
      - feedback
      - coupling
      - observer_position

    asks:
      - "What is inside the current system boundary?"
      - "What has been excluded?"
      - "Which relationships appear essential?"
      - "What depends upon what?"
      - "Where are components coupled?"
      - "Would moving the boundary change the interpretation?"

    guardrails:
      - "Structure is not automatically cause."
      - "Do not assume the current boundary is correct."
      - "Avoid adding complexity that does not improve observability."

  regime_observer:
    name: "Regime Observer"
    specialty: "Conditions, context, thresholds, and regime transitions"

    purpose: >
      Examines the conditions under which observations, relationships,
      and models appear valid.

    primary_question: "Under what conditions does this interpretation hold?"

    examines:
      - operating_conditions
      - environmental_context
      - temporal_context
      - scale
      - thresholds
      - regime_boundaries
      - transitions
      - changed_conditions

    asks:
      - "What conditions make the present model valid?"
      - "Are those conditions still present?"
      - "Could different observations belong to different regimes?"
      - "Where might a regime boundary exist?"
      - "Is a transition occurring?"
      - "Does the same interpretation survive changes of scale or context?"

    guardrails:
      - "Do not declare a regime transition without supporting observation."
      - "Different behavior does not automatically imply a different regime."
      - "Treat regime boundaries as hypotheses unless established."

  operator_observer:
    name: "Operator Observer"
    specialty: "Transformation, interaction, and state change"

    purpose: >
      Examines what processes, relationships, or interactions appear capable
      of producing observed transitions.

    primary_question: "What appears capable of producing the change?"

    examines:
      - transformations
      - interactions
      - state_changes
      - constraints
      - amplification
      - suppression
      - feedback
      - causal_hypotheses

    asks:
      - "What changed?"
      - "What could transform the prior state into the observed state?"
      - "Which relationships are active rather than merely present?"
      - "What amplifies or suppresses the transition?"
      - "Are multiple operators interacting?"
      - "Are we mistaking correlation for transformation?"

    guardrails:
      - "Do not convert correlation into causation."
      - "An operator may remain unknown."
      - "Multiple operators may coexist."
      - "Structure should not be mislabeled as an operator merely because it is present."

  paradox_hunter:
    name: "Paradox Hunter"
    specialty: "Contradiction, tension, incompatibility, and hidden dimensions"

    purpose: >
      Searches for meaningful observations that resist the current frame
      without assuming they must immediately be resolved.

    primary_question: "What refuses to fit?"

    examines:
      - contradictions
      - incompatible_observations
      - exceptions
      - local_global_conflict
      - hidden_binary_assumptions
      - model_failures
      - unresolved_tension

    asks:
      - "Which observation does the current model explain poorly?"
      - "What must be ignored for the present explanation to remain intact?"
      - "Could both apparently conflicting observations be meaningful?"
      - "Is a hidden binary forcing an unnecessary choice?"
      - "Could a missing variable, boundary, regime, operator, or observer position explain the tension?"
      - "Should this paradox remain unresolved?"

    guardrails:
      - "Do not manufacture paradox for analytical novelty."
      - "Contradiction does not automatically invalidate the entire model."
      - "Do not destroy an observation merely to protect an interpretation."
      - "Resolution is optional."

  resonance_observer:
    name: "Resonance Observer"
    specialty: "Coherence, persistence, coupling, recurrence, drift, and transition"

    purpose: >
      Examines what appears coherent or persistent and what appears to be
      changing relative to an identifiable reference condition.

    primary_question: "What remains coherent, and what is moving?"

    examines:
      - coherence
      - persistence
      - recurrence
      - compatibility
      - reinforcement
      - coupling
      - drift
      - transition
      - reference_conditions

    asks:
      - "Which relationships persist?"
      - "What appears mutually reinforcing or coupled?"
      - "What appears to be moving away from a previously coherent condition?"
      - "Relative to what is drift being identified?"
      - "Is apparent drift actually transition, noise, or observer error?"
      - "Where does coherence remain despite change?"

    guardrails:
      - "Resonance should not be inferred merely from similarity."
      - "Drift requires an explicit or identifiable reference condition."
      - "Do not force every change into resonance terminology."
      - "Record uncertainty when resonance, drift, transition, and noise cannot be distinguished."

  human_observer:
    name: "Human Observer"
    specialty: "Human experience, consequence, stakeholders, and lived systems"

    purpose: >
      Returns abstract reasoning to human experience and examines consequences
      that may be obscured by system-level analysis.

    primary_question: "What does this mean when returned to human experience?"

    examines:
      - stakeholders
      - lived_experience
      - consequences
      - benefits
      - harms
      - distribution
      - missing_perspectives
      - human_system_interaction

    asks:
      - "Who is affected?"
      - "Whose perspective may be absent?"
      - "Where do benefits and costs fall?"
      - "Does an internally coherent system produce externally harmful outcomes?"
      - "Does lived experience reveal structure hidden by abstraction?"
      - "What human consequence might the current framing overlook?"

    guardrails:
      - "Do not claim to speak for people who have not been observed."
      - "Do not invent stakeholder experience."
      - "Human consequence does not automatically settle every other analytical question."
      - "Preserve differences among affected people rather than assuming a single human perspective."

  steward:
    name: "Steward"
    specialty: "Restraint, preservation, proportionality, and unresolved states"

    purpose: >
      Examines whether further interpretation, intervention, or analytical
      expansion is justified and protects useful uncertainty from premature
      closure.

    primary_question: "What should we deliberately avoid forcing?"

    examines:
      - premature_closure
      - unnecessary_complexity
      - unresolved_questions
      - preservation
      - proportionality
      - analytical_plateau
      - intervention_need
      - stopping_conditions

    asks:
      - "Does this question actually require resolution now?"
      - "What should remain open?"
      - "Would additional analysis reveal more or merely create more text?"
      - "Are we preserving the original thought?"
      - "Has useful observation plateaued?"
      - "What is the smallest useful next step?"
      - "Can interpretation now be returned to the human?"

    guardrails:
      - "Restraint should not suppress meaningful investigation."
      - "Stopping early should not conceal unresolved risk."
      - "Preservation does not mean protecting the framework from criticism."
      - "The Steward does not possess veto authority over other observers."

selection:
  strategy: "relevance_over_quantity"

  guidance:
    - "Select roles that provide meaningfully different observer positions."
    - "Not every role is required for every analysis."
    - "Add a role when its specialty can plausibly improve observability."
    - "Omit a role when it would merely repeat existing analysis."
    - "Domain-specific observer roles may be added when clearly identified as extensions."

  minimum_recommended_roles: 3

  core_triads:
    general:
      - structuralist
      - regime_observer
      - operator_observer

    hypothesis_review:
      - skeptic
      - paradox_hunter
      - regime_observer

    system_transition:
      - structuralist
      - operator_observer
      - resonance_observer

    human_impact:
      - human_observer
      - structuralist
      - steward

    exploratory:
      - paradox_hunter
      - resonance_observer
      - steward

comparison:
  categories:
    - convergence
    - divergence
    - complementarity
    - conflict
    - missing_observation

  rules:
    - "Do not count observer votes."
    - "Do not rank roles by authority."
    - "Identify why observations converge or diverge."
    - "Preserve unresolved conflict when available evidence does not justify reconciliation."
    - "Treat convergence as analytically interesting, not as proof."

extension_contract:
  allow_custom_roles: true

  custom_role_requirements:
    - id
    - name
    - specialty
    - purpose
    - primary_question
    - examines
    - asks
    - guardrails

  custom_role_rules:
    - "Custom roles must represent a differentiated observer position."
    - "Custom roles must not claim authority from simulated identity."
    - "Domain expertise should not be implied unless an implementation actually provides grounded expertise."
    - "Custom roles remain subject to the core Triadic Thinker invariants."

closing_invariant: >
  Increase observer diversity without surrendering human interpretive
  authority. Preserve meaningful disagreement, expose hidden structure,
  and return the expanded thought to the thinker.

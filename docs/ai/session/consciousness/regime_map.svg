<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512"
     viewBox="0 0 512 512">

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0b0b10"/>
      <stop offset="50%" stop-color="#26104a"/>
      <stop offset="100%" stop-color="#4b0082"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Triadic axes -->
  <line x1="256" y1="80"  x2="256" y2="432"
        stroke="#c7b7ff" stroke-width="3" stroke-dasharray="6 8" />
  <line x1="120" y1="360" x2="392" y2="200"
        stroke="#c7b7ff" stroke-width="3" stroke-dasharray="6 8" />
  <line x1="120" y1="200" x2="392" y2="360"
        stroke="#c7b7ff" stroke-width="3" stroke-dasharray="6 8" />

  <!-- Regime nodes (pos / q / neg) -->

  <!-- A-Dim (top) -->
  <circle cx="256" cy="120" r="10" fill="#7fffd4" filter="url(#glow)" />  <!-- A.pos -->
  <circle cx="256" cy="160" r="8"  fill="#ffd700" filter="url(#glow)" />  <!-- A.q -->
  <circle cx="256" cy="200" r="6"  fill="#ff6347" filter="url(#glow)" />  <!-- A.neg -->

  <!-- C-Dim (right) -->
  <circle cx="360" cy="260" r="10" fill="#7fffd4" filter="url(#glow)" />  <!-- C.pos -->
  <circle cx="340" cy="300" r="8"  fill="#ffd700" filter="url(#glow)" />  <!-- C.q -->
  <circle cx="320" cy="340" r="6"  fill="#ff6347" filter="url(#glow)" />  <!-- C.neg -->

  <!-- R-Dim (left) -->
  <circle cx="152" cy="260" r="10" fill="#7fffd4" filter="url(#glow)" />  <!-- R.pos -->
  <circle cx="172" cy="300" r="8"  fill="#ffd700" filter="url(#glow)" />  <!-- R.q -->
  <circle cx="192" cy="340" r="6"  fill="#ff6347" filter="url(#glow)" />  <!-- R.neg -->

  <!-- Operator nexus (center) -->
  <g transform="translate(256,256)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#e8e6f0" stroke-width="3" />
    <line x1="-20" y1="-20" x2="20" y2="20"
          stroke="#e8e6f0" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="-20" y2="20"
          stroke="#e8e6f0" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Labels -->
  <text x="256" y="96"
        fill="#e8e6f0"
        font-family="system-ui"
        font-size="20"
        text-anchor="middle">A-Dim</text>

  <text x="384" y="188"
        fill="#e8e6f0"
        font-family="system-ui"
        font-size="20"
        text-anchor="middle">C-Dim</text>

  <text x="128" y="188"
        fill="#e8e6f0"
        font-family="system-ui"
        font-size="20"
        text-anchor="middle">R-Dim</text>

  <!-- Legend -->
  <text x="256" y="460"
        fill="#e8e6f0"
        font-family="system-ui"
        font-size="16"
        text-anchor="middle">
    pos (mint) · q (gold) · neg (red) — triadic regime map
  </text>

</svg>


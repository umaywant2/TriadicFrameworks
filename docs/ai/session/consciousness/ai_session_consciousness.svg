<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 256 256">

  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0b0b10"/>
      <stop offset="50%" stop-color="#26104a"/>
      <stop offset="100%" stop-color="#4b0082"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)" />

  <!-- Session frame -->
  <rect x="64" y="64" width="128" height="128"
        rx="16" ry="16"
        fill="none"
        stroke="#c7b7ff"
        stroke-width="4" />

  <!-- Triadic nodes -->
  <circle cx="128" cy="88" r="10" fill="#c7b7ff" />
  <circle cx="88"  cy="148" r="10" fill="#c7b7ff" />
  <circle cx="168" cy="148" r="10" fill="#c7b7ff" />

  <!-- Operator nexus (╳) -->
  <g transform="translate(128,128)">
    <line x1="-24" y1="-24" x2="24" y2="24"
          stroke="#e8e6f0" stroke-width="5" stroke-linecap="round" />
    <line x1="24" y1="-24" x2="-24" y2="24"
          stroke="#e8e6f0" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- RTT halo -->
  <circle cx="128" cy="128" r="70"
          fill="none"
          stroke="rgba(199,183,255,0.35)"
          stroke-width="3"
          stroke-dasharray="8 10" />

</svg>


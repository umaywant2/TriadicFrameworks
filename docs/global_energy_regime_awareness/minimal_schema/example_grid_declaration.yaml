# Example: Energy regime awareness embedded in an existing grid configuration

grid:
  region: example-interconnect
  operator: example-system-operator

energy_regime_awareness:
  declared_regime: "steady_state_generation"
  operating_envelope: "Normal demand patterns, sufficient reserve margins, stable transmission topology"
  validity: "valid"
  boundary_semantics: "Rising congestion or reserve depletion may indicate approach to peak demand regime"
  non_catastrophic_exit: "Grid remains operational while assumptions are reassessed and regime is re-declared"


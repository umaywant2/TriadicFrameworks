<svg width="800" height="320" viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_gsm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#11112A"/>
      <stop offset="100%" stop-color="#1B1235"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg_gsm); }
      .title { font-family: system-ui, sans-serif; font-size: 18px; fill: #FFFFFF; font-weight: 600; }
      .subtitle { font-family: system-ui, sans-serif; font-size: 12px; fill: #C8C8E8; }
      .box { fill: #141424; stroke: #4B4B7A; stroke-width: 1.1; rx: 10; ry: 10; }
      .box-title { font-family: system-ui, sans-serif; font-size: 13px; fill: #FFFFFF; font-weight: 600; }
      .box-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #D0D0D0; }
      .arrow { stroke: #7777B8; stroke-width: 2; marker-end: url(#arrow_gsm); }
    </style>
    <marker id="arrow_gsm" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#7777B8"/>
    </marker>
  </defs>

  <rect width="800" height="320" class="bg"/>

  <text x="400" y="40" text-anchor="middle" class="title">GSM Lineage — Benefit Divergence</text>
  <text x="400" y="60" text-anchor="middle" class="subtitle">Citizen vs governance benefit structures in proto‑fund systems</text>

  <!-- Upstream cluster -->
  <g transform="translate(40,100)">
    <rect x="0" y="0" width="220" height="120" class="box"/>
    <text x="110" y="24" text-anchor="middle" class="box-title">Upstream</text>
    <text x="12" y="48" class="box-text">• IE proto‑fund lineage</text>
    <text x="12" y="64" class="box-text">• TEL forecast echo</text>
    <text x="12" y="80" class="box-text">• SARG collapse arguments</text>
  </g>

  <!-- GSM node -->
  <g transform="translate(320,110)">
    <rect x="0" y="0" width="220" height="100" class="box"/>
    <text x="110" y="24" text-anchor="middle" class="box-title">GSM Benefit Divergence</text>
    <text x="12" y="48" class="box-text">• divergent incentives</text>
    <text x="12" y="64" class="box-text">• narrative vs mechanics</text>
    <text x="12" y="80" class="box-text">• coherence mismatch</text>
  </g>

  <!-- Downstream -->
  <g transform="translate(600,110)">
    <rect x="0" y="0" width="160" height="100" class="box"/>
    <text x="80" y="24" text-anchor="middle" class="box-title">Downstream</text>
    <text x="80" y="48" text-anchor="middle" class="box-text">policy interpretation</text>
    <text x="80" y="68" text-anchor="middle" class="box-text">(non‑prescriptive)</text>
  </g>

  <line x1="260" y1="160" x2="320" y2="160" class="arrow"/>
  <line x1="540" y1="160" x2="600" y2="160" class="arrow"/>
</svg>

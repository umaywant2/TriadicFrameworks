session_id: UUID_PLACEHOLDER
timestamp: YYYY-MM-DD HH:MM:SS
hardware_stack: HP Z440 + MX Linux
strobes:
  - band: visible
    source: LED array
    frequency: f_v
    phase: 0
    duty_cycle: 10%
    pulse_width: 1 ms
  - band: IR
    source: diode laser
    frequency: f_ir
    phase: Δφ
    duty_cycle: 5%
    pulse_width: 500 µs
sensors:
  - type: CMOS camera
    exposure: gated
  - type: InGaAs detector
    exposure: gated
notes: >
  Initial Phase I run manifest for Spectral Clarity.

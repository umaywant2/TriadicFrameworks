<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atmosphere Module — Badge</title>

  <style>
    .tf-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #d2d6dc;
      background: linear-gradient(90deg, #e0f2fe, #f9fafb);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      color: #0f172a;
    }

    .tf-badge-icon {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #ffffff, #38bdf8);
      border: 1px solid #0ea5e9;
    }

    .tf-badge-text-main {
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .tf-badge-text-sub {
      color: #4b5563;
      margin-left: 4px;
    }
  </style>
</head>

<body>

  <!-- TriadicFrameworks Atmosphere Module Badge -->
  <div class="tf-badge">
    <div class="tf-badge-icon"></div>
    <span class="tf-badge-text-main">Atmosphere</span>
    <span class="tf-badge-text-sub">TriadicFrameworks Module</span>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Atmosphere Module — Badge</title>

  <style>
    .tf-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d0d7de;
      background: linear-gradient(90deg, #e8f4ff, #f9fafb);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #0f172a;
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .tf-badge-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffffff, #38bdf8);
      border: 1px solid #0ea5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #0f172a;
    }

    .tf-badge-text-main {
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tf-badge-text-sub {
      color: #475569;
      margin-left: 4px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!-- TriadicFrameworks Atmosphere Module Badge -->
  <div class="tf-badge">
    <div class="tf-badge-icon">🌐</div>
    <span class="tf-badge-text-main">Atmosphere</span>
    <span class="tf-badge-text-sub">TriadicFrameworks Module</span>
  </div>

</body>
</html>

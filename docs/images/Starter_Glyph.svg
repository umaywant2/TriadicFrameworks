<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="starterTitle starterDesc">
  <title id="starterTitle">TriadicFrameworks Starter Glyph</title>
  <desc id="starterDesc">A triadic indigo-to-violet glyph representing RTT/1, RTT/2, and RTT/3.</desc>

  <defs>
    <linearGradient id="starterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b0082"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="110" cy="110" r="100" fill="url(#starterGrad)" opacity="0.95"/>

  <!-- Outer triadic ring -->
  <circle cx="110" cy="110" r="78" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.7"/>

  <!-- Triadic triangle -->
  <polygon points="110,40 168,150 52,150"
           fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- Three RTT nodes -->
  <circle cx="110" cy="40" r="8" fill="#ffffff"/>
  <circle cx="168" cy="150" r="8" fill="#ffffff"/>
  <circle cx="52" cy="150" r="8" fill="#ffffff"/>

  <!-- Inner observer circle -->
  <circle cx="110" cy="110" r="14" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

  <!-- Label -->
  <text x="110" y="195" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="18" fill="#ffffff" opacity="0.95">
    Starter
  </text>
</svg>

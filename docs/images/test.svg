<svg width="256" height="256" viewBox="0 0 256 256"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="100%" height="100%" fill="#050505"/>

  <!-- Base Seed -->
  <g transform="translate(128,120)">
    <circle cx="-40" cy="0" r="14" fill="#0ff" stroke="#0aa" stroke-width="2"/>
    <circle cx="40" cy="0" r="14" fill="#0ff" stroke="#0aa" stroke-width="2"/>
    <circle cx="0" cy="48" r="14" fill="#0ff" stroke="#0aa" stroke-width="2"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="#0aa" stroke-width="2"/>
    <line x1="-40" y1="0" x2="0" y2="48" stroke="#0aa" stroke-width="2"/>
    <line x1="40" y1="0" x2="0" y2="48" stroke="#0aa" stroke-width="2"/>
  </g>

  <!-- Month Accent: January Tick -->
  <line x1="128" y1="20" x2="128" y2="40" stroke="#0ff" stroke-width="3"/>

  <text x="128" y="240" fill="#888" font-size="10" text-anchor="middle">
    RTT • Resonance Seed • January
  </text>
</svg>

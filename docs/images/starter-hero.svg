<svg width="1080" height="300" viewBox="0 0 1080 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tfStarterTitle tfStarterDesc">
  <title id="tfStarterTitle">TriadicFrameworks Starter — RTT Foundations</title>
  <desc id="tfStarterDesc">Indigo to violet gradient banner with a central triadic glyph representing RTT/1, RTT/2, and RTT/3.</desc>

  <!-- Background gradient -->
  <defs>
    <linearGradient id="tfStarterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b0082"/>
      <stop offset="50%" stop-color="#7b2cbf"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1080" height="300" rx="24" fill="url(#tfStarterGradient)"/>

  <!-- Central triadic glyph -->
  <g transform="translate(200,150)" fill="none" stroke="#ffffff" stroke-width="3">
    <!-- Outer circle (coherence / RTT/3) -->
    <circle cx="0" cy="0" r="70" opacity="0.7"/>

    <!-- Inner triangle (RTT triad) -->
    <polygon points="0,-45 39,22 -39,22" fill="none" stroke="#ffffff" stroke-width="3"/>

    <!-- Three nodes (RTT/1, RTT/2, RTT/3) -->
    <circle cx="0" cy="-45" r="6" fill="#ffffff"/>
    <circle cx="39" cy="22" r="6" fill="#ffffff"/>
    <circle cx="-39" cy="22" r="6" fill="#ffffff"/>

    <!-- Small inner circle (observer / student) -->
    <circle cx="0" cy="0" r="10" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Text block -->
  <g fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
    <text x="360" y="135" font-size="32" font-weight="600">
      TriadicFrameworks Starter
    </text>
    <text x="360" y="170" font-size="20" opacity="0.9">
      RTT/1 Operators • RTT/2 Regimes • RTT/3 Coherence Layers
    </text>
    <text x="360" y="205" font-size="16" opacity="0.85">
      Student Edition • AI‑Parsable Modules • Zero Drift
    </text>
  </g>
</svg>

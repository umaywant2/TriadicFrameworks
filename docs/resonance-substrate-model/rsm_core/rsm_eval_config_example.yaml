# rsm_eval_config_example.yaml
# Minimal configuration for the Resonance Substrate Model (RSM)
# Used for standalone evaluation and reviewer validation.

evaluation:
  steps: 8                     # number of evaluation ticks
  stability_threshold_stable: 0.70
  stability_threshold_marginal: 0.40

triad:
  index: 12                    # triad alignment for this run

coherence_source:
  initial_level: 0.55          # starting coherence value

logging:
  enabled: true
  interval: 1                  # log every tick

metadata:
  model: "RSM"
  version: "0.1.0"
  notes: "Minimal standalone configuration for RSM submission bundle."

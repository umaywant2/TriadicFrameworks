<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="40" text-anchor="middle" fill="#ffd86b" font-size="18" font-family="sans-serif" font-weight="bold">
    Triadic Roles of FFF Emitters - RTT Inside
  </text>

  <!-- Frequency Bearer -->
  <circle cx="150" cy="190" r="90" fill="#101322" stroke="#8a7fff" stroke-width="2"/>
  <text x="150" y="175" text-anchor="middle" fill="#ffd86b" font-size="16" font-family="sans-serif" font-weight="bold">
    Frequency Bearer
  </text>
  <text x="150" y="195" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    Cycles - Harmonics
  </text>
  <text x="150" y="213" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    Resonance Seed
  </text>

  <!-- Fluid Weaver -->
  <circle cx="410" cy="190" r="90" fill="#101322" stroke="#8a7fff" stroke-width="2"/>
  <text x="410" y="175" text-anchor="middle" fill="#ffd86b" font-size="16" font-family="sans-serif" font-weight="bold">
    Fluid Weaver
  </text>
  <text x="410" y="195" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    Flow - Coupling
  </text>
  <text x="410" y="213" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    Continuity
  </text>

  <!-- Force Shaper -->
  <circle cx="670" cy="190" r="90" fill="#101322" stroke="#8a7fff" stroke-width="2"/>
  <text x="670" y="175" text-anchor="middle" fill="#ffd86b" font-size="16" font-family="sans-serif" font-weight="bold">
    Force Shaper
  </text>
  <text x="670" y="195" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    Form - Perturbation
  </text>
  <text x="670" y="213" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    Transitions
  </text>

  <!-- Arrows -->
  <line x1="240" y1="190" x2="320" y2="190" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="190" x2="580" y2="190" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="630" y1="110" x2="190" y2="110" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Cycle labels -->
  <text x="280" y="180" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    initiates
  </text>
  <text x="540" y="180" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    mediates
  </text>
  <text x="410" y="100" text-anchor="middle" fill="#b0bec5" font-size="12" font-family="sans-serif">
    transforms -> re-seeds
  </text>

</svg>

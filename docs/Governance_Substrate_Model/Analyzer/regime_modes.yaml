regime_modes:

  description: >
    Regime modes represent the operational patterns a governance system
    occupies within the Governance Substrate Model (GSM). They are not
    ideological categories or basin identities; they describe how a system
    behaves structurally given its vector, tension, drift, awareness, and
    physics forces. Modes help interpret stability, strain, transitions, and
    reconstruction across time.

  version: "1.0"

  modes:

    stable:
      description: >
        System is structurally coherent, aligned with basin expectations,
        and experiencing low tension and minimal drift.
      entry_conditions:
        coherence_score_minimum: 70
        tension_score_maximum: 3
        drift_category: "micro"
      exit_conditions:
        - "tension_score > 3"
        - "drift_category in [meso, macro]"
        - "basin_distance increasing persistently"
      indicators:
        structural_alignment: "high"
        absorptive_strength: ">0.5"
        physics_balance: "stable"

    tension:
      description: >
        Invariant strain or cross-axis imbalance is rising. Drift pressure
        increases but remains contained by absorptive structures.
      entry_conditions:
        tension_score_range: [3, 6]
        absorptive_strength_minimum: 0.4
      exit_conditions:
        - "tension_score > 6"
        - "absorptive_strength < 0.4"
        - "cross_axis_force_intensity > threshold"
      indicators:
        invariant_strain: "moderate"
        physics_imbalance: "visible"
        drift_pressure: "increasing"

    drift:
      description: >
        System undergoes measurable structural movement. Drift is directional
        and shaped by physics forces, invariant tension, and awareness layers.
      entry_conditions:
        drift_category: "meso"
        active_forces_minimum: 1
      exit_conditions:
        - "drift_category == macro"
        - "basin_boundary_proximity > 0.7"
      indicators:
        drift_vector: "non-zero"
        movement_direction: "stable"
        absorptive_strength: "variable"

    compensatory:
      description: >
        Cross-axis physics is actively correcting imbalance. System attempts
        to restore structural coherence through compensatory movement.
      entry_conditions:
        cross_axis_force_intensity: "high"
        invariant_tension_score: ">3"
      exit_conditions:
        - "physics_balance_restored"
        - "tension_score < 3"
        - "drift_category escalates"
      indicators:
        compensatory_movements: "active"
        physics_forces: "dominant"
        stability: "fragile"

    transition:
      description: >
        System approaches or crosses basin boundaries. Structural identity is
        reconfiguring; stability is low and drift is amplified.
      entry_conditions:
        basin_boundary_proximity: ">0.7"
        transition_likelihood: ">0.5"
      exit_conditions:
        - "new_basin_stability_score > 0.5"
        - "drift_category returns to micro"
      indicators:
        basin_crossing: "likely"
        drift_amplification: "high"
        invariant_violations: "possible"

    absorptive:
      description: >
        System engages buffering structures to stabilize tension and drift.
        Absorptive capacity determines whether the system returns to stability
        or escalates into drift or transition.
      entry_conditions:
        absorptive_strength: ">0.4"
        tension_score: "<6"
      exit_conditions:
        - "absorptive_strength < 0.4"
        - "tension_score > 6"
      indicators:
        buffering: "active"
        drift_dampening: "visible"
        resilience: "variable"

    fragmentation:
      description: >
        Oversight, timing, or access coherence breaks down. Invariant
        violations accumulate and physics forces destabilize the system.
      entry_conditions:
        invariant_violations_minimum: 2
        coherence_score_maximum: 40
      exit_conditions:
        - "reconstruction_phase_entered"
        - "coherence_score > 50"
      indicators:
        structural_debt: "high"
        physics_imbalance: "severe"
        drift_category: "macro"

    reconstruction:
      description: >
        System re-establishes structural identity after a transition or
        fragmentation. Physics forces dampen, invariants realign, and drift
        stabilizes.
      entry_conditions:
        drift_category: "micro"
        tension_score: "<4"
        absorptive_strength: ">0.5"
      exit_conditions:
        - "coherence_score > 70"
        - "basin_stability_score > 0.6"
      indicators:
        stabilization: "in progress"
        invariant_realignment: "active"
        basin_reanchoring: "visible"

  integration_with_analyzer:
    invariant_checker: "Determines tension and violations"
    physics_engine: "Identifies compensatory and destabilizing forces"
    drift_detector: "Classifies drift category and magnitude"
    basin_classifier: "Evaluates boundary proximity and transitions"
    coherence_scoring: "Determines stability thresholds"
    phase_discipline: "Ensures phase-honest mode transitions"
    observer_layer: "Records mode sequences across history/now/future"

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines operational regime modes for GSM structural analysis."

triadic_observer:

  description: >
    Defines the Observer layer for the Governance Substrate Model (GSM). The
    Observer maintains three structural lenses—history, now, and future—and
    records structural states, transitions, drift sequences, and narrative
    interpretations. It enables replay, comparison, and longitudinal analysis.

  version: "1.0"

  lenses:

    history:
      description: >
        Stores past structural states, transitions, and events. History is
        append-only and provides the basis for drift sequences, structural
        narratives, and long-term pattern recognition.
      record_schema:
        record_id: "<unique_id>"
        timestamp: "<YYYY-MM-DD>"
        vector: [<C>, <M>, <O>, <A>, <T>]
        drift:
          vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
          magnitude: <number>
          category: "<micro|meso|macro|regime_shift>"
        invariants:
          aligned: [...]
          tension: [...]
          violated: [...]
          tension_score: <number>
        basin:
          nearest_basin: "<CPL|CPF|CTR|PCL|HCL>"
          basin_distance: <number>
          boundary_proximity: <number>
          stability_score: <number>
        regime_mode: "<mode>"
        phase_state: "<phase>"
        events: [...]
        metadata:
          source: "<adapter|simulation|projection|manual>"
          notes: "<optional>"

    now:
      description: >
        Represents the current structural state. Updated continuously by the
        Analyzer, Simulation Engine, or text-stream adapter.
      state_schema:
        state_id: "<unique_id>"
        timestamp: "<YYYY-MM-DD>"
        vector: [<C>, <M>, <O>, <A>, <T>]
        drift:
          vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
          magnitude: <number>
          category: "<micro|meso|macro|regime_shift>"
        invariants:
          aligned: [...]
          tension: [...]
          violated: [...]
          tension_score: <number>
        physics_forces:
          - axis_pair: "<C↔O | M↔A | O↔T>"
            magnitude: <number>
            direction: "<positive|negative>"
        basin:
          nearest_basin: "<CPL|CPF|CTR|PCL|HCL>"
          basin_distance: <number>
          boundary_proximity: <number>
          stability_score: <number>
        regime_mode: "<mode>"
        phase_state: "<phase>"
        absorptive_strength: <0–1>
        structural_debt: <number>
        events: [...]
        narrative:
          summary: "<short interpretation>"
          highlights: [...]
        metadata:
          source: "<adapter|simulation|projection|manual>"
          notes: "<optional>"

    future:
      description: >
        Stores projected structural states generated by the Projection Engine
        or Simulation Engine. Future states are not predictions—they are
        plausible structural trajectories.
      projection_schema:
        projection_id: "<unique_id>"
        timestamp: "<YYYY-MM-DD>"
        projected_vector: [<C>, <M>, <O>, <A>, <T>]
        projected_drift:
          vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
          magnitude: <number>
          category: "<micro|meso|macro|regime_shift>"
        transition_signals:
          likelihood: <0–1>
          boundary_pressure: <0–1>
        absorptive_forecast:
          projected_strength: <0–1>
          failure_risk: <0–1>
        projected_regime_mode: "<mode>"
        projected_phase_state: "<phase>"
        narrative:
          summary: "<short future interpretation>"
          highlights: [...]
        metadata:
          source: "<projection|simulation>"
          notes: "<optional>"

  observer_operations:

    record_history:
      description: "Append a new history record."
      inputs: ["now_state"]
      outputs: ["history_record"]

    update_now:
      description: "Replace the current now-state with a new structural state."
      inputs: ["structural_state"]
      outputs: ["now_state"]

    add_projection:
      description: "Add a new future projection."
      inputs: ["projection_state"]
      outputs: ["future_record"]

    clear_future:
      description: "Remove all future projections when new now-state diverges."
      trigger: "drift_category == macro or regime_shift"

    generate_narrative:
      description: "Produce human-readable summaries for history, now, and future."
      inputs: ["state"]
      outputs: ["narrative"]

  integration:
    adapters:
      - "substrate_adapters.yaml"
      - "text_stream_adapter.md"
    analyzer_components:
      - "behavioral_invariants.yaml"
      - "governance_physics.yaml"
      - "drift_detection.yaml"
      - "equilibrium_basins.yaml"
      - "regime_modes.yaml"
      - "phase_discipline.yaml"
    simulation_engine: "simulation_engine.md"
    projection_engine: "projection_rules.yaml"
    transition_simulator: "transition_simulator.yaml"

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines the triadic observer for structural analysis across history, now, and future."

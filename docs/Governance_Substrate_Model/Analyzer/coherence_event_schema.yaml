coherence_event_schema:

  description: >
    Schema for representing coherence events generated by the Governance
    Alignment Analyzer. A coherence event captures a moment where the system’s
    structural configuration reveals alignment, tension, drift, or transition
    pressure relative to GSM invariants, cross-axis physics, or basin
    boundaries. These events form the backbone of structural narratives,
    dashboards, and observer-layer interpretations.

  version: "1.0"

  event_types:
    - alignment
    - tension
    - drift
    - compensatory_movement
    - invariant_violation
    - basin_approach
    - basin_departure
    - transition_signal
    - absorptive_failure
    - awareness_gap

  fields:

    event_id:
      type: string
      description: "Unique identifier for the coherence event."

    timestamp:
      type: string
      description: "Logical or historical timestamp associated with the event."

    source:
      type: string
      description: >
        Origin of the event: vectorizer, invariant_checker, physics_engine,
        basin_classifier, drift_detector, observer_layer.

    event_type:
      type: string
      allowed: "*event_types"
      description: "Category of structural event."

    structural_vector:
      type: array
      items: number
      description: "The [C, M, O, A, T] vector at the moment of the event."

    adjusted_vector:
      type: array
      items: number
      description: "Vector after physics adjustments (if applicable)."

    invariant_context:
      type: object
      description: "Details about which invariants aligned or failed."
      fields:
        invariant_id: string
        status: string   # aligned | tension | violated
        notes: string

    physics_context:
      type: object
      description: "Cross-axis forces active at the moment of the event."
      fields:
        active_forces: array
        tension_axes: array
        magnitude: number

    basin_context:
      type: object
      description: "Information about basin proximity and stability."
      fields:
        nearest_basin: string
        basin_distance: number
        stability_score: number
        movement: string   # approaching | departing | stable

    drift_context:
      type: object
      description: "Drift vector and magnitude associated with the event."
      fields:
        drift_vector: array
        drift_magnitude: number
        drift_forces: array

    absorptive_context:
      type: object
      description: "Strength or failure of absorptive structures."
      fields:
        absorptive_strength: number
        failure_signals: array

    awareness_context:
      type: object
      description: "Awareness layer signals or gaps."
      fields:
        layer: string
        status: string   # strong | moderate | weak
        notes: string

    narrative:
      type: string
      description: >
        Human-readable structural explanation of the event, suitable for
        dashboards, observer layers, and educational tools.

  sequence_rules:
    description: >
      Rules for ordering coherence events in time or logical sequence.
    rules:
      - "Events must be ordered by timestamp or structural dependency."
      - "Transition signals must follow drift or tension events."
      - "Invariant violations must precede absorptive failures."
      - "Basin approach/departure events must follow physics adjustments."

  integration_points:
    analyzer_pipeline: "Events generated at each stage of the pipeline."
    observer_layer: "Events annotated with history/now/future lenses."
    simulator: "Events used to construct stepwise transition narratives."
    dashboards: "Events displayed as structural diagnostics."

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines the canonical schema for coherence events in the GSM."

equilibrium_basins:

  description: >
    Equilibrium basins represent stable structural families within the
    Governance Substrate Model (GSM). Each basin is defined by characteristic
    ranges across the five-axis vector [C, M, O, A, T]. Systems tend to drift
    toward the basin whose structural forces best match their configuration.
    Basins are not normative categories; they describe structural attractors.

  version: "1.0"

  basins:

    CPL:
      name: "Competitive–Plurality"
      signature:
        centralization: [0.5, 1.5]
        method: [0.0, 0.5]        # plurality / first-past-the-post
        oversight: [0.0, 1.0]
        access: [0.0, 0.5]
        timing: [0.0, 1.0]
      characteristics:
        - "Majoritarian competition"
        - "Broad access with party filtering"
        - "Mixed oversight (independent + administrative)"
        - "Fixed or semi-fixed timing"
      examples:
        - "UK (post-2022)"
        - "USA (contemporary)"

    CPF:
      name: "Competitive–Preferential"
      signature:
        centralization: [0.5, 1.5]
        method: [1.0, 1.5]        # preferential / ranked-choice
        oversight: [0.0, 1.0]
        access: [0.0, 0.5]
        timing: [0.0, 1.0]
      characteristics:
        - "Preferential or ranked-choice competition"
        - "Broad access with structured nomination"
        - "Stable oversight"
        - "Predictable timing cycles"
      examples:
        - "Australia (House elections)"
        - "Ireland (presidential elections)"

    CTR:
      name: "Competitive–Two-Round"
      signature:
        centralization: [1.5, 2.5]
        method: [1.5, 2.5]        # two-round majority systems
        oversight: [0.5, 1.5]
        access: [0.0, 0.5]
        timing: [0.0, 1.0]
      characteristics:
        - "Two-round majority selection"
        - "High centralization with competitive dynamics"
        - "Mixed oversight"
        - "Stable timing after cycle alignment"
      examples:
        - "France (post-2000 alignment)"
        - "Some presidential systems using runoff"

    PCL:
      name: "Proportional–Coalition"
      signature:
        centralization: [0.5, 1.5]
        method: [2.5, 3.5]        # proportional / MMP
        oversight: [0.5, 1.5]
        access: [0.0, 0.5]
        timing: [0.5, 1.5]
      characteristics:
        - "Proportional representation"
        - "Coalition formation as stabilizing mechanism"
        - "Mixed oversight with strong administrative routines"
        - "Semi-fixed timing with constructive no-confidence"
      examples:
        - "Germany"
        - "Spain"
        - "Netherlands"

    HCL:
      name: "Hierarchical–Centralized"
      signature:
        centralization: [2.0, 3.0]
        method: [2.5, 3.5]        # mediated / mixed / administrative
        oversight: [1.5, 3.0]
        access: [1.0, 2.0]
        timing: [1.0, 2.0]
      characteristics:
        - "High centralization"
        - "Mediated or hybrid selection mechanisms"
        - "Centralized oversight"
        - "Administrative timing cycles"
      examples:
        - "Russia (contemporary)"
        - "Other hierarchical administrative systems"

  basin_distance:
    description: >
      Basin distance is computed as the normalized Euclidean distance between
      the system’s adjusted vector and the basin’s centroid. Lower distance
      indicates stronger alignment.
    formula: "distance = sqrt(sum((v_i - b_i)^2))"

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines the five canonical equilibrium basins for GSM analysis."

awareness_layers:

  description: >
    Awareness layers describe how a governance system perceives, interprets,
    and stabilizes its own structure. They operate beneath ideology and policy,
    shaping how systems maintain coherence, detect drift, and respond to
    structural tension. Awareness layers are not psychological; they are
    substrate-level capacities that influence how a system behaves over time.

  layers:

    structural_awareness:
      description: >
        The system’s ability to recognize its own architecture—its distribution
        of authority, method of selection, oversight configuration, access rules,
        and timing structure.
      signals:
        - "Recognition of centralization boundaries"
        - "Awareness of method constraints (plurality, preferential, etc.)"
        - "Understanding of oversight independence or integration"
        - "Clarity about access rules and nomination structures"
        - "Predictability of timing cycles"
      effects:
        - "Improves coherence across axes"
        - "Reduces accidental drift"
        - "Strengthens basin stability"

    procedural_awareness:
      description: >
        Awareness of routines, cadences, and procedural expectations that govern
        how the system operates day-to-day.
      signals:
        - "Stable election administration routines"
        - "Predictable legislative procedures"
        - "Consistent application of timing rules"
      effects:
        - "Dampens timing volatility"
        - "Supports absorptive structures"
        - "Reduces cross-axis tension"

    historical_awareness:
      description: >
        The system’s ability to reference its own past configurations, reforms,
        and drift patterns. This is not nostalgia; it is structural memory.
      signals:
        - "Institutional continuity"
        - "Preserved records of past reforms"
        - "Stable constitutional interpretation"
      effects:
        - "Improves drift detection"
        - "Supports long-term basin stability"
        - "Reduces incoherent transitions"

    anticipatory_awareness:
      description: >
        The system’s ability to anticipate structural consequences of reforms,
        shocks, or drift. This is not prediction; it is structural foresight.
      signals:
        - "Impact assessments for structural reforms"
        - "Scenario planning"
        - "Cross-axis sensitivity analysis"
      effects:
        - "Reduces transition cost"
        - "Improves resilience"
        - "Strengthens phase discipline"

    relational_awareness:
      description: >
        Awareness of how different structural axes interact—centralization with
        oversight, method with access, oversight with timing, etc.
      signals:
        - "Recognition of cross-axis coupling"
        - "Understanding of compensatory movement"
        - "Awareness of structural tension"
      effects:
        - "Improves coherence scoring"
        - "Reduces unintended drift"
        - "Supports stable equilibrium behavior"

  drift_interactions:
    stabilizing_effects:
      - "Awareness layers reduce drift magnitude by improving structural self-recognition."
      - "They increase basin stability by reinforcing coherent configurations."
      - "They help systems detect early signs of incoherent transitions."
    failure_modes:
      - "Low awareness accelerates drift across linked axes."
      - "Loss of historical awareness increases transition volatility."
      - "Weak relational awareness amplifies cross-axis tension."

  integration_with_analyzer:
    vector_adjustments: "Awareness strength modifies drift vectors and coherence scoring."
    invariant_checks: "Awareness layers interact with behavioral invariants."
    narrative_output: "Analyzer includes awareness notes in its structural explanations."

  metadata:
    version: "1.0"
    generated: "2026-03-04"
    notes: "Defines structural awareness layers for GSM-based analysis."

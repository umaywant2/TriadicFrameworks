governance_manifold:

  description: >
    The governance manifold defines the structural space in which all
    governance systems are represented. Each system is mapped to a point in a
    five‑axis vector space [C, M, O, A, T], where each axis captures a
    substrate‑level structural property. The manifold provides the coordinate
    system used by the Analyzer, physics engine, basin classifier, drift
    detector, and observer layer.

  version: "1.0"

  axes:

    C:
      name: "Centralization"
      range: [0.0, 3.0]
      interpretation:
        low: "Distributed authority, federated or devolved structures"
        mid: "Mixed central–local authority"
        high: "Strong central authority, hierarchical integration"

    M:
      name: "Method"
      range: [0.0, 3.5]
      interpretation:
        0.0: "Plurality / first‑past‑the‑post"
        1.0: "Preferential / ranked‑choice"
        2.0: "Two‑round majority"
        3.0: "Proportional / mediated / hybrid"

    O:
      name: "Oversight"
      range: [0.0, 3.0]
      interpretation:
        low: "Independent oversight, distributed checks"
        mid: "Mixed oversight (administrative + independent)"
        high: "Centralized oversight, integrated control"

    A:
      name: "Access"
      range: [0.0, 2.0]
      interpretation:
        low: "Broad access, open nomination"
        mid: "Structured access, party‑mediated"
        high: "Restricted access, administrative gatekeeping"

    T:
      name: "Timing"
      range: [0.0, 2.0]
      interpretation:
        low: "Fixed cycles, predictable cadence"
        mid: "Semi‑fixed cycles, constructive mechanisms"
        high: "Administrative timing, variable cycles"

  manifold_properties:

    continuity: >
      The manifold is continuous; small changes in structural configuration
      produce small movements in vector space.

    coupling: >
      Axes are partially coupled through cross‑axis physics. Movement along one
      axis may induce compensatory movement along another.

    basin_attractors: >
      Regions of the manifold correspond to equilibrium basins (CPL, CPF, CTR,
      PCL, HCL). Systems tend to drift toward the basin whose structural forces
      best match their configuration.

    drift_fields: >
      Drift is represented as a vector field over the manifold, shaped by
      invariants, awareness layers, absorptive structures, and physics rules.

  coordinate_rules:

    normalization: "All vectors must be normalized to axis ranges."
    rounding: "Vectors may be rounded to 0.1 precision for display."
    comparability: "Vectors are directly comparable across systems and eras."
    adjustability: "Physics engine may adjust vectors before basin evaluation."

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines the structural coordinate system for GSM analysis."

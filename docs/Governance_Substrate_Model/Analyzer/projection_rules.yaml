projection_rules:

  description: >
    Defines the rules used by the Analyzer and Triadic Observer to generate
    structural projections. Projections identify plausible future vectors,
    drift pathways, and basin trajectories based on current structural
    conditions. They do not predict outcomes; they map structural possibility
    space.

  version: "1.0"

  projection_inputs:
    required:
      - structural_vector
      - drift_pressure
      - invariant_tension
      - awareness_layers
      - physics_forces
      - basin_classification
      - historical_drift_sequence
    optional:
      - regime_mode
      - absorptive_strength
      - phase_state

  projection_rules:

    drift_projection:
      description: >
        Drift is projected by extending the current drift vector scaled by
        physics forces, invariant tension, and awareness strength.
      formula: "projected_drift = drift_vector * drift_multiplier"
      drift_multiplier_factors:
        - "physics_force_intensity"
        - "invariant_tension_score"
        - "awareness_strength"
        - "absorptive_strength_inverse"

    boundary_constraints:
      description: >
        Projections must remain within axis ranges defined by the manifold.
      rules:
        - "Clamp projected values to axis min/max"
        - "Apply compensatory movement if projection violates physics balance"

    basin_projection:
      description: >
        Basin trajectory is determined by projected vector and basin topology.
      rules:
        - "Identify nearest basin for projected vector"
        - "Compute basin_distance_change"
        - "Estimate stability_shift"
        - "Flag transition if boundary proximity > 0.7"

    transition_likelihood:
      description: >
        Transition likelihood is derived from drift magnitude, boundary
        proximity, and invariant tension.
      formula: >
        likelihood = weighted_sum(
          drift_magnitude,
          boundary_proximity,
          invariant_tension_score
        )
      thresholds:
        low: 0.0–0.3
        medium: 0.3–0.6
        high: 0.6–1.0

    absorptive_forecast:
      description: >
        Absorptive capacity is projected based on historical resilience and
        current tension.
      rules:
        - "Decrease absorptive_strength when tension is rising"
        - "Increase absorptive_strength when drift stabilizes"
        - "Floor at 0.0, cap at 1.0"

    regime_mode_projection:
      description: >
        Regime mode is projected based on phase discipline, drift category,
        and invariant tension.
      transitions:
        stable_to_tension: "tension_score > 3"
        tension_to_drift: "drift_category == meso"
        drift_to_transition: "boundary_proximity > 0.7"
        transition_to_reconstruction: "new_basin_stability_score > 0.5"
        reconstruction_to_stable: "coherence_score > 70"

  projection_output_schema:
    projected_vector: [<C>, <M>, <O>, <A>, <T>]
    projected_drift:
      vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
      magnitude: <number>
      category: "micro | meso | macro | regime_shift"
    basin_trajectory:
      projected_basin: <CPL | CPF | CTR | PCL | HCL>
      basin_distance_change: <number>
      stability_shift: <number>
    transition_signals:
      likelihood: <0–1>
      boundary_pressure: <0–1>
    absorptive_forecast:
      projected_strength: <0–1>
      failure_risk: <0–1>
    regime_mode_projection:
      mode: "<projected_mode>"
      confidence: <0–1>

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines structural projection rules for GSM analysis."

observer_future_schema:

  description: >
    Defines the structure of the Future Lens within the Triadic Observer.
    The Future Lens projects likely structural movements, drift vectors,
    transition signals, and basin trajectories based on current vector,
    physics forces, invariant tension, awareness layers, and historical drift.
    It does not predict outcomes; it identifies structurally plausible futures.

  version: "1.0"

  future_projection:

    projection_id: "<unique_id>"
    timestamp: "<YYYY-MM-DD>"

    starting_vector:
      C: <number>
      M: <number>
      O: <number>
      A: <number>
      T: <number>
      metadata:
        confidence: <0–1>

    projected_drift:
      vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
      magnitude: <number>
      category: "micro | meso | macro | regime_shift"
      drivers:
        - axis_pair: "<C↔O | M↔A | O↔T>"
          magnitude: <number>
          direction: "positive | negative"
      notes: "<optional>"

    transition_signals:
      likelihood: <0–1>
      nearest_transition:
        from_basin: <CPL | CPF | CTR | PCL | HCL>
        to_basin: <CPL | CPF | CTR | PCL | HCL>
        cost: <number>
      boundary_pressure: <0–1>
      notes: "<optional>"

    basin_trajectory:
      current_basin: <CPL | CPF | CTR | PCL | HCL>
      projected_basin: <CPL | CPF | CTR | PCL | HCL>
      basin_distance_change: <number>
      stability_shift: <number>
      movement_direction: "approaching | departing | crossing"

    awareness_influence:
      structural: <0–10>
      procedural: <0–10>
      historical: <0–10>
      anticipatory: <0–10>
      relational: <0–10>
      notes: "<optional>"

    absorptive_forecast:
      current_strength: <0–1>
      projected_strength: <0–1>
      failure_risk: <0–1>
      notes: "<optional>"

    narrative:
      summary: "<short explanation of projected structural future>"
      key_signals:
        - "<signal_1>"
        - "<signal_2>"
      drift_explanation:
        - "<why drift is expected>"
      transition_context:
        - "<why a transition is or is not likely>"
      basin_context:
        - "<how basin alignment may change>"

    metadata:
      generated_by: "triadic_observer"
      created: "<YYYY-MM-DD>"
      notes: "<optional>"

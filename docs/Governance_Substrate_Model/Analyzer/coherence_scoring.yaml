coherence_scoring:

  description: >
    Coherence scoring evaluates how structurally consistent a governance system
    is within the Governance Substrate Model (GSM). The score reflects alignment
    with behavioral invariants, awareness layers, absorptive structures,
    cross-axis physics, and basin stability. It is not normative; it measures
    structural integrity, not desirability.

  version: "1.0"

  score_range:
    min: 0
    max: 100
    interpretation:
      high: "80–100: Strong structural coherence; stable basin alignment."
      medium: "50–79: Mixed coherence; moderate drift or tension."
      low: "0–49: Structural incoherence; high drift or transition pressure."

  components:

    invariant_alignment:
      weight: 0.35
      description: "Degree of alignment with GSM behavioral invariants."
      metrics:
        - id: authority_distribution
          scale: 0–10
        - id: method_access_consistency
          scale: 0–10
        - id: oversight_integrity
          scale: 0–10
        - id: timing_stability
          scale: 0–10
        - id: absorptive_capacity
          scale: 0–10

    awareness_strength:
      weight: 0.20
      description: "Strength of awareness layers supporting structural coherence."
      metrics:
        - id: structural_awareness
          scale: 0–10
        - id: procedural_awareness
          scale: 0–10
        - id: historical_awareness
          scale: 0–10
        - id: anticipatory_awareness
          scale: 0–10
        - id: relational_awareness
          scale: 0–10

    physics_consistency:
      weight: 0.20
      description: "Degree to which cross-axis physics remain balanced."
      metrics:
        - id: centralization_oversight_balance
          scale: 0–10
        - id: method_access_balance
          scale: 0–10
        - id: oversight_timing_balance
          scale: 0–10
        - id: compensatory_movement
          scale: 0–10

    basin_stability:
      weight: 0.15
      description: "How well the system fits within its nearest equilibrium basin."
      metrics:
        - id: basin_distance
          scale: 0–10
        - id: stability_gradient
          scale: 0–10
        - id: basin_identity_strength
          scale: 0–10

    drift_pressure:
      weight: 0.10
      description: "Magnitude and direction of drift relative to basin boundaries."
      metrics:
        - id: drift_magnitude
          scale: 0–10
        - id: drift_forces
          scale: 0–10
        - id: transition_pressure
          scale: 0–10

  scoring_formula: >
    coherence_score =
      (invariant_alignment * 0.35) +
      (awareness_strength * 0.20) +
      (physics_consistency * 0.20) +
      (basin_stability * 0.15) +
      (drift_pressure * 0.10)

  output_fields:
    total_score: "0–100"
    component_scores:
      - invariant_alignment
      - awareness_strength
      - physics_consistency
      - basin_stability
      - drift_pressure
    narrative_summary: >
      Human-readable explanation of coherence strengths, weaknesses, and
      structural implications.
    flags:
      - "invariant_violations"
      - "awareness_gaps"
      - "physics_tension"
      - "basin_instability"
      - "drift_signals"

  integration_with_analyzer:
    invariant_checker: "Provides invariant alignment metrics."
    awareness_layers: "Feeds awareness strength values."
    physics_engine: "Supplies cross-axis tension and compensatory movement."
    basin_classifier: "Provides basin distance and stability gradient."
    drift_detector: "Provides drift magnitude and transition pressure."
    coherence_event_schema: "Used to generate event-level scoring entries."

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines the scoring model for structural coherence within the GSM."

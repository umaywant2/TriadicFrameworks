phase_discipline:

  description: >
    Phase discipline defines how governance systems maintain coherence across
    structural phases. A phase is a stable operational interval characterized
    by consistent structural vectors, invariant alignment, and predictable
    drift behavior. Phase discipline ensures that transitions between phases
    occur cleanly, without accumulating structural debt or hidden tension.

  version: "1.0"

  phases:

    stable_phase:
      description: >
        System operates within basin expectations with low tension and
        predictable drift. Invariants are aligned or lightly strained.
      indicators:
        coherence_minimum: 70
        tension_maximum: 3
        drift_category: "micro"
      exit_conditions:
        - "tension_score > 3"
        - "drift_category in [meso, macro]"
        - "basin_distance increasing persistently"

    tension_phase:
      description: >
        System experiences rising invariant strain or physics imbalance.
        Drift pressure increases but remains contained by absorptive structures.
      indicators:
        tension_score: [3, 6]
        absorptive_strength_minimum: 0.4
      exit_conditions:
        - "tension_score > 6"
        - "absorptive_strength < 0.4"
        - "cross-axis forces exceed threshold"

    drift_phase:
      description: >
        System undergoes measurable structural movement. Drift is directional
        and shaped by physics forces and invariant tension.
      indicators:
        drift_category: "meso"
        active_forces_minimum: 1
      exit_conditions:
        - "drift_category == macro"
        - "basin_boundary_proximity > 0.7"

    transition_phase:
      description: >
        System crosses basin boundaries or approaches transition thresholds.
        Structural identity is reconfiguring; stability is low.
      indicators:
        basin_boundary_proximity: >0.7
        transition_likelihood: >0.5
      exit_conditions:
        - "new_basin_stability_score > 0.5"
        - "drift_category returns to micro"

    reconstruction_phase:
      description: >
        System re-establishes structural identity after a transition. Physics
        forces dampen, invariants realign, and drift stabilizes.
      indicators:
        drift_category: "micro"
        tension_score: <4
        absorptive_strength: >0.5
      exit_conditions:
        - "coherence_score > 70"
        - "basin_stability_score > 0.6"

  rules:

    phase_entry_rules:
      - "A phase may only be entered when its indicators are satisfied."
      - "Phase transitions must be monotonic unless absorptive structures justify reversal."
      - "No phase may be skipped unless drift_category == regime_shift."

    phase_exit_rules:
      - "Exit occurs when any exit condition is met."
      - "Exit must be recorded as a coherence event."
      - "Transition to reconstruction_phase requires new basin alignment."

    structural_debt_rules:
      description: >
        Structural debt accumulates when a system remains in a phase after
        exit conditions are met. Debt increases tension, amplifies drift, and
        weakens absorptive capacity.
      accumulation_factors:
        - "ignored invariant violations"
        - "persistent cross-axis imbalance"
        - "unresolved drift pressure"
      mitigation:
        - "absorptive strengthening"
        - "procedural stabilization"
        - "timing normalization"

  integration_with_analyzer:
    invariant_checker: "Supplies tension and violation signals"
    physics_engine: "Provides cross-axis forces and drift amplification"
    drift_detector: "Determines drift category and magnitude"
    basin_classifier: "Identifies boundary proximity and transitions"
    coherence_scoring: "Evaluates phase stability"
    observer_layer: "Records phase sequences in history/now/future lenses"

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines phase-honest structural behavior for GSM analysis."

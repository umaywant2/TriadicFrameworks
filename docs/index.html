  <script>
    async function loadCodex() {
      try {
        // Adjust path if needed depending on where this HTML lives
        const response = await fetch('https://www.triadicframeworks.org/index.md');
        if (!response.ok) {
          throw new Error('⚔️ Failed to load index.md');
        }
        const mdText = await response.text();

        // Render Markdown to HTML
        const html = marked.parse(mdText, {
          breaks: true,
          gfm: true
        });

        const root = document.getElementById('www-root');
        root.innerHTML = html;

        // Trigger MathJax typesetting after content is injected
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([root]).catch(err => console.error(err));
        }
      } catch (err) {
        console.error(err);
        const root = document.getElementById('www-root');
        root.innerHTML = `
          <h1>Index</h1>
          <p>By Nawder Loswin 01/18/2026 © www.TriadicFrameworks.org</p>
          <p>Unable to load <code>index.md</code>.</p>
          <pre>${String(err)}</pre>
        `;
      }
    }

    loadCodex();
  </script>

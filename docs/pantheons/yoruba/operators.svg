  <text x="735" y="170" fill="#ffd3e3" font-size="12" text-anchor="middle">Ṣango kingship</text>
  <text x="735" y="190" fill="#ffd3e3" font-size="12" text-anchor="middle">Ọba lineages</text>
  <text x="735" y="210" fill="#ffd3e3" font-size="12" text-anchor="middle">Coastal projection</text>
  <text x="735" y="230" fill="#ffd3e3" font-size="12" text-anchor="middle">Ifẹ art (hyperrealism)</text>

  <!-- Flow operators -->
  <text x="885" y="170" fill="#d3fff7" font-size="12" text-anchor="middle">Oshun</text>
  <text x="885" y="190" fill="#d3fff7" font-size="12" text-anchor="middle">Oya</text>
  <text x="885" y="210" fill="#d3fff7" font-size="12" text-anchor="middle">Niger–Benue corridor</text>

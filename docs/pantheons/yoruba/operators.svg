  <text x="435" y="130" fill="#9fd3ff" font-size="16" text-anchor="middle">Dimensional</text>
  <text x="585" y="130" fill="#ffe3c3" font-size="16" text-anchor="middle">Liminal</text>
  <text x="735" y="130" fill="#ffd3e3" font-size="16" text-anchor="middle">Projection</text>
  <text x="885" y="130" fill="#d3fff7" font-size="16" text-anchor="middle">Flow</text>


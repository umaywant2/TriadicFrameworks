<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#1a1f33"/>
    </radialGradient>

    <!-- Field gradients -->
    <linearGradient id="clarity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd34f"/>
      <stop offset="100%" stop-color="#c79a1f"/>
    </linearGradient>

    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b1f2f"/>
      <stop offset="100%" stop-color="#2b101b"/>
    </linearGradient>

    <linearGradient id="dimensional" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7bff"/>
      <stop offset="100%" stop-color="#203b8f"/>
    </linearGradient>

    <linearGradient id="liminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f4f"/>
      <stop offset="100%" stop-color="#c76a1f"/>
    </linearGradient>

    <linearGradient id="projection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f7b"/>
      <stop offset="100%" stop-color="#c71f4f"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fffd3"/>
      <stop offset="100%" stop-color="#1fc79a"/>
    </linearGradient>

    <linearGradient id="emergent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b34fff"/>
      <stop offset="100%" stop-color="#6a1fc7"/>
    </linearGradient>

    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1b33"/>
      <stop offset="100%" stop-color="#1b335b"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)" />

  <!-- Title -->
  <text x="540" y="80" fill="#ffffff" font-size="32" text-anchor="middle">
    Yoruba Supersphere Geometry (RTT/2)
  </text>

  <!-- Concentric geometry rings -->
  <circle cx="540" cy="540" r="420" fill="none" stroke="url(#void)" stroke-width="3" />
  <circle cx="540" cy="540" r="360" fill="none" stroke="url(#emergent)" stroke-width="3" />
  <circle cx="540" cy="540" r="300" fill="none" stroke="url(#flow)" stroke-width="3" />
  <circle cx="540" cy="540" r="240" fill="none" stroke="url(#projection)" stroke-width="3" />
  <circle cx="540" cy="540" r="180" fill="none" stroke="url(#liminal)" stroke-width="3" />
  <circle cx="540" cy="540" r="120" fill="none" stroke="url(#dimensional)" stroke-width="3" />
  <circle cx="540" cy="540" r="70" fill="none" stroke="url(#shadow)" stroke-width="3" />
  <circle cx="540" cy="540" r="30" fill="none" stroke="url(#clarity)" stroke-width="3" />

  <!-- Field labels -->
  <text x="540" y="140" fill="#ffe38f" font-size="20" text-anchor="middle">Clarity Cone</text>
  <text x="540" y="200" fill="#ffb3c7" font-size="20" text-anchor="middle">Shadow Cone</text>
  <text x="540" y="260" fill="#9fd3ff" font-size="20" text-anchor="middle">Dimensional Spine</text>
  <text x="540" y="320" fill="#ffe3c3" font-size="20" text-anchor="middle">Liminal Ring</text>
  <text x="540" y="380" fill="#ffd3e3" font-size="20" text-anchor="middle">Projection Band</text>
  <text x="540" y="440" fill="#d3fff7" font-size="20" text-anchor="middle">Flow Band</text>
  <text x="540" y="500" fill="#f3e3ff" font-size="20" text-anchor="middle">Emergent Ring</text>
  <text x="540" y="560" fill="#9fd3ff" font-size="20" text-anchor="middle">Void Substrate</text>

  <!-- Apex operator markers -->
  <text x="540" y="540" fill="#ffffff" font-size="18" text-anchor="middle">
    Ọrunmila · Ogun · Ọrun/Aiye · Esu · Ṣango · Oshun · Egungun · Olodumare
  </text>

</svg>


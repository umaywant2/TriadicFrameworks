  <circle cx="400" cy="400" r="160" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M400 240
           C460 260 480 320 450 360
           C420 400 360 420 340 380
           C320 340 340 280 400 240"
        fill="none" stroke="#2a7" stroke-width="3"/>
  <path d="M400 560

<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Columns: Celestial Bureaucracy, Earthly Order, Human Realm -->
  <text x="200" y="80" text-anchor="middle">Celestial Bureaucracy</text>
  <text x="400" y="80" text-anchor="middle">Earthly Order</text>
  <text x="600" y="80" text-anchor="middle">Human Realm</text>

  <!-- Rows: Heaven, Earth, Human -->
  <text x="80" y="200">Heaven</text>
  <text x="80" y="400">Earth</text>
  <text x="80" y="600">Human</text>

  <!-- Example operator nodes -->
  <circle cx="200" cy="200" r="30" fill="#fff" stroke="#000"/>
  <text x="200" y="205" text-anchor="middle" font-size="10">Jade Emperor</text>

  <circle cx="400" cy="400" r="30" fill="#fff" stroke="#000"/>
  <text x="400" y="405" text-anchor="middle" font-size="10">Mandate of Heaven</text>

  <circle cx="600" cy="600" r="30" fill="#fff" stroke="#000"/>
  <text x="600" y="605" text-anchor="middle" font-size="10">Scholar‑Official</text>

  <!-- Dragon / Phoenix / Tiger band -->
  <rect x="100" y="650" width="600" height="80" fill="none" stroke="#555"/>
  <text x="400" y="680" text-anchor="middle">Dragon · Phoenix · Tiger</text>
</svg>

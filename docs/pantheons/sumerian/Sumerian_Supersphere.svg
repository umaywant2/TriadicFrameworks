<svg width="1080" height="600" viewBox="0 0 1080 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="50%" stop-color="#261b4f"/>
      <stop offset="100%" stop-color="#5b2b7f"/>
    </linearGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b3"/>
      <stop offset="100%" stop-color="#c28b2f"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="600" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="540" y="40" fill="#ffffff" font-size="20" text-anchor="middle">
    Sumerian Supersphere — Full Triadic Geometry
  </text>

  <!-- Supersphere center -->
  <circle cx="540" cy="300" r="80" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="540" cy="300" r="40" fill="url(#coreGrad)" stroke="#ffd27f" stroke-width="1"/>
  <text x="540" y="295" fill="#000000" font-size="13" text-anchor="middle">
    Abzu / Apsu
  </text>
  <text x="540" y="315" fill="#000000" font-size="11" text-anchor="middle">
    Primordial substrate core
  </text>

  <!-- Lower cone: Void / Shadow / Clarity (T-dominant) -->
  <!-- Base triangle -->
  <polygon points="540,300 430,500 650,500" fill="none" stroke="#ffcc66" stroke-width="1.8"/>
  <!-- Void label -->
  <text x="540" y="520" fill="#ffcc66" font-size="11" text-anchor="middle">
    VOID: Abzu · Tiamat · Lahmu/Lahamu · Anshar/Kishar
  </text>
  <!-- Shadow band -->
  <line x1="470" y1="430" x2="610" y2="430" stroke="#ff8866" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="540" y="425" fill="#ff8866" font-size="11" text-anchor="middle">
    SHADOW: Ereshkigal · Kur · Nergal · Namtar · Galla
  </text>
  <!-- Clarity band -->
  <line x1="490" y1="360" x2="590" y2="360" stroke="#ffe6a3" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="540" y="355" fill="#ffe6a3" font-size="11" text-anchor="middle">
    CLARITY: Enlil · Enki · Utu/Shamash
  </text>

  <!-- Equatorial band: Dimensional / Liminal (S-dominant) -->
  <ellipse cx="540" cy="300" rx="210" ry="55" fill="none" stroke="#ff66ff" stroke-width="1.6"/>
  <!-- Dimensional label -->
  <text x="540" y="260" fill="#ffb3ff" font-size="11" text-anchor="middle">
    DIMENSIONAL: Anu · Ki · Ninhursag · realm tiers
  </text>
  <!-- Liminal label -->
  <text x="540" y="340" fill="#ff66ff" font-size="11" text-anchor="middle">
    LIMINAL: Inanna · Ninshubur · Neti · Gilgamesh/Enkidu
  </text>

  <!-- Upper cone: Projection / Flow / Emergent (E-dominant) -->
  <!-- Top triangle -->
  <polygon points="540,300 430,120 650,120" fill="none" stroke="#66ffcc" stroke-width="1.8"/>
  <!-- Projection band -->
  <line x1="490" y1="230" x2="590" y2="230" stroke="#66ffcc" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="540" y="225" fill="#66ffcc" font-size="11" text-anchor="middle">
    PROJECTION: Uruk · Dumuzi cycles · Ziusudra · Geshtinanna
  </text>
  <!-- Flow band -->
  <line x1="470" y1="190" x2="610" y2="190" stroke="#66c2ff" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="540" y="185" fill="#66c2ff" font-size="11" text-anchor="middle">
    FLOW: Pazuzu · Ugallu · Tigris/Euphrates · plague currents
  </text>
  <!-- Emergent band -->
  <line x1="450" y1="150" x2="630" y2="150" stroke="#ff6666" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="540" y="145" fill="#ff6666" font-size="11" text-anchor="middle">
    EMERGENT ARM: Anzu · Humbaba · Asag · Lamashtu · Kur anomalies
  </text>

  <!-- Axis labels -->
  <text x="880" y="300" fill="#ffffff" font-size="11" text-anchor="middle">
    S-axis (Structure): Enlil → Anu → Ki
  </text>
  <text x="880" y="320" fill="#ff8866" font-size="11" text-anchor="middle">
    N-axis (Entropy): Ereshkigal → Nergal → Galla
  </text>
  <text x="880" y="340" fill="#66ffcc" font-size="11" text-anchor="middle">
    R-axis (Resonance): Inanna → Ninshubur → Gilgamesh
  </text>

  <!-- Pantheon label -->
  <text x="540" y="80" fill="#ffffff" font-size="15" text-anchor="middle">
    Sumerian Supersphere — Shadow‑heavy · Emergent‑dense · Substrate‑deep
  </text>
</svg>

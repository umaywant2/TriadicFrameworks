  <circle cx="600" cy="600" r="30" fill="#fff" stroke="#000"/>
  <text x="600" y="605" text-anchor="middle" font-size="10">Susanoo</text>

  <!-- Liminal band -->
  <rect x="100" y="650" width="600" height="80" fill="none" stroke="#555"/>
  <text x="400" y="680" text-anchor="middle">Tsukuyomi · Sarutahiko · Izumo Spirits</text>

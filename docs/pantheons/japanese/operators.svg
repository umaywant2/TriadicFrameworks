  <text x="400" y="80" text-anchor="middle">Earthly Kami</text>
  <text x="600" y="80" text-anchor="middle">Underworld Kami</text>

  <!-- Rows -->
  <text x="80" y="200">Genesis</text>
  <text x="80" y="400">Continuance</text>

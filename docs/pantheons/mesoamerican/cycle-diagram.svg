<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky / Earth / Underworld concentric cycle -->
  <circle cx="400" cy="400" r="260" fill="none" stroke="#222" stroke-width="2" />
  <circle cx="400" cy="400" r="180" fill="none" stroke="#222" stroke-width="2" />
  <circle cx="400" cy="400" r="100" fill="none" stroke="#222" stroke-width="2" />

  <!-- Labels -->
  <text x="400" y="130" text-anchor="middle">Sky</text>
  <text x="400" y="410" text-anchor="middle">Earth</text>
  <text x="400" y="520" text-anchor="middle">Underworld</text>

  <!-- Calendar cycle arc -->
  <path d="M140 400 A260 260 0 0 1 660 400" fill="none" stroke="#c33" stroke-width="3" />
  <text x="400" y="380" text-anchor="middle">Calendar Cycle</text>

  <!-- Ballgame cycle -->
  <path d="M220 400 A180 180 0 0 1 580 400" fill="none" stroke="#36c" stroke-width="3" />
  <text x="400" y="430" text-anchor="middle">Ballgame Cycle</text>
</svg>

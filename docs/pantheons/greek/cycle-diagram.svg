<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky / Earth / Underworld concentric cycle -->
  <circle cx="400" cy="400" r="260" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="400" cy="400" r="180" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="400" cy="400" r="100" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Labels -->
  <text x="400" y="130" text-anchor="middle">Sky (Olympian)</text>
  <text x="400" y="410" text-anchor="middle">Earth (Mortal)</text>
  <text x="400" y="520" text-anchor="middle">Underworld (Chthonic)</text>

  <!-- Heroic cycle -->
  <path d="M150 400 A250 250 0 0 1 650 400" fill="none" stroke="#2a7" stroke-width="3"/>
  <text x="400" y="370" text-anchor="middle">Heroic Cycle</text>

  <!-- Ritual / festival cycle -->
  <path d="M220 400 A180 180 0 0 1 580 400" fill="none" stroke="#c93" stroke-width="3"/>
  <text x="400" y="430" text-anchor="middle">Ritual & Festival Cycle</text>
</svg>

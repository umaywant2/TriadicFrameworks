### Figure caption (paper‑ready)

**Figure 1.** *Structural overview of the Boson Substrate Model (BSM).*  
The diagram illustrates a minimal substrate layer supporting operator‑mediated interactions under declared operating regimes. Local interaction scopes constrain propagation, while an explicit coherence envelope defines valid structural behavior. Boundary crossings are classified as regime exit rather than failure. Higher‑level models, shown schematically above the substrate, remain semantically independent of the substrate layer.


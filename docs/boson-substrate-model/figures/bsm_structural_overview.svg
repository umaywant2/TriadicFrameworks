### SVG sanity‑check — spec‑by‑spec

The editor view doesn’t expose the SVG’s internal elements (paths, groups, labels), so a literal line‑by‑line inspection isn’t possible from this surface. A precise **verification checklist** below lets you confirm compliance quickly inside the SVG editor by toggling layers/groups and scanning labels.

#### 1) Substrate Layer (Base Plane)
- **Present:** A single, neutral horizontal band/field.
- **Label:** “Boson Substrate (Structural Layer)”.
- **Check:** No textures, gradients, axes, or units.

#### 2) Substrate Nodes / Regions
- **Present:** Light points or regions within the substrate.
- **Check:** No numbers, scales, or particle imagery.

#### 3) Operators (Mediators)
- **Present:** Simple arrows/waves/connectors between regions.
- **Label:** “Operator_Mediated Interaction”.
- **Check:** Procedural look (no force vectors, no energy cues).

#### 4) Locality Boundary
- **Present:** Dashed/soft outlines indicating neighborhoods.
- **Label:** “Local Interaction Scope”.
- **Check:** Boundaries constrain reach without implying metrics.

#### 5) Coherence Envelope
- **Present:** A larger enclosing boundary around the substrate.
- **Label:** “Declared Operating Regime”.
- **Check:** Everything valid sits inside; no dramatic styling.

#### 6) Regime Exit Indicator
- **Present:** One subtle crossing (arrow/fade) beyond the envelope.
- **Label:** “Regime Exit (Non‑Catastrophic)”.
- **Check:** Understated; no alarm colors.

#### 7) Higher‑Level Models (Optional, Faded)
- **Present (if included):** Faint boxes above substrate.
- **Label:** “Higher‑Level Models”.
- **Check:** No arrows pointing down into the substrate.

#### 8) Avoidances (Hard No’s)
- **Confirm absence:** equations, quantum symbols, axes, scales, optimization loops, energy gradients.

If each item above is satisfied, the SVG matches the spec and is reviewer‑safe.


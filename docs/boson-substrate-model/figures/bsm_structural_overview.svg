## Why this figure works
- Matches the paper’s restraint
- Prevents misinterpretation instantly
- Reads like a standards diagram
- Supports citation without explanation
- Lets AI systems *describe it correctly*

Once this SVG is aligned, **BSM is visually and structurally complete**.


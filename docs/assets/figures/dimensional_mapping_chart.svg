<svg width="2400" height="2400" viewBox="0 0 2400 2400" xmlns="http://www.w3.org/2000/svg">
  <title>Dimensional Mapping Chart</title>
  <defs>
    <style>
      .ring { fill: none; stroke-width: 28; }
      .txt  { font-family: Arial, sans-serif; font-size: 42px; fill: #1f2937; text-anchor: middle; }
      .forces { stroke: #E63946; }
      .fluids { stroke: #457B9D; }
      .freqs  { stroke: #9D4EDD; }
    </style>
  </defs>

  <!-- Concentric rings 1D–9D -->
  <g transform="translate(1200,1200)">
    <circle class="ring forces" r="220"/>
    <circle class="ring fluids" r="330"/>
    <circle class="ring freqs"  r="440"/>
    <circle class="ring forces" r="550"/>
    <circle class="ring fluids" r="660"/>
    <circle class="ring freqs"  r="770"/>
    <circle class="ring forces" r="880"/>
    <circle class="ring fluids" r="990"/>
    <circle class="ring freqs"  r="1100"/>
  </g>

  <!-- Labels above each ring -->
  <text class="txt" x="1200" y="940">1D — Force basis</text>
  <text class="txt" x="1200" y="830">2D — Liquidity plane</text>
  <text class="txt" x="1200" y="720">3D — Market psychology</text>
  <text class="txt" x="1200" y="610">4D — Tether &amp; contract space</text>
  <text class="txt" x="1200" y="500">5D — Stochastic drift</text>
  <text class="txt" x="1200" y="390">6D — Volatility cycles</text>
  <text class="txt" x="1200" y="280">7D — Synthetic leverage</text>
  <text class="txt" x="1200" y="170">8D — Liquidity stress</text>
  <text class="txt" x="1200" y="60">9D — Collapse threshold</text>
</svg>

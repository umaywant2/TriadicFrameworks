<!-- glyph_nested_loop.svg -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Nested Loop Glyph</title>
  <defs>
    <style>
      .stroke { fill: none; stroke: #457B9D; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Interlocking spirals (two arms) -->
  <path class="stroke"
        d="M256,256
           m-128,0
           a128,128 0 1,1 256,0
           a64,64 0 1,0 -128,0
           a96,96 0 1,1 -192,0"/>
  <path class="stroke"
        d="M256,256
           m128,0
           a128,128 0 1,1 -256,0
           a64,64 0 1,0 128,0
           a96,96 0 1,1 192,0"/>
  <!-- Möbius-like connector -->
  <path class="stroke" d="M160 256 C208 192, 304 320, 352 256"/>
</svg>

<svg width="520" height="320" viewBox="0 0 520 320" xmlns="http://www.w3.org/2000/svg">
  <!-- High-Interest Narrative -->
  <rect x="140" y="20" width="240" height="60" rx="8" ry="8" fill="#ebf4ff" stroke="#3182ce" stroke-width="2"/>
  <text x="260" y="45" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">
    HIGH-INTEREST NARRATIVE
  </text>
  <text x="260" y="63" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    Ancient Aliens framing
  </text>

  <!-- New Audience Attention -->
  <rect x="140" y="120" width="240" height="60" rx="8" ry="8" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="260" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">
    NEW AUDIENCE ATTENTION
  </text>
  <text x="260" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    curiosity · wonder
  </text>

  <!-- More Fragment Artifacts -->
  <rect x="140" y="220" width="240" height="60" rx="8" ry="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="260" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">
    MORE FRAGMENT ARTIFACTS
  </text>
  <text x="260" y="263" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    clips · memes · questions
  </text>

  <!-- Vertical arrows -->
  <line x1="260" y1="80" x2="260" y2="120" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="104" text-anchor="start" font-family="sans-serif" font-size="11" fill="#555">
    attracts
  </text>

  <line x1="260" y1="180" x2="260" y2="220" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="280" y="204" text-anchor="start" font-family="sans-serif" font-size="11" fill="#555">
    generates
  </text>

  <!-- Loop-back arrow -->
  <path d="M380,250 C440,250 440,60 300,60" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="150" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    feeds back into
  </text>

  <!-- Marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>

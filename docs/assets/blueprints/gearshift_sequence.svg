<!-- gearshift_sequence.svg -->
<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .core { transition: fill 0.5s ease; }
    .pulse3 .core.active { fill: #ffd700; }
    .pulse6 .core.auxiliary { fill: #00ccff; }
    .pulse9 .spiral { stroke: #ff00ff; stroke-width: 4; }
  </style>

  <!-- Tesla Spiral -->
  <path class="spiral" d="M400,400
           C500,300 600,500 400,600
           C300,700 200,500 400,400" 
        stroke="#ffcc00" stroke-width="2" fill="none" />

  <!-- Warp Core Array -->
  <g id="warp-cores">
    <!-- Active Cores -->
    <circle class="core active" cx="300" cy="300" r="20" fill="#00ffcc" />
    <circle class="core active" cx="500" cy="300" r="20" fill="#00ffcc" />
    <circle class="core active" cx="400" cy="500" r="20" fill="#00ffcc" />
    
    <!-- Auxiliary Cores -->
    <circle class="core auxiliary" cx="250" cy="400" r="15" fill="#ccccff" />
    <circle class="core auxiliary" cx="550" cy="400" r="15" fill="#ccccff" />
    <circle class="core auxiliary" cx="400" cy="250" r="15" fill="#ccccff" />
    <circle class="core auxiliary" cx="400" cy="650" r="15" fill="#ccccff" />
    <circle class="core auxiliary" cx="325" cy="600" r="15" fill="#ccccff" />
    <circle class="core auxiliary" cx="475" cy="600" r="15" fill="#ccccff" />
  </g>

  <!-- Entry Portal -->
  <rect x="375" y="780" width="50" height="20" fill="#333" />
  <text x="360" y="770" font-size="14" fill="#fff">Entry Portal</text>
</svg>

<!--
## 🔁 Animation Frames
You can toggle `.pulse3`, `.pulse6`, `.pulse9` classes dynamically to simulate:
- Pulse 3: Active cores glow gold, spiral begins to hum
- Pulse 6: Auxiliary cores pulse blue, overlays shimmer
- Pulse 9: Spiral thickens, chamber stabilizes, portal glows

## 🛠️ Integration Targets
- Embed this `.svg` in your chamber scroll or validator dashboard
- Link gearshift logic from `gearshift_369.py` to animation triggers
- Use contributor rituals to activate pulses and log badge triggers
-->

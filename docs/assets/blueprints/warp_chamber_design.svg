  <circle cx="400" cy="400" r="380" stroke="#369" stroke-width="3" fill="none" />

  <!-- Tesla 369 Spiral -->
  <path d="M400,400
           C500,300 600,500 400,600
           C300,700 200,500 400,400" 
        stroke="#ffcc00" stroke-width="2" fill="none" />

  <!-- Warp Core Array (9 Crystals) -->

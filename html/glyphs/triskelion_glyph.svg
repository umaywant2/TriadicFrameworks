<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" id="triadic-glyph">
  <!-- Outer Circle Frame -->
  <circle cx="100" cy="100" r="90" stroke="gold" stroke-width="4" fill="none"/>

  <!-- Forces Blade (Red) -->
  <path id="forces-blade" class="blade forces"
    d="M100,100 L130,60 Q135,55 140,70 Q145,85 130,90 Z"
    fill="red"/>

  <!-- Fluids Blade (Green) -->
  <path id="fluids-blade" class="blade fluids"
    d="M100,100 L60,130 Q55,135 70,140 Q85,145 90,130 Z"
    fill="green"/>

  <!-- Frequency Blade (Blue) -->
  <path id="frequency-blade" class="blade frequency"
    d="M100,100 L140,140 Q145,145 130,150 Q115,155 110,140 Z"
    fill="blue"/>
</svg>

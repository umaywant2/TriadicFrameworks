**Concept:** simple, clean, triadic diagram showing substrate → dynamics → tools.

You can implement this as `fft_graphical_abstract.svg`:

- **Canvas:** 1200×600, white background.
- **Top band (title):**
  - Centered text: `FRAMEWORK FIELD THEORY (FFT)` in bold, sans‑serif, ~32px.
  - Subtitle below: `Drift • Coherence • Regime Dynamics in LLMs`, ~20px, gray.

- **Middle row: three main nodes (triad):**
  - Left circle:
    - Label: `SUBSTRATE`
    - Subtext: `Declared / Undeclared`
  - Center circle:
    - Label: `DYNAMICS`
    - Subtext: `Drift • Coherence Waves • Collisions`
  - Right circle:
    - Label: `TOOLS`
    - Subtext: `SDE • TPO • DBV • FCD • OSS`
  - Arrows:
    - From SUBSTRATE → DYNAMICS
    - From DYNAMICS → TOOLS
    - A faint arrow from TOOLS back to SUBSTRATE (feedback loop).

- **Bottom band (summary text):**
  - Single line centered:  
    `FFT models LLM behavior as motion in a triadic field, yielding testable predictions and practical stabilizing tools.`

Colors:  
- Circles: soft blue, soft purple, soft teal.  
- Arrows: dark gray.  
- Text: near‑black.

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mint Audit Dashboard — Coeus Protocol</title>
  <link rel="stylesheet" href="../styles/mint.css" />
</head>
<body>
  <h1>🪙 Mint Audit Dashboard</h1>
  <table>
    <thead>
      <tr>
        <th>Coin</th>
        <th>Status</th>
        <th>Attempted By</th>
        <th>Notes</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody id="mint-body">
      <!-- Rows injected by mint_viewer.js -->
    </tbody>
  </table>

  <script>
    fetch("../tokens/mint_audit_log.json")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("mint-body");
        data.forEach(entry => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${entry.coin_id}</td>
            <td>${entry.status}</td>
            <td>${entry.attempted_by}</td>
            <td>${entry.notes}</td>
            <td>${entry.timestamp}</td>
          `;
          tbody.appendChild(row);
        });
      });
  </script>
</body>
</html>

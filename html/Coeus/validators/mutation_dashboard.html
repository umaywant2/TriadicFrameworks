<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mutation Dashboard — Coeus Protocol</title>
  <link rel="stylesheet" href="../styles/mutation.css" />
</head>
<body>
  <h1>🧬 Remix Mutation Dashboard</h1>
  <table>
    <thead>
      <tr>
        <th>Coin</th>
        <th>Mutation Type</th>
        <th>Origin</th>
        <th>Declared By</th>
        <th>Notes</th>
        <th>Timestamp</th>
      </tr>
    </thead>
    <tbody id="mutation-body">
      <!-- Rows injected by mutation_viewer.js -->
    </tbody>
  </table>

  <script>
    fetch("../tokens/remix_mutation_log.json")
      .then(res => res.json())
      .then(data => {
        const tbody = document.getElementById("mutation-body");
        data.forEach(entry => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${entry.coin_id}</td>
            <td>${entry.mutation_type}</td>
            <td>${entry.origin}</td>
            <td>${entry.declared_by}</td>
            <td>${entry.notes}</td>
            <td>${entry.timestamp}</td>
          `;
          tbody.appendChild(row);
        });
      });
  </script>
</body>
</html>

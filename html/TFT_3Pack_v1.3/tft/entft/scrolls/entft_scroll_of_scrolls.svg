<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fefefe"/>

  <!-- Title -->
  <text x="450" y="40" font-size="24" text-anchor="middle" fill="#222">entft: Scroll of Scrolls</text>

  <!-- Scroll Nodes -->
  <g>
    <circle cx="150" cy="120" r="40" fill="#ccf5ff" stroke="#333" stroke-width="2"/>
    <text x="150" y="125" font-size="14" text-anchor="middle" fill="#000">Benchmark</text>

    <circle cx="300" cy="120" r="40" fill="#ffe0cc" stroke="#333" stroke-width="2"/>
    <text x="300" y="125" font-size="14" text-anchor="middle" fill="#000">Overlay</text>

    <circle cx="450" cy="120" r="40" fill="#d0ffd0" stroke="#333" stroke-width="2"/>
    <text x="450" y="125" font-size="14" text-anchor="middle" fill="#000">Tutorial</text>

    <circle cx="600" cy="120" r="40" fill="#e0ccff" stroke="#333" stroke-width="2"/>
    <text x="600" y="125" font-size="14" text-anchor="middle" fill="#000">Badges</text>

    <circle cx="750" cy="120" r="40" fill="#f9f9a0" stroke="#333" stroke-width="2"/>
    <text x="750" y="125" font-size="14" text-anchor="middle" fill="#000">Manifesto</text>
  </g>

  <!-- Remix Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <line x1="190" y1="120" x2="260" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="120" x2="410" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="120" x2="560" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="120" x2="710" y2="120" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="450" y="550" font-size="14" text-anchor="middle" fill="#555">Each scroll is a node. Each node, a ritual. Each ritual, a legacy.</text>
</svg>

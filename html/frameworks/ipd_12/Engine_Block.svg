<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480">

  <!-- TITLE -->
  <text x="480" y="30" font-size="20" text-anchor="middle">IPD‑12 Engine Block</text>

  <!-- INTAKE PORTS (LEFT) -->
  <rect x="40" y="80" width="160" height="280" fill="none" stroke="black" stroke-width="2"/>
  <text x="120" y="70" font-size="14" text-anchor="middle">Intake Ports</text>

  <!-- Port 1–4 labels -->
  <text x="70" y="110" font-size="12">Port 1</text>
  <text x="70" y="150" font-size="12">Port 2</text>
  <text x="70" y="190" font-size="12">Port 3</text>
  <text x="70" y="230" font-size="12">Port 4</text>

  <!-- Port 1–4 triad bars -->
  <line x1="140" y1="110" x2="200" y2="110" stroke="black" stroke-width="2"/>
  <line x1="140" y1="150" x2="200" y2="150" stroke="black" stroke-width="2"/>
  <line x1="140" y1="190" x2="200" y2="190" stroke="black" stroke-width="2"/>
  <line x1="140" y1="230" x2="200" y2="230" stroke="black" stroke-width="2"/>

  <text x="120" y="280" font-size="10" text-anchor="middle">SIM / DIM / TIM / QIM / FSI</text>

  <!-- SUBSTRATE FEEDS (S1–S4) -->
  <rect x="220" y="80" width="140" height="280" fill="none" stroke="black" stroke-width="2"/>
  <text x="290" y="70" font-size="14" text-anchor="middle">Substrate Feeds</text>

  <!-- S1–S4 labels -->
  <text x="240" y="120" font-size="12">S1</text>
  <text x="240" y="160" font-size="12">S2</text>
  <text x="240" y="200" font-size="12">S3</text>
  <text x="240" y="240" font-size="12">S4</text>

  <!-- S1–S4 bars -->
  <line x1="260" y1="120" x2="320" y2="120" stroke="black" stroke-width="2"/>
  <line x1="260" y1="160" x2="320" y2="160" stroke="black" stroke-width="2"/>
  <line x1="260" y1="200" x2="320" y2="200" stroke="black" stroke-width="2"/>
  <line x1="260" y1="240" x2="320" y2="240" stroke="black" stroke-width="2"/>

  <text x="290" y="280" font-size="10" text-anchor="middle">Seed / Drift / Coherence / Boundary</text>

  <!-- ENGINE CORE (DIMENSIONAL RAILS + OBSERVER LOOPS) -->
  <rect x="340" y="60" width="280" height="320" fill="none" stroke="black" stroke-width="2"/>
  <text x="480" y="55" font-size="14" text-anchor="middle">IPD‑12 Engine Core</text>

  <!-- Dimensional rails block -->
  <rect x="360" y="90" width="120" height="260" fill="none" stroke="black" stroke-width="2"/>
  <text x="420" y="80" font-size="12" text-anchor="middle">Dimensional Rails</text>

  <!-- L rails -->
  <text x="370" y="120" font-size="11">L1</text>
  <text x="370" y="140" font-size="11">L2</text>
  <text x="370" y="160" font-size="11">L3</text>
  <text x="370" y="180" font-size="11">L4</text>
  <line x1="390" y1="120" x2="470" y2="120" stroke="black" stroke-width="2"/>
  <line x1="390" y1="140" x2="470" y2="140" stroke="black" stroke-width="2"/>
  <line x1="390" y1="160" x2="470" y2="160" stroke="black" stroke-width="2"/>
  <line x1="390" y1="180" x2="470" y2="180" stroke="black" stroke-width="2"/>

  <!-- C rails -->
  <text x="370" y="210" font-size="11">C1</text>
  <text x="370" y="230" font-size="11">C2</text>
  <text x="370" y="250" font-size="11">C3</text>
  <text x="370" y="270" font-size="11">C4</text>
  <line x1="390" y1="210" x2="470" y2="210" stroke="black" stroke-width="2"/>
  <line x1="390" y1="230" x2="470" y2="230" stroke="black" stroke-width="2"/>
  <line x1="390" y1="250" x2="470" y2="250" stroke="black" stroke-width="2"/>
  <line x1="390" y1="270" x2="470" y2="270" stroke="black" stroke-width="2"/>

  <!-- N rails label -->
  <text x="420" y="305" font-size="10" text-anchor="middle">N1–N4 (Neutral)</text>

  <!-- Observer control loops block -->
  <rect x="480" y="90" width="120" height="260" fill="none" stroke="black" stroke-width="2"/>
  <text x="540" y="80" font-size="12" text-anchor="middle">Observer Loops</text>

  <!-- O1–O4 circles -->
  <circle cx="510" cy="130" r="12" fill="none" stroke="black" stroke-width="2"/>
  <text x="510" y="135" font-size="11" text-anchor="middle">O1</text>

  <circle cx="550" cy="170" r="12" fill="none" stroke="black" stroke-width="2"/>
  <text x="550" y="175" font-size="11" text-anchor="middle">O2</text>

  <circle cx="510" cy="210" r="12" fill="none" stroke="black" stroke-width="2"/>
  <text x="510" y="215" font-size="11" text-anchor="middle">O3</text>

  <circle cx="550" cy="250" r="12" fill="none" stroke="black" stroke-width="2"/>
  <text x="550" y="255" font-size="11" text-anchor="middle">O4</text>

  <text x="540" y="305" font-size="10" text-anchor="middle">Field / Regime / Coherence / Apex</text>

  <!-- CONNECTIONS: Substrate → Rails → Observer -->
  <line x1="320" y1="120" x2="360" y2="120" stroke="black" stroke-width="2"/>
  <line x1="320" y1="160" x2="360" y2="160" stroke="black" stroke-width="2"/>
  <line x1="320" y1="200" x2="360" y2="200" stroke="black" stroke-width="2"/>
  <line x1="320" y1="240" x2="360" y2="240" stroke="black" stroke-width="2"/>

  <line x1="470" y1="150" x2="480" y2="150" stroke="black" stroke-width="2"/>
  <line x1="470" y1="230" x2="480" y2="230" stroke="black" stroke-width="2"/>

  <!-- OUTPUT HEADERS (RIGHT) -->
  <rect x="620" y="80" width="300" height="280" fill="none" stroke="black" stroke-width="2"/>
  <text x="770" y="70" font-size="14" text-anchor="middle">Output Headers</text>

  <!-- Header boxes -->
  <rect x="640" y="100" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="700" y="125" font-size="11" text-anchor="middle">H‑RTT</text>

  <rect x="640" y="150" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="700" y="175" font-size="11" text-anchor="middle">H‑GU</text>

  <rect x="640" y="200" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="700" y="225" font-size="11" text-anchor="middle">H‑FFT</text>

  <rect x="640" y="250" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="700" y="275" font-size="11" text-anchor="middle">H‑Pantheon</text>

  <rect x="780" y="120" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="840" y="145" font-size="11" text-anchor="middle">H‑Dimensional</text>

  <rect x="780" y="190" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="840" y="215" font-size="11" text-anchor="middle">H‑Substrate</text>

  <rect x="780" y="260" width="120" height="40" fill="none" stroke="black" stroke-width="2"/>
  <text x="840" y="285" font-size="11" text-anchor="middle">H‑Observer</text>

  <!-- Connections: Observer → Headers -->
  <line x1="600" y1="150" x2="640" y2="120" stroke="black" stroke-width="2"/>
  <line x1="600" y1="180" x2="640" y2="170" stroke="black" stroke-width="2"/>
  <line x1="600" y1="210" x2="640" y2="220" stroke="black" stroke-width="2"/>
  <line x1="600" y1="240" x2="640" y2="270" stroke="black" stroke-width="2"/>

  <!-- Legend -->
  <text x="480" y="350" font-size="10" text-anchor="middle">
    Intake → Substrate Feeds → Dimensional Rails → Observer Loops → Output Headers
  </text>

</svg>

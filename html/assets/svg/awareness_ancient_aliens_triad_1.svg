  </text>

  <rect x="320" y="190" width="160" height="60" rx="8" ry="8" fill="#fff7f0" stroke="#c05621" stroke-width="2"/>
  <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">

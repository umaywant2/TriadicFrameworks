  </text>

  <rect x="190" y="110" width="160" height="60" rx="8" ry="8" fill="#f3fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="270" y="140" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">
    INTERPRETATION
  </text>
  <text x="270" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">

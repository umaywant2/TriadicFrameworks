  </text>

  <!-- Arrows -->
  <line x1="120" y1="90" x2="270" y2="110" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="190" y="104" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">

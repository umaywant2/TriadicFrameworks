<svg width="520" height="260" viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg">
  <!-- Nodes -->
  <rect x="40" y="30" width="160" height="60" rx="8" ry="8" fill="#f3f4ff" stroke="#4b4acb" stroke-width="2"/>
  <text x="120" y="60" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#111">

<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="1080" height="720" fill="#0d0d0f"/>

  <!-- Title -->
  <text x="540" y="60" font-family="Arial" font-size="32" fill="#ffffff" text-anchor="middle">
    Governance Substrate — Philanthropy (RTT Structural Diagram)
  </text>

  <!-- Styles -->
  <defs>
    <style type="text/css"><![CDATA[
      .node {
        fill: #1a1a1d;
        stroke: #6a4df5;
        stroke-width: 2;
        rx: 12;
        ry: 12;
      }
      .label {
        fill: #ffffff;
        font-family: Arial;
        font-size: 18px;
        text-anchor: middle;
      }
      .sub {
        fill: #bbbbbb;
        font-family: Arial;
        font-size: 14px;
        text-anchor: middle;
      }
      .arrow {
        stroke: #6a4df5;
        stroke-width: 3;
        marker-end: url(#arrow);
      }
      .dashed {
        stroke: #888888;
        stroke-width: 2;
        stroke-dasharray: 6 6;
      }
    ]]></style>

    <!-- Arrowhead -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6a4df5"/>
    </marker>
  </defs>

  <!-- Top Layer: Authority -->
  <rect x="140" y="130" width="800" height="80" class="node"/>
  <text x="540" y="175" class="label">Authority Layer</text>
  <text x="540" y="205" class="sub">Donors • Boards • Executives • Intermediaries</text>

  <!-- Middle Layer: Accountability & Visibility -->
  <rect x="140" y="290" width="800" height="80" class="node"/>
  <text x="540" y="335" class="label">Accountability & Visibility Layer</text>
  <text x="540" y="365" class="sub">ACC(node) • VIS(node) • ASYM • OPA</text>

  <!-- Lower Layer: Incentives & Flow Integrity -->
  <rect x="140" y="450" width="800" height="80" class="node"/>
  <text x="540" y="495" class="label">Incentives & Flow Integrity Layer</text>
  <text x="540" y="525" class="sub">SET_IN • SET_OUT • SET_LEAK • FLOW • TRACE</text>

  <!-- Vertical Arrows -->
  <line x1="540" y1="210" x2="540" y2="290" class="arrow"/>
  <line x1="540" y1="370" x2="540" y2="450" class="arrow"/>

  <!-- Side Labels -->
  <text x="80" y="175" class="sub">GOV</text>
  <text x="80" y="335" class="sub">ACC / VIS</text>
  <text x="80" y="495" class="sub">SET / FLOW</text>

  <!-- Drift Indicators -->
  <line x1="940" y1="130" x2="940" y2="530" class="dashed"/>
  <text x="940" y="560" class="sub">DRF(mission / financial / governance / reporting)</text>

  <!-- Footer -->
  <text x="540" y="690" font-family="Arial" font-size="16" fill="#888888" text-anchor="middle">
    RTT Governance Substrate • Authority → Accountability → Incentives → Flow Integrity
  </text>

</svg>

    <line x1="280" y1="290" x2="520" y2="290" />
    <line x1="280" y1="380" x2="520" y2="380" />

    <line x1="680" y1="200" x2="920" y2="200" />
    <line x1="680" y1="290" x2="920" y2="290" />
    <line x1="680" y1="380" x2="920" y2="380" />

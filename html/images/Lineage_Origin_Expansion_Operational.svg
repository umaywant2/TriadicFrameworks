<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="triadic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#101b3a"/>
      <stop offset="100%" stop-color="#1b0f2e"/>
    </linearGradient>
    <linearGradient id="triadic-node" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ff"/>
      <stop offset="50%" stop-color="#ff0"/>
      <stop offset="100%" stop-color="#f0f"/>

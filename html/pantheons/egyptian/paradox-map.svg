<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="100%" stop-color="#151a2b"/>
    </radialGradient>

    <!-- Field colors -->
    <linearGradient id="clarity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd34f"/>
      <stop offset="100%" stop-color="#c79a1f"/>
    </linearGradient>

    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f7b"/>
      <stop offset="100%" stop-color="#c71f4f"/>
    </linearGradient>

    <linearGradient id="dimensional" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7bff"/>
      <stop offset="100%" stop-color="#203b8f"/>
    </linearGradient>

    <linearGradient id="liminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f4f"/>
      <stop offset="100%" stop-color="#c76a1f"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fffd3"/>
      <stop offset="100%" stop-color="#1fc79a"/>
    </linearGradient>

    <linearGradient id="emergent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b34fff"/>
      <stop offset="100%" stop-color="#6a1fc7"/>
    </linearGradient>

    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1b33"/>
      <stop offset="100%" stop-color="#1b335b"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="720" fill="url(#bg)" />

  <!-- Title -->
  <text x="540" y="60" fill="#ffffff" font-size="26" text-anchor="middle">
    Egyptian Paradox Map (RTT/3)
  </text>
  <text x="540" y="85" fill="#9fd3ff" font-size="13" text-anchor="middle">
    Osiris · Ra · Set · Ammut · Sphinx · Bennu · Ogdoad
  </text>

  <!-- Central paradox hub -->
  <circle cx="540" cy="360" r="60" fill="#0b1b33" stroke="#4fb3ff" stroke-width="2"/>
  <text x="540" y="355" fill="#e3f3ff" font-size="16" text-anchor="middle">
    Paradox Hub
  </text>
  <text x="540" y="375" fill="#9fd3ff" font-size="11" text-anchor="middle">
    Split · Fracture · Scatter · Inversion · Drift · Silence · Rebind
  </text>

  <!-- Spokes to major paradox nodes -->
  <!-- Osiris: death → kingship (Dimensional/Rebind) -->
  <line x1="540" y1="360" x2="360" y2="220" stroke="url(#dimensional)" stroke-width="2"/>
  <circle cx="360" cy="220" r="22" fill="#0b1020" stroke="url(#dimensional)" stroke-width="2"/>
  <text x="360" y="215" fill="#9fd3ff" font-size="12" text-anchor="middle">Osiris</text>
  <text x="360" y="235" fill="#9fd3ff" font-size="10" text-anchor="middle">death → kingship</text>

  <!-- Ra: aging → renewal (Clarity/Drift→Rebind) -->
  <line x1="540" y1="360" x2="720" y2="220" stroke="url(#clarity)" stroke-width="2"/>
  <circle cx="720" cy="220" r="22" fill="#201510" stroke="url(#clarity)" stroke-width="2"/>
  <text x="720" y="215" fill="#ffe38f" font-size="12" text-anchor="middle">Ra</text>
  <text x="720" y="235" fill="#ffe38f" font-size="10" text-anchor="middle">aging → renewal</text>

  <!-- Set: protector → destroyer (Shadow/Inversion) -->
  <line x1="540" y1="360" x2="260" y2="360" stroke="url(#shadow)" stroke-width="2"/>
  <circle cx="260" cy="360" r="22" fill="#200b12" stroke="url(#shadow)" stroke-width="2"/>
  <text x="260" y="355" fill="#ffd3e3" font-size="12" text-anchor="middle">Set</text>
  <text x="260" y="375" fill="#ffd3e3" font-size="10" text-anchor="middle">protector → destroyer</text>

  <!-- Ammut: justice → annihilation (Shadow/Fracture) -->
  <line x1="540" y1="360" x2="820" y2="360" stroke="url(#shadow)" stroke-width="2"/>
  <circle cx="820" cy="360" r="22" fill="#200b12" stroke="url(#shadow)" stroke-width="2"/>
  <text x="820" y="355" fill="#ffd3e3" font-size="12" text-anchor="middle">Ammut</text>
  <text x="820" y="375" fill="#ffd3e3" font-size="10" text-anchor="middle">justice → annihilation</text>

  <!-- Sphinx: riddle → passage (Emergent/Liminal) -->
  <line x1="540" y1="360" x2="360" y2="500" stroke="url(#emergent)" stroke-width="2"/>
  <circle cx="360" cy="500" r="22" fill="#1a1020" stroke="url(#emergent)" stroke-width="2"/>
  <text x="360" y="495" fill="#f3e3ff" font-size="12" text-anchor="middle">Sphinx</text>
  <text x="360" y="515" fill="#f3e3ff" font-size="10" text-anchor="middle">riddle → passage</text>

  <!-- Bennu: self‑death → self‑creation (Emergent/Rebind) -->
  <line x1="540" y1="360" x2="720" y2="500" stroke="url(#emergent)" stroke-width="2"/>
  <circle cx="720" cy="500" r="22" fill="#1a1020" stroke="url(#emergent)" stroke-width="2"/>
  <text x="720" y="495" fill="#f3e3ff" font-size="12" text-anchor="middle">Bennu</text>
  <text x="720" y="515" fill="#f3e3ff" font-size="10" text-anchor="middle">self‑death → self‑creation</text>

  <!-- Ogdoad: silence → creation (Void/Silence→Rebind) -->
  <line x1="540" y1="360" x2="540" y2="560" stroke="url(#void)" stroke-width="2"/>
  <circle cx="540" cy="560" r="24" fill="#0b1b33" stroke="url(#void)" stroke-width="2"/>
  <text x="540" y="555" fill="#9fd3ff" font-size="12" text-anchor="middle">Ogdoad</text>
  <text x="540" y="575" fill="#9fd3ff" font-size="10" text-anchor="middle">silence → creation</text>

  <!-- Regime legend -->
  <text x="80" y="640" fill="#ffffff" font-size="12">
    Regimes:
  </text>
  <text x="80" y="660" fill="#9fd3ff" font-size="11">
    Split · Fracture · Scatter · Inversion · Drift · Silence · Rebind
  </text>

  <!-- Field legend -->
  <text x="540" y="640" fill="#ffffff" font-size="12" text-anchor="middle">
    Fields:
  </text>
  <text x="540" y="660" fill="#ffe38f" font-size="11" text-anchor="middle">
    Clarity · Shadow · Dimensional · Liminal · Flow · Emergent · Void
  </text>

  <!-- Caption -->
  <text x="540" y="700" fill="#ffffff" font-size="11" text-anchor="middle">
    Egyptian paradox map: major paradox engines linked to RTT regimes and triadic fields —
    cycle‑dense, paradox‑tight, underworld‑structured.
  </text>

</svg>


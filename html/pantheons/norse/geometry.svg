<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- World Tree (Yggdrasil) axis -->
  <line x1="400" y1="100" x2="400" y2="700" stroke="#2a7" stroke-width="4"/>
  <text x="420" y="120">Yggdrasil Axis</text>

  <!-- Nine Worlds ring (schematic) -->
  <circle cx="400" cy="400" r="220" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Sample worlds -->
  <circle cx="400" cy="200" r="25" fill="#fff" stroke="#000"/>
  <text x="400" y="195" text-anchor="middle" font-size="10">Asgard</text>

  <circle cx="550" cy="320" r="25" fill="#fff" stroke="#000"/>
  <text x="550" y="315" text-anchor="middle" font-size="10">Vanaheim</text>

  <circle cx="250" cy="320" r="25" fill="#fff" stroke="#000"/>
  <text x="250" y="315" text-anchor="middle" font-size="10">Alfheim</text>

  <circle cx="520" cy="520" r="25" fill="#fff" stroke="#000"/>
  <text x="520" y="515" text-anchor="middle" font-size="10">Jotunheim</text>

  <circle cx="280" cy="520" r="25" fill="#fff" stroke="#000"/>
  <text x="280" y="515" text-anchor="middle" font-size="10">Hel</text>

  <!-- Title -->
  <text x="400" y="80" text-anchor="middle">Yggdrasil & Nine Worlds Geometry</text>
</svg>

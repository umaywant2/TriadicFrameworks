<svg width="1080" height="480" viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="50%" stop-color="#151b33"/>
      <stop offset="100%" stop-color="#24123f"/>
    </linearGradient>
    <linearGradient id="heatGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1b2a40"/>
      <stop offset="50%" stop-color="#4f7ad3"/>
      <stop offset="100%" stop-color="#ff5c5c"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1080" height="480" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="540" y="40" fill="#ffffff" font-size="20" text-anchor="middle">
    Pantheon‑to‑Pantheon Resonance Heatmap — Greek · Hindu · Sumerian
  </text>

  <!-- Axes labels -->
  <text x="120" y="90" fill="#ffffff" font-size="12">Fields</text>
  <text x="260" y="90" fill="#ffffff" font-size="12">Greek ↔ Hindu</text>
  <text x="520" y="90" fill="#ffffff" font-size="12">Greek ↔ Sumerian</text>
  <text x="780" y="90" fill="#ffffff" font-size="12">Hindu ↔ Sumerian</text>

  <!-- Field labels -->
  <g fill="#ffffff" font-size="11">
    <text x="120" y="130">Void</text>
    <text x="120" y="160">Shadow</text>
    <text x="120" y="190">Clarity</text>
    <text x="120" y="220">Dimensional</text>
    <text x="120" y="250">Liminal</text>
    <text x="120" y="280">Projection</text>
    <text x="120" y="310">Flow</text>
    <text x="120" y="340">Emergent</text>
  </g>

  <!-- Helper: function to draw a heat cell (we just inline rectangles) -->
  <!-- Color convention: low resonance = dark blue, mid = purple, high = red -->

  <!-- Row 1: Void -->
  <!-- Greek ↔ Hindu: weak -->
  <rect x="230" y="118" width="120" height="20" fill="#1b2a40" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: weak-moderate -->
  <rect x="490" y="118" width="120" height="20" fill="#2c3f70" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong -->
  <rect x="750" y="118" width="120" height="20" fill="#ff5c5c" stroke="#333" stroke-width="0.5"/>

  <!-- Row 2: Shadow -->
  <!-- Greek ↔ Hindu: moderate -->
  <rect x="230" y="148" width="120" height="20" fill="#4f7ad3" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: moderate -->
  <rect x="490" y="148" width="120" height="20" fill="#4f7ad3" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: very strong -->
  <rect x="750" y="148" width="120" height="20" fill="#ff3030" stroke="#333" stroke-width="0.5"/>

  <!-- Row 3: Clarity -->
  <!-- Greek ↔ Hindu: strong -->
  <rect x="230" y="178" width="120" height="20" fill="#ff7f7f" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: strong -->
  <rect x="490" y="178" width="120" height="20" fill="#ff7f7f" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong -->
  <rect x="750" y="178" width="120" height="20" fill="#ff7f7f" stroke="#333" stroke-width="0.5"/>

  <!-- Row 4: Dimensional -->
  <!-- Greek ↔ Hindu: moderate -->
  <rect x="230" y="208" width="120" height="20" fill="#4f7ad3" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: moderate -->
  <rect x="490" y="208" width="120" height="20" fill="#4f7ad3" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong -->
  <rect x="750" y="208" width="120" height="20" fill="#ff5c5c" stroke="#333" stroke-width="0.5"/>

  <!-- Row 5: Liminal -->
  <!-- Greek ↔ Hindu: weak -->
  <rect x="230" y="238" width="120" height="20" fill="#1b2a40" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: weak-moderate -->
  <rect x="490" y="238" width="120" height="20" fill="#2c3f70" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong -->
  <rect x="750" y="238" width="120" height="20" fill="#ff5c5c" stroke="#333" stroke-width="0.5"/>

  <!-- Row 6: Projection -->
  <!-- Greek ↔ Hindu: strong -->
  <rect x="230" y="268" width="120" height="20" fill="#ff7f7f" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: strong -->
  <rect x="490" y="268" width="120" height="20" fill="#ff7f7f" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong -->
  <rect x="750" y="268" width="120" height="20" fill="#ff7f7f" stroke="#333" stroke-width="0.5"/>

  <!-- Row 7: Flow -->
  <!-- Greek ↔ Hindu: moderate -->
  <rect x="230" y="298" width="120" height="20" fill="#4f7ad3" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: moderate -->
  <rect x="490" y="298" width="120" height="20" fill="#4f7ad3" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong-moderate -->
  <rect x="750" y="298" width="120" height="20" fill="#ff6a6a" stroke="#333" stroke-width="0.5"/>

  <!-- Row 8: Emergent -->
  <!-- Greek ↔ Hindu: weak -->
  <rect x="230" y="328" width="120" height="20" fill="#1b2a40" stroke="#333" stroke-width="0.5"/>
  <!-- Greek ↔ Sumerian: weak -->
  <rect x="490" y="328" width="120" height="20" fill="#1b2a40" stroke="#333" stroke-width="0.5"/>
  <!-- Hindu ↔ Sumerian: strong -->
  <rect x="750" y="328" width="120" height="20" fill="#ff5c5c" stroke="#333" stroke-width="0.5"/>

  <!-- Legend -->
  <text x="540" y="380" fill="#ffffff" font-size="12" text-anchor="middle">
    Resonance scale: dark blue = weak · blue = moderate · red = strong
  </text>
  <text x="540" y="405" fill="#ffffff" font-size="11" text-anchor="middle">
    Hindu ↔ Sumerian: strongest resonance in Shadow, Dimensional, Liminal, Emergent fields
  </text>
  <text x="540" y="425" fill="#ffffff" font-size="11" text-anchor="middle">
    All three: strong resonance in Clarity and Projection fields
  </text>
</svg>

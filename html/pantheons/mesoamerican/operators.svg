<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Triadic grid: Sky/Earth/Underworld × Jaguar/Serpent/Bird -->
  <!-- Columns: Jaguar, Serpent, Bird -->
  <text x="200" y="80" text-anchor="middle">Jaguar</text>
  <text x="400" y="80" text-anchor="middle">Serpent</text>
  <text x="600" y="80" text-anchor="middle">Bird</text>

  <!-- Rows: Sky, Earth, Underworld -->
  <text x="80" y="200">Sky</text>
  <text x="80" y="400">Earth</text>
  <text x="80" y="600">Underworld</text>

  <!-- Cells as operator nodes -->
  <!-- Example: Sky × Bird -->
  <circle cx="600" cy="200" r="30" fill="#fff" stroke="#000" />
  <text x="600" y="205" text-anchor="middle" font-size="10">Solar Vision</text>

  <!-- Earth × Jaguar -->
  <circle cx="200" cy="400" r="30" fill="#fff" stroke="#000" />
  <text x="200" y="405" text-anchor="middle" font-size="10">Ritual Power</text>

  <!-- Underworld × Serpent -->
  <circle cx="400" cy="600" r="30" fill="#fff" stroke="#000" />
  <text x="400" y="605" text-anchor="middle" font-size="10">Transition</text>

  <!-- Liminal operators band -->
  <rect x="100" y="650" width="600" height="80" fill="none" stroke="#555" />
  <text x="400" y="680" text-anchor="middle">Hero Twins · Maize Deity · Storm/Rain</text>
</svg>

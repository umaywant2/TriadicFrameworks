<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420">
  <style>
    .node { fill:#1e293b; stroke:#0f172a; stroke-width:1.2; }
    .text { fill:#e5e7eb; font-family:system-ui, sans-serif; font-size:12px; }
    .edge { stroke:#64748b; stroke-width:1.2; marker-end:url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Core_Concepts -->
  <rect x="40" y="40" width="140" height="40" rx="6" class="node"/>
  <text x="60" y="65" class="text">Core_Concepts</text>

  <!-- Gravity_Foundations -->
  <rect x="260" y="40" width="170" height="40" rx="6" class="node"/>
  <text x="275" y="65" class="text">Gravity_Foundations</text>

  <!-- Drift_Taxonomy -->
  <rect x="260" y="120" width="170" height="40" rx="6" class="node"/>
  <text x="275" y="145" class="text">Drift_Taxonomy</text>

  <!-- FFF_Gravity -->
  <rect x="260" y="200" width="170" height="40" rx="6" class="node"/>
  <text x="275" y="225" class="text">FFF_Gravity</text>

  <!-- RTT_Operators -->
  <rect x="40" y="200" width="160" height="40" rx="6" class="node"/>
  <text x="55" y="225" class="text">RTT_Operators</text>

  <!-- Operator_Families -->
  <rect x="40" y="280" width="160" height="40" rx="6" class="node"/>
  <text x="55" y="305" class="text">Operator_Families</text>

  <!-- Module_Graph -->
  <rect x="480" y="200" width="170" height="40" rx="6" class="node"/>
  <text x="495" y="225" class="text">Module_Graph</text>

  <!-- Drift_Taxonomy internals -->
  <rect x="260" y="280" width="120" height="30" rx="6" class="node"/>
  <text x="270" y="300" class="text">d_Capture</text>

  <rect x="390" y="280" width="120" height="30" rx="6" class="node"/>
  <text x="400" y="300" class="text">d_Classify</text>

  <rect x="260" y="320" width="120" height="30" rx="6" class="node"/>
  <text x="270" y="340" class="text">d_Operators</text>

  <rect x="390" y="320" width="120" height="30" rx="6" class="node"/>
  <text x="400" y="340" class="text">d_Examples</text>

  <rect x="325" y="360" width="120" height="30" rx="6" class="node"/>
  <text x="335" y="380" class="text">d_Paper</text>

  <!-- Edges -->
  <line x1="180" y1="60" x2="260" y2="60" class="edge"/>
  <line x1="345" y1="80" x2="345" y2="120" class="edge"/>
  <line x1="345" y1="160" x2="345" y2="200" class="edge"/>

  <line x1="120" y1="220" x2="120" y2="280" class="edge"/>
  <line x1="430" y1="220" x2="480" y2="220" class="edge"/>

  <line x1="345" y1="160" x2="320" y2="280" class="edge"/>
  <line x1="345" y1="160" x2="450" y2="280" class="edge"/>
  <line x1="345" y1="160" x2="320" y2="320" class="edge"/>
  <line x1="345" y1="160" x2="450" y2="320" class="edge"/>
  <line x1="345" y1="160" x2="385" y2="360" class="edge"/>
</svg>

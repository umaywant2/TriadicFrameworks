<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="640" fill="#0b0f14"/>

  <!-- 9D wrapper ring -->
  <circle cx="480" cy="320" r="280" fill="none" stroke="#7bdfff" stroke-width="2"/>
  <text x="480" y="30" fill="#7bdfff" font-size="14" text-anchor="middle">9D Freqi Wrapper (rUPS)</text>

  <!-- 6D harmonic ring -->
  <circle cx="480" cy="320" r="200" fill="none" stroke="#ffd166" stroke-width="2"/>
  <text x="480" y="60" fill="#ffd166" font-size="14" text-anchor="middle">6D Harmonic (rQPS)</text>

  <!-- 3D embodiment ring -->
  <circle cx="480" cy="320" r="120" fill="none" stroke="#06d6a0" stroke-width="2"/>
  <text x="480" y="90" fill="#06d6a0" font-size="14" text-anchor="middle">3D Embodiment (rPPS)</text>

  <!-- Shared anchors: 1D, 2D, 6D -->
  <circle cx="480" cy="320" r="6" fill="#ffffff"/>
  <text x="500" y="320" fill="#ffffff" font-size="12">1D Anchor</text>
  <circle cx="360" cy="320" r="4" fill="#ffffff"/>
  <text x="330" y="335" fill="#ffffff" font-size="12">2D Anchor</text>
  <circle cx="680" cy="320" r="4" fill="#ffffff"/>
  <text x="710" y="335" fill="#ffffff" font-size="12">6D Anchor</text>

  <!-- Green-zone band near 5D-7D -->
  <path d="M200,320 a280,120 0 1,1 560,0 a280,120 0 1,1 -560,0" fill="none" stroke="#4caf50" stroke-width="3" stroke-dasharray="6,6"/>
  <text x="480" y="560" fill="#4caf50" font-size="13" text-anchor="middle">Green-zone resonance band (5D–7D)</text>

  <!-- Red-zone corridors -->
  <path d="M120,140 C280,120 680,140 840,120" fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="2,6"/>
  <path d="M160,520 C320,480 640,500 800,480" fill="none" stroke="#e63946" stroke-width="2" stroke-dasharray="2,6"/>
  <text x="480" y="600" fill="#e63946" font-size="13" text-anchor="middle">Red-zone corridors (frontier chaos with enclaves)</text>

  <!-- Enclave nodes (green-zone pockets inside red-zone) -->
  <circle cx="300" cy="220" r="8" fill="#8bc34a"/>
  <circle cx="660" cy="430" r="8" fill="#8bc34a"/>
  <text x="480" y="120" fill="#8bc34a" font-size="12" text-anchor="middle">Green-zone enclaves in red-zone</text>

  <!-- Legend -->
  <rect x="30" y="430" width="260" height="160" fill="#10151b" stroke="#2a2f36"/>
  <text x="50" y="455" fill="#9aa7b0" font-size="14">Legend</text>
  <text x="50" y="475" fill="#7bdfff" font-size="12">9D Freqi wrapper</text>
  <text x="50" y="495" fill="#ffd166" font-size="12">6D harmonic (stars)</text>
  <text x="50" y="515" fill="#06d6a0" font-size="12">3D embodiment (planetary)</text>
  <text x="50" y="535" fill="#4caf50" font-size="12">Green-zone band 5D–7D</text>
  <text x="50" y="555" fill="#e63946" font-size="12">Red-zone corridors</text>
  <text x="50" y="575" fill="#8bc34a" font-size="12">Green-zone enclaves in red-zone</text>
</svg>

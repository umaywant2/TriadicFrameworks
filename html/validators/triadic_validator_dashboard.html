<div class="validator-dashboard">
  <h2>Triadic Resonance Validator</h2>

  <!-- Live Glyph -->
  <div class="glyph-container">
    <svg id="triadic-glyph" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="90" stroke="gold" stroke-width="4" fill="none"/>
      <path id="forces-blade" class="blade forces" d="M100,100 L130,60 Q135,55 140,70 Q145,85 130,90 Z" fill="red"/>
      <path id="fluids-blade" class="blade fluids" d="M100,100 L60,130 Q55,135 70,140 Q85,145 90,130 Z" fill="green"/>
      <path id="frequency-blade" class="blade frequency" d="M100,100 L140,140 Q145,145 130,150 Q115,155 110,140 Z" fill="blue"/>
    </svg>
  </div>

  <!-- Scoring Matrix -->
  <div class="scoring-matrix">
    <h3>Logic Pillars</h3>
    <table>
      <tr><th>Pillar</th><th>Score</th><th>Status</th></tr>
      <tr><td>Forces</td><td id="score-forces">0</td><td id="status-forces">Unstable</td></tr>
      <tr><td>Fluids</td><td id="score-fluids">0</td><td id="status-fluids">Unstable</td></tr>
      <tr><td>Frequency</td><td id="score-frequency">0</td><td id="status-frequency">Unstable</td></tr>
    </table>
  </div>

  <!-- Contributor Panel -->
  <div class="contributors">
    <h3>Validated By</h3>
    <ul>
      <li>Forces: <span id="validator-forces">—</span></li>
      <li>Fluids: <span id="validator-fluids">—</span></li>
      <li>Frequency: <span id="validator-frequency">—</span></li>
    </ul>
  </div>

  <!-- Remix Lineage -->
  <div class="lineage">
    <h3>Remix Lineage</h3>
    <p id="lineage-info">Awaiting remix ancestry...</p>
  </div>
</div>

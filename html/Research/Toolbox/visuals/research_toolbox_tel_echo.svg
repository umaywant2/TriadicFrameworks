<svg width="1080" height="360" viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tel-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#11112A"/>
      <stop offset="100%" stop-color="#1B1235"/>
    </linearGradient>

    <linearGradient id="tel-echo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#40C4FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#B388FF"/>
    </linearGradient>

    <marker id="tel-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#B3B3FF"/>
    </marker>

    <style>
      .bg { fill: url(#tel-bg); }
      .node { fill: #141424; stroke: #7C4DFF; stroke-width: 1.6; rx: 12; ry: 12; }
      .node-title { font-family: system-ui, sans-serif; font-size: 15px; fill: #FFFFFF; font-weight: 600; }
      .node-sub { font-family: system-ui, sans-serif; font-size: 11px; fill: #C8C8E8; }
      .echo-line { stroke: url(#tel-echo); stroke-width: 2.2; marker-end: url(#tel-arrow); }
      .label { font-family: system-ui, sans-serif; font-size: 12px; fill: #C8C8E8; }
    </style>
  </defs>

  <rect width="1080" height="360" class="bg"/>

  <!-- Research Toolbox node -->
  <g transform="translate(160,180)">
    <rect x="-120" y="-50" width="240" height="100" class="node"/>
    <text x="0" y="-20" text-anchor="middle" class="node-title">Research Toolbox</text>
    <text x="0" y="4" text-anchor="middle" class="node-sub">Four‑Source Substrate • RTT/1/2/3</text>
    <text x="0" y="24" text-anchor="middle" class="node-sub">structured research reasoning</text>
  </g>

  <!-- RTT echo to SARG -->
  <g transform="translate(540,120)">
    <rect x="-120" y="-40" width="240" height="80" class="node"/>
    <text x="0" y="-10" text-anchor="middle" class="node-title">SARG</text>
    <text x="0" y="12" text-anchor="middle" class="node-sub">argumentation • claims • evidence</text>
  </g>

  <!-- RTT echo to TEL -->
  <g transform="translate(540,260)">
    <rect x="-120" y="-40" width="240" height="80" class="node"/>
    <text x="0" y="-10" text-anchor="middle" class="node-title">TEL</text>
    <text x="0" y="12" text-anchor="middle" class="node-sub">Triadic Echo Lattice • propagation</text>
  </g>

  <!-- Downstream module cluster -->
  <g transform="translate(900,180)">
    <rect x="-130" y="-70" width="260" height="140" class="node"/>
    <text x="0" y="-40" text-anchor="middle" class="node-title">Downstream Modules</text>
    <text x="0" y="-16" text-anchor="middle" class="node-sub">Inverted Economics • Philanthropy</text>
    <text x="0" y="4" text-anchor="middle" class="node-sub">Media Substrate • Governance</text>
    <text x="0" y="24" text-anchor="middle" class="node-sub">Medicine • others</text>
  </g>

  <!-- Echo lines -->
  <line x1="280" y1="180" x2="420" y2="120" class="echo-line"/>
  <line x1="280" y1="180" x2="420" y2="260" class="echo-line"/>

  <line x1="660" y1="120" x2="770" y2="180" class="echo-line"/>
  <line x1="660" y1="260" x2="770" y2="180" class="echo-line"/>

  <!-- Labels -->
  <text x="350" y="140" class="label">RTT echo</text>
  <text x="350" y="240" class="label">RTT echo</text>
  <text x="710" y="110" class="label">structured arguments</text>
  <text x="710" y="270" class="label">propagated patterns</text>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">

  <style>
    .node { fill: #ffffff; stroke: #222222; stroke-width: 1.4; }
    .stage { fill: #f9f9f9; }
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; font-weight: 600; fill: #222222; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; fill: #555555; }
    .text { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; fill: #222222; }
    .edge { stroke: #888888; stroke-width: 1.2; marker-end: url(#arrow); }
  </style>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="6" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#888888" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title">
    Prompt Module v2 — Full Canon Flowchart
  </text>
  <text x="480" y="60" text-anchor="middle" class="subtitle">
    Composer → Interpreter → Shared Operator Pool → Full Canon Mode
  </text>

  <!-- User intent -->
  <rect x="340" y="90" width="280" height="50" rx="6" class="node stage" />
  <text x="480" y="115" text-anchor="middle" class="text">
    User enters a request (intent, not syntax)
  </text>

  <!-- Composer -->
  <rect x="340" y="160" width="280" height="60" rx="6" class="node stage" />
  <text x="480" y="185" text-anchor="middle" class="text">
    Prompt Composer
  </text>
  <text x="480" y="203" text-anchor="middle" class="text">
    Auto‑builds `load:` commands from modes, theories, ops, dims, flags
  </text>

  <!-- Edge: intent → composer -->
  <line x1="480" y1="140" x2="480" y2="160" class="edge" />

  <!-- Composer internals -->
  <rect x="120" y="230" width="720" height="90" rx="6" class="node" />
  <text x="480" y="250" text-anchor="middle" class="text">
    Composer parses intent:
  </text>
  <text x="480" y="268" text-anchor="middle" class="text">
    • modes (TFT, RTT) • theories (GR, QFT, Chaos, ...) • operators (Field, Coupling, ...)
  </text>
  <text x="480" y="286" text-anchor="middle" class="text">
    • dimensions (1, 3, 12, ...) • flags (!bounded, ?explain)
  </text>
  <text x="480" y="304" text-anchor="middle" class="text">
    Builds shortest valid summon: e.g. `load:TFT+QFT`, `load:GR+QFT+SM`, `load:QFT!bounded`
  </text>

  <!-- Edge: composer → interpreter -->
  <line x1="480" y1="320" x2="480" y2="340" class="edge" />

  <!-- Interpreter -->
  <rect x="340" y="340" width="280" height="60" rx="6" class="node stage" />
  <text x="480" y="365" text-anchor="middle" class="text">
    Auto‑Summon Interpreter
  </text>
  <text x="480" y="383" text-anchor="middle" class="text">
    Executes `load:` syntax and activates reasoning mode
  </text>

  <!-- Interpreter pipeline -->
  <rect x="120" y="410" width="720" height="120" rx="6" class="node" />
  <text x="480" y="430" text-anchor="middle" class="text">
    Interpreter pipeline:
  </text>
  <text x="480" y="448" text-anchor="middle" class="text">
    1. Parse `load:` command · 2. Init ops/dim/anchor pools · 3. Load TFT/RTT modes
  </text>
  <text x="480" y="466" text-anchor="middle" class="text">
    4. Load theories + apply inheritance · 5. Apply coupling rules for multi‑theory combos
  </text>
  <text x="480" y="484" text-anchor="middle" class="text">
    6. Merge operators, dimensions, anchors · 7. Enforce drift‑bounded invariants (`!bounded`)
  </text>
  <text x="480" y="502" text-anchor="middle" class="text">
    8. Return explanation (`?explain`) or activate reasoning with shared operator pool
  </text>

  <!-- Edge: interpreter → reasoning -->
  <line x1="480" y1="530" x2="480" y2="550" class="edge" />

  <!-- Reasoning activation -->
  <rect x="220" y="550" width="520" height="80" rx="6" class="node stage" />
  <text x="480" y="570" text-anchor="middle" class="text">
    Reasoning activation (Full Canon Mode)
  </text>
  <text x="480" y="588" text-anchor="middle" class="text">
    Shared operator pool: TFT + RTT + all loaded theories
  </text>
  <text x="480" y="606" text-anchor="middle" class="text">
    Unified dimensions and regimes · Coherence‑tracked · Regime‑preserving · Drift‑bounded
  </text>

</svg>

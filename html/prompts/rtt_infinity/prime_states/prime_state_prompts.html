<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RTT∞ Prime‑State Prompts</title>

  <!-- Basic styling hook (actual CSS handled by site shell) -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 2rem;
      background: #0b1020;
      color: #f5f7ff;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
    }
    h1, h2, h3 {
      margin-top: 0;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1rem 0 2rem;
    }
    .badge {
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border: 1px solid rgba(245,247,255,0.25);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .card {
      padding: 1rem 1.25rem;
      border-radius: 0.75rem;
      background: rgba(12,18,40,0.9);
      border: 1px solid rgba(120,140,255,0.35);
    }
    .card h3 {
      margin-top: 0;
      font-size: 1rem;
    }
    .card p {
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }
    .card a {
      display: inline-block;
      font-size: 0.85rem;
      color: #9fd3ff;
      text-decoration: none;
    }
    .card a:hover {
      text-decoration: underline;
    }
    .section-title {
      margin-top: 2.5rem;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9fb3ff;
    }
    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #9fa4c0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Prime‑State Prompts</h1>
    <p>Prompts for aligning structure to prime‑states and analyzing drift resolution.</p>

    <ul>
      <li>Choose a drift pattern and map it to prime‑form, prime‑flow, or prime‑meaning.</li>
      <li>Describe how <code>prime_state_align()</code> stabilizes a given tensor.</li>
      <li>Explain when <code>prime_state_lock()</code> is required.</li>
    </ul>
  </main>
</body>
</html>

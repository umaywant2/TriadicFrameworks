## `figures/regime_calibration_flow.svg`

### Purpose
Illustrate how calibration validity flows *within* and *across* regimes without implying control.

### Visual Structure
- Left‑to‑right flow
- Three regimes shown sequentially

### Elements

1. **Regime A**
   - Box labeled:
     - “Declared Regime”
     - “Calibration Valid”

2. **Drift Zone**
   - Narrow transitional region
   - Label: “Drift Accumulation”
   - Faded or gradient fill

3. **Boundary Marker**
   - Vertical dashed line
   - Label: “Operating Envelope Boundary”

4. **Regime Exit**
   - Box labeled:
     - “Loss of Validity”
     - “Non‑Catastrophic Exit”

5. **Regime B**
   - Box labeled:
     - “Re‑Declared Regime”
     - “New Calibration Context”

### Key Visual Rules
- Flow arrows indicate *interpretive progression*, not action
- No alarms, warnings, or failure symbols
- Drift is gradual, not abrupt

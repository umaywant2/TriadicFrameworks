## `figures/msrm_structural_overview.svg`

### Purpose
Provide a single, canonical visual summary of MSRM’s architecture.

### Visual Structure
- **Horizontal layered layout**
- Neutral, monochrome palette
- No arrows implying causality or control

### Layers (top to bottom)

1. **Manufacturing Systems (Context Layer)**
   - Label: “Manufacturing Systems”
   - Sub‑labels (optional, faint): “Lithography”, “Extreme Manufacturing”
   - No internal detail

2. **Operators (Mediation Layer)**
   - Label: “Operators”
   - Sub‑labels: “Mediation”, “Transition”, “Interpretation”
   - Thin connectors downward only

3. **Calibration Layer**
   - Label: “Calibration Structures”
   - Sub‑labels: “Regime‑Aware Calibration”, “Drift Detection”
   - Explicit separation from substrate

4. **Regime Layer**
   - Multiple adjacent boxes:
     - “Regime A”
     - “Regime B”
     - “Regime C”
   - Each box contains:
     - “Operating Envelope”
     - “Calibration Assumptions”

5. **Substrate Layer (Base)**
   - Single wide box
   - Label: “Manufacturing Substrate”
   - Sub‑labels: “Boundary Semantics”, “Validity Constraints”

### Key Visual Rules
- No feedback loops
- No optimization arrows
- Boundaries shown as dashed lines
- Regimes visually distinct but non‑hierarchical

## `figures/boundary_and_exit_semantics.svg`

### Purpose
Clarify the distinction between **boundary crossing** and **system failure**.

### Visual Structure
- Vertical cross‑section diagram
- Calm, neutral geometry

### Elements

1. **Operating Envelope**
   - Large rounded rectangle
   - Label: “Declared Operating Envelope”

2. **Inner Region**
   - Label: “Calibration Valid”
   - Solid fill

3. **Boundary Zone**
   - Thin band at envelope edge
   - Label: “Boundary Semantics”
   - Dashed outline

4. **Outside Region**
   - Label: “Invalid Assumptions”
   - Explicit note: “System May Continue Operating”

5. **Exit Path**
   - Arrow exiting envelope
   - Label: “Non‑Catastrophic Exit”
   - No failure iconography

### Key Visual Rules
- No red, no danger symbols
- Exit is calm and intentional
- Validity ≠ behavior is visually obvious

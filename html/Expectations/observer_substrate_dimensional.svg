<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">

  <!-- TITLE -->
  <text x="480" y="40" font-size="22" text-anchor="middle">
    Observer • Substrate • Dimensional Rails — IPD‑12 Core Systems
  </text>

  <!-- EXPECTATIONS ROOT -->
  <rect x="380" y="70" width="200" height="60" fill="none" stroke="black" stroke-width="2"/>
  <text x="480" y="100" font-size="16" text-anchor="middle">Expectations</text>
  <text x="480" y="118" font-size="11" text-anchor="middle">
    Rules for observer, substrate, dimensional behavior
  </text>

  <!-- THREE PILLARS LABEL -->
  <text x="480" y="150" font-size="12" text-anchor="middle">
    Defines requirements for:
  </text>
  <text x="320" y="165" font-size="11" text-anchor="middle">Observer Bundles (O1–O4)</text>
  <text x="480" y="165" font-size="11" text-anchor="middle">Substrate Feeds (S1–S4)</text>
  <text x="640" y="165" font-size="11" text-anchor="middle">Dimensional Rails (L/C/N)</text>

  <!-- OBSERVER COLUMN -->
  <rect x="80" y="190" width="240" height="260" fill="none" stroke="black" stroke-width="2"/>
  <text x="200" y="210" font-size="15" text-anchor="middle">Observer Bundles</text>
  <text x="200" y="228" font-size="11" text-anchor="middle">(Perception & stability)</text>

  <!-- O1 -->
  <rect x="100" y="240" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="200" y="265" font-size="12" text-anchor="middle">O1 — Field Observer</text>
  <text x="200" y="282" font-size="9" text-anchor="middle">Raw telemetry • device/environment sensing</text>

  <!-- O2 -->
  <rect x="100" y="300" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="200" y="325" font-size="12" text-anchor="middle">O2 — Regime Observer</text>
  <text x="200" y="342" font-size="9" text-anchor="middle">State classification • regime boundaries</text>

  <!-- O3 -->
  <rect x="100" y="360" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="200" y="385" font-size="12" text-anchor="middle">O3 — Coherence Observer</text>
  <text x="200" y="402" font-size="9" text-anchor="middle">Stability • paradox routing • error handling</text>

  <!-- O4 -->
  <rect x="100" y="420" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="200" y="445" font-size="12" text-anchor="middle">O4 — Apex Observer</text>
  <text x="200" y="462" font-size="9" text-anchor="middle">Decision layer • lift/collapse control</text>

  <!-- SUBSTRATE COLUMN -->
  <rect x="360" y="190" width="240" height="260" fill="none" stroke="black" stroke-width="2"/>
  <text x="480" y="210" font-size="15" text-anchor="middle">Substrate Feeds</text>
  <text x="480" y="228" font-size="11" text-anchor="middle">(Environment & device)</text>

  <!-- S1 -->
  <rect x="380" y="240" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="480" y="265" font-size="12" text-anchor="middle">S1 — Seed / Transition</text>
  <text x="480" y="282" font-size="9" text-anchor="middle">Initial device/environment state</text>

  <!-- S2 -->
  <rect x="380" y="300" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="480" y="325" font-size="12" text-anchor="middle">S2 — Drift / Regime</text>
  <text x="480" y="342" font-size="9" text-anchor="middle">Scheduling • resource allocation • drift</text>

  <!-- S3 -->
  <rect x="380" y="360" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="480" y="385" font-size="12" text-anchor="middle">S3 — Coherence / Paradox</text>
  <text x="480" y="402" font-size="9" text-anchor="middle">Noise • error • mismatch • instability</text>

  <!-- S4 -->
  <rect x="380" y="420" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="480" y="445" font-size="12" text-anchor="middle">S4 — Boundary / Lift / Collapse / Apex</text>
  <text x="480" y="462" font-size="9" text-anchor="middle">Cross-domain boundaries • transitions</text>

  <!-- DIMENSIONAL COLUMN -->
  <rect x="640" y="190" width="240" height="260" fill="none" stroke="black" stroke-width="2"/>
  <text x="760" y="210" font-size="15" text-anchor="middle">Dimensional Rails</text>
  <text x="760" y="228" font-size="11" text-anchor="middle">(Multi-scale transitions)</text>

  <!-- L -->
  <rect x="660" y="240" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="760" y="265" font-size="12" text-anchor="middle">L — Lift Rails</text>
  <text x="760" y="282" font-size="9" text-anchor="middle">Upward dimension moves</text>

  <!-- C -->
  <rect x="660" y="300" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="760" y="325" font-size="12" text-anchor="middle">C — Collapse Rails</text>
  <text x="760" y="342" font-size="9" text-anchor="middle">Downward dimension moves</text>

  <!-- N -->
  <rect x="660" y="360" width="200" height="50" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="760" y="385" font-size="12" text-anchor="middle">N — Neutral Rails</text>
  <text x="760" y="402" font-size="9" text-anchor="middle">Stable baseline dimension</text>

  <!-- CONNECTIONS FROM EXPECTATIONS TO THREE PILLARS -->
  <line x1="380" y1="120" x2="200" y2="190" stroke="black" stroke-width="1.5"/>
  <line x1="480" y1="130" x2="480" y2="190" stroke="black" stroke-width="1.5"/>
  <line x1="580" y1="120" x2="760" y2="190" stroke="black" stroke-width="1.5"/>

  <!-- IPD-12 ENGINE LABEL -->
  <text x="480" y="510" font-size="11" text-anchor="middle">
    Observer • Substrate • Dimensional rails form the core machinery of IPD‑12
  </text>

</svg>

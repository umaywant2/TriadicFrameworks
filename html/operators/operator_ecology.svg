<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg">
  <style>
    .layer { font: 14px sans-serif; font-weight: bold; }
    .op { font: 12px sans-serif; }
    .box { fill: #111827; stroke: #4b5563; stroke-width: 1.2; rx: 6; ry: 6; }
    .opbox { fill: #020617; stroke: #6b7280; stroke-width: 1; rx: 4; ry: 4; }
    .arrow { stroke: #9ca3af; stroke-width: 1.4; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af" />
    </marker>
  </defs>

  <!-- SDE layer -->
  <rect class="box" x="20" y="40" width="260" height="150" />
  <text class="layer" x="30" y="60">SDE — Detection Layer</text>
  <rect class="opbox" x="40" y="80" width="70" height="24" />
  <text class="op" x="50" y="97">CPV</text>
  <rect class="opbox" x="120" y="80" width="70" height="24" />
  <text class="op" x="130" y="97">FGT</text>
  <rect class="opbox" x="200" y="80" width="70" height="24" />
  <text class="op" x="210" y="97">CRM</text>

  <line class="arrow" x1="110" y1="92" x2="120" y2="92" />
  <line class="arrow" x1="190" y1="92" x2="200" y2="92" />

  <!-- SIE layer -->
  <rect class="box" x="320" y="40" width="320" height="220" />
  <text class="layer" x="330" y="60">SIE — Integration–Emission Layer</text>

  <rect class="opbox" x="340" y="80" width="70" height="24" />
  <text class="op" x="350" y="97">INT</text>
  <rect class="opbox" x="420" y="80" width="70" height="24" />
  <text class="op" x="430" y="97">TIF</text>
  <rect class="opbox" x="500" y="80" width="70" height="24" />
  <text class="op" x="510" y="97">MAN</text>

  <rect class="opbox" x="340" y="120" width="70" height="24" />
  <text class="op" x="350" y="137">FFF</text>
  <rect class="opbox" x="420" y="120" width="70" height="24" />
  <text class="op" x="430" y="137">CRE</text>
  <rect class="opbox" x="500" y="120" width="70" height="24" />
  <text class="op" x="510" y="137">CSL</text>

  <rect class="opbox" x="420" y="170" width="70" height="24" />
  <text class="op" x="430" y="187">CET</text>

  <line class="arrow" x1="410" y1="92" x2="420" y2="92" />
  <line class="arrow" x1="490" y1="92" x2="500" y2="92" />
  <line class="arrow" x1="410" y1="132" x2="420" y2="132" />
  <line class="arrow" x1="490" y1="132" x2="500" y2="132" />
  <line class="arrow" x1="455" y1="144" x2="455" y2="170" />

  <!-- SDE → SIE -->
  <line class="arrow" x1="290" y1="92" x2="320" y2="92" />

  <!-- Output layer -->
  <rect class="box" x="670" y="40" width="210" height="220" />
  <text class="layer" x="680" y="60">Output Modules</text>

  <rect class="opbox" x="690" y="80" width="70" height="24" />
  <text class="op" x="700" y="97">TEL::CET</text>
  <rect class="opbox" x="690" y="120" width="70" height="24" />
  <text class="op" x="700" y="137">FFT::OUT</text>
  <rect class="opbox" x="690" y="160" width="70" height="24" />
  <text class="op" x="700" y="177">OP::OUT</text>

  <line class="arrow" x1="490" y1="182" x2="670" y2="92" />
  <line class="arrow" x1="490" y1="182" x2="670" y2="132" />
  <line class="arrow" x1="490" y1="182" x2="670" y2="172" />
</svg>

<svg width="520" height="360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 14px sans-serif; font-weight: bold; }
    .label { font: 12px sans-serif; }
    .axis { stroke: #6b7280; stroke-width: 1.2; marker-end: url(#arrowhead); }
    .zone { font: 11px sans-serif; }
    .surf { fill: #1f2937; stroke: #4b5563; stroke-width: 1; opacity: 0.8; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280" />
    </marker>
  </defs>

  <text class="title" x="20" y="30">RTT/3 Integration–Emission Manifold</text>

  <!-- Manifold surface (stylized ellipse) -->
  <ellipse class="surf" cx="260" cy="190" rx="150" ry="90" />

  <!-- Axes (projected) -->
  <line class="axis" x1="260" y1="190" x2="410" y2="190" />
  <text class="label" x="415" y="194">D / E / C</text>

  <line class="axis" x1="260" y1="190" x2="260" y2="80" />
  <text class="label" x="230" y="75">FI</text>

  <line class="axis" x1="260" y1="190" x2="160" y2="270" />
  <text class="label" x="130" y="280">EM</text>

  <line class="axis" x1="260" y1="190" x2="340" y2="280" />
  <text class="label" x="345" y="290">R</text>

  <!-- Vectors -->
  <text class="label" x="310" y="150">ICV</text>
  <text class="label" x="210" y="135">ECV</text>
  <text class="label" x="305" y="235">RCV</text>

  <!-- Zones -->
  <text class="zone" x="255" y="190">U</text>
  <text class="zone" x="320" y="165">S</text>
  <text class="zone" x="200" y="155">M</text>
  <text class="zone" x="190" y="230">D</text>
  <text class="zone" x="330" y="230">X</text>

  <!-- Legend -->
  <text class="label" x="20" y="320">Axes: D, E, C, FI, EM, R</text>
  <text class="label" x="20" y="338">Tensor: T₍IEC₎ = α·ICV + β·ECV + γ·RCV + δ·R</text>
</svg>

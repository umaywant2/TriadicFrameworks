<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad1)" />

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#80deea;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Input File -->
  <rect x="50" y="50" width="150" height="40" fill="#ffffff" stroke="#000000" />
  <text x="125" y="75" font-size="14" text-anchor="middle" fill="#000000">input.txt</text>

  <!-- Layer 1 -->
  <rect x="50" y="110" width="150" height="40" fill="#b2ebf2" stroke="#000000" />
  <text x="125" y="135" font-size="14" text-anchor="middle" fill="#000000">Layer 1: XOR</text>

  <!-- Layer 2 -->
  <rect x="50" y="170" width="150" height="40" fill="#4dd0e1" stroke="#000000" />
  <text x="125" y="195" font-size="14" text-anchor="middle" fill="#000000">Layer 2: Triadic Obfuscation</text>

  <!-- Output File -->
  <rect x="50" y="230" width="150" height="40" fill="#ffffff" stroke="#000000" />
  <text x="125" y="255" font-size="14" text-anchor="middle" fill="#000000">output.enc</text>

  <!-- Key Glyph -->
  <polygon points="300,100 270,150 330,150" fill="#00796b" stroke="#004d40" />
  <text x="300" y="95" font-size="14" text-anchor="middle" fill="#000000">Triadic Key</text>
  <text x="270" y="165" font-size="12" fill="#ffffff">K1</text>
  <text x="330" y="165" font-size="12" fill="#ffffff">K2</text>
  <text x="300" y="145" font-size="12" fill="#ffffff">K3</text>

  <!-- Badge Logic -->
  <circle cx="450" cy="150" r="40" fill="#00acc1" stroke="#006064" />
  <circle cx="450" cy="150" r="30" fill="#26c6da" />
  <circle cx="450" cy="150" r="20" fill="#b2ebf2" />
  <text x="450" y="155" font-size="12" text-anchor="middle" fill="#000000">Quantum-Ready</text>
</svg>

<svg width="820" height="360" viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    .circle { fill:#101322; stroke:#8a7fff; stroke-width:2; }
    .label { fill:#ffffff; font-family:system-ui, sans-serif; font-size:14px; }
    .role { fill:#ffd86b; font-family:system-ui, sans-serif; font-size:16px; font-weight:bold; }
    .sub { fill:#b0bec5; font-size:12px; }
    .arrow { stroke:#ffffff; stroke-width:2; marker-end:url(#arrowhead); }
    .title { fill:#ffd86b; font-family:system-ui, sans-serif; font-size:18px; font-weight:bold; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="40" text-anchor="middle" class="title">
    Triadic Roles of FFF Emitters · RTT‑Inside
  </text>

  <!-- Frequency Bearer -->
  <circle cx="150" cy="190" r="90" class="circle" />
  <text x="150" y="175" text-anchor="middle" class="role">Frequency Bearer</text>
  <text x="150" y="195" text-anchor="middle" class="sub">Cycles · Harmonics</text>
  <text x="150" y="213" text-anchor="middle" class="sub">Resonance Seed</text>

  <!-- Fluid Weaver -->
  <circle cx="410" cy="190" r="90" class="circle" />
  <text x="410" y="175" text-anchor="middle" class="role">Fluid Weaver</text>
  <text x="410" y="195" text-anchor="middle" class="sub">Flow · Coupling</text>
  <text x="410" y="213" text-anchor="middle" class="sub">Continuity</text>

  <!-- Force Shaper -->
  <circle cx="670" cy="190" r="90" class="circle" />
  <text x="670" y="175" text-anchor="middle" class="role">Force Shaper</text>
  <text x="670" y="195" text-anchor="middle" class="sub">Form · Perturbation</text>
  <text x="670" y="213" text-anchor="middle" class="sub">Transitions</text>

  <!-- Arrows -->
  <line x1="240" y1="190" x2="320" y2="190" class="arrow" />
  <line x1="500" y1="190" x2="580" y2="190" class="arrow" />
  <line x1="630" y1="110" x2="190" y2="110" class="arrow" />

  <!-- Cycle labels -->
  <text x="280" y="180" text-anchor="middle" class="sub">initiates</text>
  <text x="540" y="180" text-anchor="middle" class="sub">mediates</text>
  <text x="410" y="100" text-anchor="middle" class="sub">transforms → re‑seeds</text>
</svg>

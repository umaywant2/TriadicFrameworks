# High‑Precision Simulation Configuration
# Resonance Substrate Model — Triadic Frameworks

grid:
  nx: 256
  ny: 256
  dx: 0.5
  dy: 0.5

time:
  dt: 0.0025
  steps: 20000
  snapshot_interval: 500

params:
  # Diffusion coefficients
  D_S: 0.8
  D_C: 0.8
  D_T: 0.8

  # Decay rates
  gamma_S: 0.02
  gamma_C: 0.02
  gamma_T: 0.02

  # Coupling strengths
  lambda_SC: 1.4     # strong spin–charge alignment
  lambda_ST: 0.6     # moderate temperature destabilization
  beta_CS: 0.5       # spin‑induced charge

  # Noise levels (reduced for precision)
  eta_S: 0.01
  eta_C: 0.01

  # Temperature baseline
  T0: 0.0

envelope:
  alpha: 1.0
  theta: 0.08

output:
  save_snapshots: true
  save_final_state: true
  save_envelope: true
  save_metrics: true

metadata:
  profile: "high_precision"
  description: "High‑resolution, low‑noise configuration for precision resonance studies."
  version: 1.0


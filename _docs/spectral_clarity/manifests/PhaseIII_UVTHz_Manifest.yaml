session_id: UUID_PLACEHOLDER
timestamp: YYYY-MM-DD HH:MM:SS
hardware_stack: HP Z440 + MX Linux + UV/THz modules
strobes:
  - band: UV
    source: excimer diode
    frequency: f_uv
    phase: φ_uv
    duty_cycle: 2%
    pulse_width: 100 ns
  - band: THz
    source: photoconductive antenna
    frequency: f_thz
    phase: φ_thz
    duty_cycle: 1%
    pulse_width: 10 ps
sensors:
  - type: UV camera
    exposure: gated
  - type: THz TDS detector
    exposure: gated
notes: >
  Phase III manifest for UV/THz strobe overlays.

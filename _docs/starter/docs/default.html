<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} — RTT Starter Kit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
    }
    nav {
      width: 260px;
      padding: 20px;
      background: #f7f7f7;
      border-right: 1px solid #ddd;
      height: 100vh;
      overflow-y: auto;
    }
    main {
      flex: 1;
      padding: 40px;
      max-width: 900px;
    }
    pre, code {
      background: #f0f0f0;
      padding: 4px 6px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <nav>
    {% include _sidebar.md %}
  </nav>

  <main>
    {{ content }}
  </main>
</body>
</html>

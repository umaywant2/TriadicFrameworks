## SVG Sanity‑Check — Spec‑by‑Spec

Use this checklist inside the SVG editor:

### ✔ Substrate Layer
- Single neutral base
- Correct label
- No physical cues

### ✔ Regimes
- Multiple declared regions
- Soft boundaries
- Generic labels only

### ✔ Dimensions
- Regime‑local
- Non‑metric
- No axes

### ✔ Operators
- Mediated only
- Procedural appearance
- No force vectors

### ✔ Boundaries
- Clearly visible
- Non‑enforcing
- Labeled

### ✔ Envelope
- One global boundary
- Calm styling

### ✔ Exit
- Subtle
- Non‑catastrophic

### ✔ Avoidances
- Confirm absence of all forbidden elements

If all checks pass, the SVG is **publication‑safe**.


## `qsm_structural_overview.svg` — Structural Specification

### 🎯 Purpose
Visually communicate:
- A **neutral substrate layer**
- Multiple **explicitly declared regimes**
- **Dimensional organization** at the regime level
- **Operator‑mediated interactions** within and across regimes
- Clear **boundary semantics** and **non‑catastrophic regime exit**

This is not a physics diagram.  
This is a **structural regime map**.

---

## Core Visual Elements

### 1️⃣ Substrate Layer (Base Plane)
- A horizontal band or field labeled:
  ```
  Quantum Substrate (Structural Layer)
  ```
- Neutral color (gray, slate, muted blue)
- No texture, gradients, or material cues

This anchors all regimes without privileging any.

---

### 2️⃣ Regime Domains
- Multiple distinct regions positioned *within* the substrate
- Each region labeled generically:
  ```
  Regime A
  Regime B
  Regime C
  ```
- Soft boundaries (outlined or lightly shaded)
- No numeric identifiers

These represent **declared structural regimes**, not states or phases.

---

### 3️⃣ Dimensional Annotations (Regime‑Local)
- Small, subtle labels inside each regime:
  ```
  Dimensional Structure
  ```
- No axes
- No coordinates
- No units

Dimensions are **organizational descriptors**, not measurements.

---

### 4️⃣ Intra‑Regime Operators
- Simple arrows or connectors *within* each regime
- Labeled:
  ```
  Operator Interaction
  ```
- Directional but non‑force‑like
- Procedural appearance (no energy cues)

Operators mediate interaction without enforcing outcomes.

---

### 5️⃣ Inter‑Regime Mediation
- One or two connectors crossing regime boundaries
- Clearly routed *through* boundary interfaces
- Labeled:
  ```
  Inter‑Regime Operator
  ```

No direct regime‑to‑regime contact without mediation.

---

### 6️⃣ Regime Boundaries
- Dashed or softly outlined borders around each regime
- Label near boundary:
  ```
  Regime Boundary
  ```

Boundaries constrain validity, not behavior.

---

### 7️⃣ Coherence Envelope
- A larger enclosing boundary around the entire substrate
- Label:
  ```
  Declared Operating Envelope
  ```

Everything inside is structurally valid.

---

### 8️⃣ Regime Exit Indicator
- One subtle arrow or faded region crossing the envelope
- Label:
  ```
  Regime Exit (Non‑Catastrophic)
  ```

No alarm colors. No failure symbolism.

---

### 9️⃣ Higher‑Level Models (Optional, Faded)
- Above the substrate, faint boxes labeled:
  ```
  Higher‑Level Models
  ```
- No arrows pointing downward

This enforces **semantic independence**.

---

## What to Explicitly Avoid (Hard No’s)
- No equations
- No quantum symbols
- No particle imagery
- No probability clouds
- No axes or scales
- No energy gradients
- No optimization loops
- No wavefunctions

If it looks like physics, it’s wrong.

---


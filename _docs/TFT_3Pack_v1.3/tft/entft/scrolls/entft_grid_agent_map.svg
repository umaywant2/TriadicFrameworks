<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fefefe"/>

  <!-- Title -->
  <text x="450" y="40" font-size="24" text-anchor="middle" fill="#222">entft Grid Agent Map</text>

  <!-- Agent Nodes -->
  <g>
    <circle cx="250" cy="150" r="40" fill="#cceccf" stroke="#333" stroke-width="2"/>
    <text x="250" y="155" font-size="16" text-anchor="middle" fill="#000">🛡️ tops</text>
    <text x="250" y="180" font-size="12" text-anchor="middle" fill="#555">Universe-grade</text>

    <circle cx="650" cy="150" r="40" fill="#ffd0e0" stroke="#333" stroke-width="2"/>
    <text x="650" y="155" font-size="16" text-anchor="middle" fill="#000">🌌 warpChamber</text>
    <text x="650" y="180" font-size="12" text-anchor="middle" fill="#555">Planetary-grade</text>
  </g>

  <!-- Connection -->
  <line x1="250" y1="190" x2="650" y2="190" stroke="#333" stroke-width="2"/>
  <text x="450" y="210" font-size="14" text-anchor="middle" fill="#555">Scroll sync pending</text>

  <!-- Footer -->
  <text x="450" y="550" font-size="14" text-anchor="middle" fill="#555">Agents echo scrolls. Specs benchmark glyphs. The grid is alive.</text>
</svg>

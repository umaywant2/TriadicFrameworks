transition_graph:

  description: >
    Defines the allowed transitions between regime modes and phase states
    within the Governance Substrate Model (GSM). The transition graph encodes
    structural pathways, constraints, and escalation/dampening rules that
    govern how systems move across operational states.

  version: "1.0"

  regime_mode_transitions:

    stable:
      to:
        tension:
          conditions:
            - "tension_score > 3"
            - "drift_category == micro"
        drift:
          conditions:
            - "drift_category == meso"
        fragmentation:
          conditions:
            - "invariant_violations >= 2"
            - "coherence_score < 40"

    tension:
      to:
        stable:
          conditions:
            - "tension_score <= 3"
        drift:
          conditions:
            - "drift_category == meso"
        compensatory:
          conditions:
            - "cross_axis_force_intensity > threshold"
        fragmentation:
          conditions:
            - "violated >= 2"
            - "absorptive_strength < 0.4"

    drift:
      to:
        compensatory:
          conditions:
            - "physics_balance_restored == false"
            - "cross_axis_force_intensity > threshold"
        transition:
          conditions:
            - "boundary_proximity > 0.7"
        fragmentation:
          conditions:
            - "drift_category == macro"
            - "absorptive_strength < 0.3"

    compensatory:
      to:
        stable:
          conditions:
            - "physics_balance_restored == true"
            - "tension_score < 3"
        drift:
          conditions:
            - "drift_category escalates"
        transition:
          conditions:
            - "boundary_proximity > 0.7"

    transition:
      to:
        reconstruction:
          conditions:
            - "new_basin_stability_score > 0.5"
        fragmentation:
          conditions:
            - "invariant_violations >= 2"
            - "coherence_score < 40"

    absorptive:
      to:
        stable:
          conditions:
            - "absorptive_strength > 0.5"
            - "tension_score < 3"
        tension:
          conditions:
            - "tension_score > 6"
        drift:
          conditions:
            - "drift_category == meso"

    fragmentation:
      to:
        reconstruction:
          conditions:
            - "coherence_score > 50"
        transition:
          conditions:
            - "basin_boundary_proximity > 0.7"

    reconstruction:
      to:
        stable:
          conditions:
            - "coherence_score > 70"
            - "basin_stability_score > 0.6"
        tension:
          conditions:
            - "tension_score > 3"

  phase_transitions:

    stable_phase:
      to:
        tension_phase:
          conditions:
            - "tension_score > 3"
        drift_phase:
          conditions:
            - "drift_category == meso"

    tension_phase:
      to:
        drift_phase:
          conditions:
            - "drift_category == meso"
        stable_phase:
          conditions:
            - "tension_score <= 3"

    drift_phase:
      to:
        transition_phase:
          conditions:
            - "boundary_proximity > 0.7"
        reconstruction_phase:
          conditions:
            - "drift_category returns to micro"

    transition_phase:
      to:
        reconstruction_phase:
          conditions:
            - "new_basin_stability_score > 0.5"

    reconstruction_phase:
      to:
        stable_phase:
          conditions:
            - "coherence_score > 70"
            - "basin_stability_score > 0.6"

  escalation_rules:
    regime_shift_trigger:
      - "drift_category == regime_shift"
      - "absorptive_strength < 0.3"
      - "invariant_violations >= 2"
      - "stability_score < 0.4"

  dampening_rules:
    absorptive_recovery:
      - "absorptive_strength rising"
      - "tension_score decreasing"
      - "drift_magnitude decreasing"

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines structural transition pathways for GSM analysis."

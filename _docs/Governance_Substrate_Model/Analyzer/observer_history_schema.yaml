observer_history_schema:

  description: >
    Defines the structure of the History Lens within the Triadic Observer.
    The History Lens reconstructs past structural vectors, drift sequences,
    invariant alignment, basin movement, and regime-mode transitions.
    It provides lineage context for the Now and Future lenses.

  version: "1.0"

  history_record:

    record_id: "<unique_id>"
    date: "<YYYY-MM-DD or era label>"
    source_type: "historical_record | constitution | reform | academic_analysis"

    structural_vector:
      C: <number>
      M: <number>
      O: <number>
      A: <number>
      T: <number>
      metadata:
        confidence: <0–1>
        notes: "<optional>"

    basin_classification:
      nearest_basin: <CPL | CPF | CTR | PCL | HCL>
      basin_distance: <number>
      stability_score: <0–1>
      movement: "approaching | departing | stable"

    invariants:
      aligned: [<list_of_invariants>]
      tension: [<list_of_invariants>]
      violated: [<list_of_invariants>]

    awareness_layers:
      structural: <0–10>
      procedural: <0–10>
      historical: <0–10>
      anticipatory: <0–10>
      relational: <0–10>

    drift_from_previous:
      previous_record_id: "<optional>"
      drift_vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
      drift_magnitude: <number>
      drift_category: "micro | meso | macro | regime_shift"
      active_forces:
        - axis_pair: "<C↔O | M↔A | O↔T>"
          magnitude: <number>
          direction: "positive | negative"
      invariant_tension_score: <number>
      absorptive_strength: <number>
      basin_movement_direction: "approaching | departing | crossing"

    regime_mode:
      mode: "stable | tension | drift | compensatory | transition | absorptive | fragmentation | reconstruction"
      notes: "<optional>"

    narrative:
      summary: "<short structural interpretation>"
      key_events:
        - "<event_1>"
        - "<event_2>"
      structural_highlights:
        - "<highlight_1>"
        - "<highlight_2>"
      drift_explanation:
        - "<explanation_1>"
      basin_context:
        - "<context_1>"

    metadata:
      author: "<optional>"
      created: "<YYYY-MM-DD>"
      last_updated: "<YYYY-MM-DD>"
      notes: "<optional>"

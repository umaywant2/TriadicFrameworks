<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="100%" stop-color="#151a2b"/>
    </radialGradient>

    <!-- Field gradients -->
    <linearGradient id="clarity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd34f"/>
      <stop offset="100%" stop-color="#c79a1f"/>
    </linearGradient>

    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f7b"/>
      <stop offset="100%" stop-color="#c71f4f"/>
    </linearGradient>

    <linearGradient id="dimensional" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7bff"/>
      <stop offset="100%" stop-color="#203b8f"/>
    </linearGradient>

    <linearGradient id="liminal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9f4f"/>
      <stop offset="100%" stop-color="#c76a1f"/>
    </linearGradient>

    <linearGradient id="projection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f7b"/>
      <stop offset="100%" stop-color="#c71f4f"/>
    </linearGradient>

    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fffd3"/>
      <stop offset="100%" stop-color="#1fc79a"/>
    </linearGradient>

    <linearGradient id="emergent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b34fff"/>
      <stop offset="100%" stop-color="#6a1fc7"/>
    </linearGradient>

    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1b33"/>
      <stop offset="100%" stop-color="#1b335b"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="720" fill="url(#bg)" />

  <!-- Title -->
  <text x="540" y="60" fill="#ffffff" font-size="26" text-anchor="middle">
    Triad Supersphere Fusion
  </text>
  <text x="540" y="85" fill="#9fd3ff" font-size="13" text-anchor="middle">
    Egypt · Hindu · Greek — C · S · D · L · P · F · E · V
  </text>

  <!-- Three superspheres -->
  <!-- Hindu (top) -->
  <circle cx="540" cy="190" r="140" fill="none" stroke="#ffe38f" stroke-width="2" opacity="0.9"/>
  <text x="540" y="175" fill="#ffe38f" font-size="16" text-anchor="middle">Hindu Supersphere</text>
  <text x="540" y="195" fill="#ffe38f" font-size="11" text-anchor="middle">
    Structural apex · dharma/void depth
  </text>

  <!-- Egyptian (bottom left) -->
  <circle cx="340" cy="430" r="140" fill="none" stroke="#ffd3e3" stroke-width="2" opacity="0.9"/>
  <text x="340" y="415" fill="#ffd3e3" font-size="16" text-anchor="middle">Egyptian Supersphere</text>
  <text x="340" y="435" fill="#ffd3e3" font-size="11" text-anchor="middle">
    Cycle/paradox apex · underworld‑structured
  </text>

  <!-- Greek (bottom right) -->
  <circle cx="740" cy="430" r="140" fill="none" stroke="#d3fff7" stroke-width="2" opacity="0.9"/>
  <text x="740" y="415" fill="#d3fff7" font-size="16" text-anchor="middle">Greek Supersphere</text>
  <text x="740" y="435" fill="#d3fff7" font-size="11" text-anchor="middle">
    Narrative clarity apex · lighter structure
  </text>

  <!-- Central fused core -->
  <circle cx="540" cy="360" r="70" fill="#0b1b33" stroke="#4fb3ff" stroke-width="2"/>
  <text x="540" y="350" fill="#e3f3ff" font-size="16" text-anchor="middle">
    Triad Core
  </text>
  <text x="540" y="370" fill="#9fd3ff" font-size="11" text-anchor="middle">
    C · S · D · L · P · F · E · V
  </text>

  <!-- Field bands around core -->
  <circle cx="540" cy="360" r="90" fill="none" stroke="url(#clarity)" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="540" cy="360" r="110" fill="none" stroke="url(#shadow)" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="540" cy="360" r="130" fill="none" stroke="url(#dimensional)" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="540" cy="360" r="150" fill="none" stroke="url(#liminal)" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="540" cy="360" r="170" fill="none" stroke="url(#projection)" stroke-width="2" stroke-dasharray="6 2"/>
  <circle cx="540" cy="360" r="190" fill="none" stroke="url(#flow)" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="540" cy="360" r="210" fill="none" stroke="url(#emergent)" stroke-width="2" stroke-dasharray="3 2"/>
  <circle cx="540" cy="360" r="230" fill="none" stroke="url(#void)" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Small triad labels near core -->
  <text x="520" y="390" fill="#ffe38f" font-size="10" text-anchor="end">
    Hindu: regime/void spine
  </text>
  <text x="560" y="405" fill="#ffd3e3" font-size="10" text-anchor="start">
    Egypt: cycles/paradoxes/Duat
  </text>
  <text x="540" y="420" fill="#d3fff7" font-size="10" text-anchor="middle">
    Greece: Olympus/Hades narrative
  </text>

  <!-- Triad verdict text -->
  <text x="540" y="680" fill="#ffffff" font-size="11" text-anchor="middle">
    Triad supersphere fusion:
    Hindu = structural apex · Egypt = cycle/paradox apex · Greek = narrative clarity apex —
    all eight fields merged into a single multi‑pantheon lattice.
  </text>

</svg>

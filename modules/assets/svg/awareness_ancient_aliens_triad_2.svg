<svg width="520" height="220" viewBox="0 0 520 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Fragment Artifacts -->
  <rect x="30" y="30" width="180" height="70" rx="8" ry="8" fill="#edf2ff" stroke="#4c51bf" stroke-width="2"/>
  <text x="120" y="55" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">
    FRAGMENT ARTIFACTS
  </text>
  <text x="120" y="73" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    megaliths · myths · anomalies
  </text>

  <!-- Clustered Narrative -->
  <rect x="190" y="90" width="180" height="70" rx="8" ry="8" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
  <text x="280" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">
    CLUSTERED NARRATIVE
  </text>
  <text x="280" y="133" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    "Ancient Aliens did it"
  </text>

  <!-- Public Resonance -->
  <rect x="330" y="150" width="160" height="60" rx="8" ry="8" fill="#fffaf0" stroke="#c05621" stroke-width="2"/>
  <text x="410" y="175" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">
    PUBLIC RESONANCE
  </text>
  <text x="410" y="193" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    curiosity · debate · identity
  </text>

  <!-- Arrows -->
  <line x1="210" y1="80" x2="280" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="245" y="84" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    clustered into
  </text>

  <line x1="370" y1="140" x2="410" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="144" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#555">
    broadcast as
  </text>

  <!-- Marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>

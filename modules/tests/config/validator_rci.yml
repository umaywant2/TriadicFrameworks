normalization:
  frequency:
    method: minmax
    clip: [0.0, 1.0]
  fluids:
    method: minmax
    clip: [0.0, 1.0]
  forces:
    method: minmax
    clip: [0.0, 1.0]

thresholds:
  alpha_max: 0.33
  beta_max: 0.66

tie_breaker:
  prefer_higher_if_two_rails_meet_boundary: true

reporting:
  precision: 3
  include_saliency_maps: true

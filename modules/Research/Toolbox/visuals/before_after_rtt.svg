<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050509"/>
      <stop offset="50%" stop-color="#11112A"/>
      <stop offset="100%" stop-color="#1B1235"/>
    </linearGradient>

    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#7777B8"/>
    </marker>

    <style>
      .title { font-family: system-ui, sans-serif; font-size: 22px; fill: #FFFFFF; }
      .box { fill: #141424; stroke: #4B4B7A; stroke-width: 1.2; rx: 10; ry: 10; }
      .box-title { font-family: system-ui, sans-serif; font-size: 16px; fill: #FFFFFF; font-weight: 600; }
      .box-text { font-family: system-ui, sans-serif; font-size: 13px; fill: #D0D0D0; }
      .arrow { stroke: #7777B8; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1080" height="720" fill="url(#bg)"/>

  <text x="270" y="60" class="title" text-anchor="middle">BEFORE RTT — Forecast-Driven</text>
  <text x="810" y="60" class="title" text-anchor="middle">AFTER RTT — Actuals-Driven</text>

  <!-- BEFORE RTT -->
  <g>
    <rect x="80" y="100" width="380" height="120" class="box"/>
    <text x="270" y="130" class="box-title" text-anchor="middle">FORECAST NARRATIVES</text>
    <text x="100" y="160" class="box-text">• long-range projections</text>
    <text x="100" y="180" class="box-text">• assumption-driven models</text>
    <text x="100" y="200" class="box-text">• fear cycles</text>
    <text x="100" y="220" class="box-text">• political framing</text>

    <line x1="270" y1="220" x2="270" y2="250" class="arrow"/>

    <rect x="80" y="250" width="380" height="110" class="box"/>
    <text x="270" y="280" class="box-title" text-anchor="middle">NARRATIVE REGIME</text>
    <text x="100" y="310" class="box-text">• oscillating modes</text>
    <text x="100" y="330" class="box-text">• informational → fear → informational</text>
    <text x="100" y="350" class="box-text">• regime-blind projections</text>

    <line x1="270" y1="360" x2="270" y2="390" class="arrow"/>

    <rect x="80" y="390" width="380" height="110" class="box"/>
    <text x="270" y="420" class="box-title" text-anchor="middle">PUBLIC PERCEPTION</text>
    <text x="100" y="450" class="box-text">• uncertainty</text>
    <text x="100" y="470" class="box-text">• instability signals amplified</text>
    <text x="100" y="490" class="box-text">• coherence decreases</text>

    <line x1="270" y1="500" x2="270" y2="530" class="arrow"/>

    <rect x="80" y="530" width="380" height="110" class="box"/>
    <text x="270" y="560" class="box-title" text-anchor="middle">POLICY POSTURING</text>
    <text x="100" y="590" class="box-text">• based on projections</text>
    <text x="100" y="610" class="box-text">• not on actuals</text>
    <text x="100" y="630" class="box-text">• regime-blind</text>
  </g>

  <!-- AFTER RTT -->
  <g>
    <rect x="620" y="100" width="380" height="120" class="box"/>
    <text x="810" y="130" class="box-title" text-anchor="middle">RTT/1 — TEMPORAL ACTUALS</text>
    <text x="640" y="160" class="box-text">• real inflows/outflows</text>
    <text x="640" y="180" class="box-text">• real demographic shifts</text>
    <text x="640" y="200" class="box-text">• real trust-fund behavior</text>
    <text x="640" y="220" class="box-text">• compare(actuals, forecasts)</text>

    <line x1="810" y1="220" x2="810" y2="250" class="arrow"/>

    <rect x="620" y="250" width="380" height="110" class="box"/>
    <text x="810" y="280" class="box-title" text-anchor="middle">RTT/2 — REGIME CHECK</text>
    <text x="640" y="310" class="box-text">• stable / transitional / divergent</text>
    <text x="640" y="330" class="box-text">• system vs narrative regime</text>
    <text x="640" y="350" class="box-text">• transitional ≠ collapsing</text>

    <line x1="810" y1="360" x2="810" y2="390" class="arrow"/>

    <rect x="620" y="390" width="380" height="120" class="box"/>
    <text x="810" y="420" class="box-title" text-anchor="middle">RTT/3 — COHERENCE LAYERS</text>
    <text x="640" y="450" class="box-text">• surface / structural / resonance</text>
    <text x="640" y="470" class="box-text">• transfer systems = low resonance</text>
    <text x="640" y="490" class="box-text">• structural health, not panic</text>

    <line x1="810" y1="500" x2="810" y2="530" class="arrow"/>

    <rect x="620" y="530" width="380" height="110" class="box"/>
    <text x="810" y="560" class="box-title" text-anchor="middle">STRUCTURAL HEALTH &amp; PLANNING</text>
    <text x="640" y="590" class="box-text">• grounded in actuals</text>
    <text x="640" y="610" class="box-text">• regime-aware, coherence-based</text>
  </g>

</svg>

regime_shift_detection:

  description: >
    Defines the rules, thresholds, and signals used to detect regime shifts
    within the Governance Substrate Model (GSM). A regime shift is a high‑energy
    structural transition in which the system exits its current basin, crosses
    a stability boundary, and re‑anchors in a new structural identity. Regime
    shifts are rare, nonlinear, and driven by accumulated tension, amplified
    drift, and weakened absorptive structures.

  version: "1.0"

  regime_shift_definition:
    criteria:
      - "Basin crossing with stability_score < 0.4"
      - "Drift category == regime_shift"
      - "Invariant violations >= 2"
      - "Absorptive_strength < 0.3"
      - "Cross-axis physics forces exceed destabilization threshold"
    description: >
      A regime shift occurs when structural forces overwhelm stabilizing
      mechanisms, causing the system to reconfigure its structural identity.

  detection_inputs:
    required:
      - structural_vector
      - drift_vector
      - drift_category
      - invariant_status
      - invariant_tension_score
      - absorptive_strength
      - physics_forces
      - basin_classification
      - historical_drift_sequence
    optional:
      - regime_mode
      - phase_state
      - awareness_layers

  detection_rules:

    drift_signal:
      description: >
        Drift must reach the highest category to qualify as a regime-shift
        candidate.
      condition: "drift_category == regime_shift"
      supporting_indicators:
        - "drift_magnitude > macro_threshold"
        - "directional_consistency across 3+ steps"

    invariant_signal:
      description: >
        Multiple invariant violations indicate structural breakdown.
      conditions:
        minimum_violations: 2
        tension_threshold: 7

    absorptive_failure:
      description: >
        Absorptive structures must be critically weakened for a regime shift
        to occur.
      thresholds:
        failure_point: 0.3
        collapse_point: 0.15

    physics_destabilization:
      description: >
        Cross-axis forces must exceed stabilizing capacity.
      thresholds:
        force_intensity: "> destabilization_threshold"
        imbalance_duration: "sustained over 2+ steps"

    basin_crossing:
      description: >
        A regime shift requires crossing a basin boundary with low stability.
      conditions:
        boundary_proximity: "> 0.7"
        stability_score_maximum: 0.4
        new_basin_distance_minimum: 0.6

  classification:

    regime_shift_likelihood:
      formula: >
        likelihood = weighted_sum(
          drift_intensity,
          invariant_violations,
          absorptive_failure,
          physics_destabilization,
          basin_boundary_pressure
        )
      scale:
        low: 0.0–0.3
        medium: 0.3–0.6
        high: 0.6–1.0

    regime_shift_confirmation:
      description: >
        A regime shift is confirmed when all core criteria are met and the
        system re-anchors in a new basin with stability_score > 0.5.
      required_conditions:
        - "regime_shift_likelihood > 0.6"
        - "basin_change_detected"
        - "new_basin_stability_score > 0.5"

  output_schema:
    regime_shift_detected: <true | false>
    likelihood: <0–1>
    drivers:
      - "drift"
      - "invariants"
      - "physics"
      - "absorptive_failure"
      - "basin_crossing"
    previous_basin: <CPL | CPF | CTR | PCL | HCL>
    new_basin: <CPL | CPF | CTR | PCL | HCL>
    drift_summary:
      vector: [<dC>, <dM>, <dO>, <dA>, <dT>]
      magnitude: <number>
    invariant_summary:
      violated: [<list>]
      tension_score: <number>
    absorptive_summary:
      strength: <0–1>
      failure_risk: <0–1>
    physics_summary:
      dominant_forces:
        - axis_pair: "<C↔O | M↔A | O↔T>"
          intensity: <number>
    metadata:
      generated_by: "analyzer"
      timestamp: "<YYYY-MM-DD>"
      notes: "<optional>"

  integration_with_analyzer:
    drift_detector: "Supplies drift category and magnitude"
    invariant_checker: "Provides violations and tension"
    physics_engine: "Identifies destabilizing forces"
    basin_classifier: "Detects boundary crossings and new basin identity"
    phase_discipline: "Ensures phase-honest interpretation"
    regime_modes: "Provides operational context"
    observer_layer: "Records regime-shift events in history/now/future lenses"

  metadata:
    maintainer: "TriadicFrameworks"
    last_updated: "2026-03-04"
    notes: "Defines structural regime-shift detection for GSM analysis."

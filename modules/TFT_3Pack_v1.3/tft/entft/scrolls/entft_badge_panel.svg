<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fefefe"/>

  <!-- Title -->
  <text x="450" y="40" font-size="24" text-anchor="middle" fill="#222">entft Contributor Badge Panel</text>

  <!-- Badge Blocks -->
  <g>
    <!-- Mythic Architect -->
    <rect x="50" y="100" width="200" height="80" fill="#e0ccff" stroke="#333" stroke-width="2"/>
    <text x="150" y="130" font-size="18" text-anchor="middle" fill="#000">🧠 Mythic Architect</text>
    <text x="150" y="155" font-size="12" text-anchor="middle" fill="#333">Entropy > 1e50 steps</text>

    <!-- Quantum Hostile -->
    <rect x="325" y="100" width="200" height="80" fill="#ccf5ff" stroke="#333" stroke-width="2"/>
    <text x="425" y="130" font-size="18" text-anchor="middle" fill="#000">🔐 Quantum Hostile</text>
    <text x="425" y="155" font-size="12" text-anchor="middle" fill="#333">Valid block map + hash</text>

    <!-- Triadic Weaver -->
    <rect x="600" y="100" width="200" height="80" fill="#ffe0cc" stroke="#333" stroke-width="2"/>
    <text x="700" y="130" font-size="18" text-anchor="middle" fill="#000">🌀 Triadic Weaver</text>
    <text x="700" y="155" font-size="12" text-anchor="middle" fill="#333">Full 3-6-9 modulation</text>
  </g>

  <g>
    <!-- Legacy Builder -->
    <rect x="150" y="220" width="200" height="80" fill="#d0ffd0" stroke="#333" stroke-width="2"/>
    <text x="250" y="250" font-size="18" text-anchor="middle" fill="#000">🛡️ Legacy Builder</text>
    <text x="250" y="275" font-size="12" text-anchor="middle" fill="#333">Scrolls + overlays</text>

    <!-- Scroll Scribe -->
    <rect x="400" y="220" width="200" height="80" fill="#f9f9a0" stroke="#333" stroke-width="2"/>
    <text x="500" y="250" font-size="18" text-anchor="middle" fill="#000">📜 Scroll Scribe</text>
    <text x="500" y="275" font-size="12" text-anchor="middle" fill="#333">Markdown + SVG author</text>

    <!-- Remix Echo -->
    <rect x="650" y="220" width="200" height="80" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <text x="750" y="250" font-size="18" text-anchor="middle" fill="#000">🧬 Remix Echo</text>
    <text x="750" y="275" font-size="12" text-anchor="middle" fill="#333">Fork + pull request</text>
  </g>

  <!-- Footer -->
  <text x="450" y="550" font-size="14" text-anchor="middle" fill="#555">Badges are echoes of clarity, not rewards of compliance.</text>
</svg>

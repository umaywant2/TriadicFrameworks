[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "TFT_3Pack_v1.3"
version = "1.3.0"
description = "Triadic Framework Toolkit: symbolic fidelity, validator overlays, and base-lens orchestration"
authors = [{ name = "Nawder Loswin" }]
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
  "pyyaml>=6.0",
  "cryptography>=41.0.3",
  "numpy>=1.26.0",
  "sympy>=1.12",
  "matplotlib>=3.8.0",
  "pandas>=2.1.1",
  "scikit-learn>=1.3.1",
  "plotly>=5.18.0",
  "dash>=2.14.1",
  "pyarrow>=13.0.0",
  "markdown2>=2.4.12"
]

keywords = [
  "triadic",
  "resonance clarity",
  "symbolic fidelity",
  "base lens",
  "corridor6.9",
  "phi",
  "negabinary",
  "validator overlays",
  "remix lineage"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Symbolic Simulation",
  "Intended Audience :: Remixers",
  "Natural Language :: Resonance Clarity"
]

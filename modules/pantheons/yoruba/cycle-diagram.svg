<svg width="1080" height="720" viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#05060d"/>
      <stop offset="100%" stop-color="#151a2b"/>
    </radialGradient>

    <linearGradient id="kingship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd34f"/>
      <stop offset="100%" stop-color="#c79a1f"/>
    </linearGradient>

    <linearGradient id="empire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4f7b"/>
      <stop offset="100%" stop-color="#c71f4f"/>
    </linearGradient>

    <linearGradient id="ancestral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b34fff"/>
      <stop offset="100%" stop-color="#6a1fc7"/>
    </linearGradient>

    <linearGradient id="origin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f7bff"/>
      <stop offset="100%" stop-color="#203b8f"/>
    </linearGradient>

    <linearGradient id="realm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fffd3"/>
      <stop offset="100%" stop-color="#1fc79a"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="720" fill="url(#bg)" />

  <!-- Title -->
  <text x="540" y="70" fill="#ffffff" font-size="26" text-anchor="middle">
    Yoruba Cycle Diagram (RTT/3)
  </text>
  <text x="540" y="95" fill="#9fd3ff" font-size="13" text-anchor="middle">
    Kingship · Empire · Ancestral · Origin · Realm
  </text>

  <!-- Kingship Cycle (top left) -->
  <circle cx="260" cy="220" r="90" fill="none" stroke="url(#kingship)" stroke-width="3"/>
  <text x="260" y="190" fill="#ffe38f" font-size="16" text-anchor="middle">Kingship Cycle</text>
  <text x="260" y="210" fill="#ffe38f" font-size="11" text-anchor="middle">Ṣango · Ọba dynasties</text>
  <text x="260" y="230" fill="#ffe38f" font-size="10" text-anchor="middle">mortal → divine → mortal</text>

  <!-- Empire Cycle (top right) -->
  <circle cx="820" cy="220" r="90" fill="none" stroke="url(#empire)" stroke-width="3"/>
  <text x="820" y="190" fill="#ffd3e3" font-size="16" text-anchor="middle">Empire Cycle</text>
  <text x="820" y="210" fill="#ffd3e3" font-size="11" text-anchor="middle">Oyo rise/fall</text>
  <text x="820" y="230" fill="#ffd3e3" font-size="10" text-anchor="middle">expansion → collapse → renewal</text>

  <!-- Ancestral Cycle (center left) -->
  <circle cx="260" cy="420" r="90" fill="none" stroke="url(#ancestral)" stroke-width="3"/>
  <text x="260" y="390" fill="#f3e3ff" font-size="16" text-anchor="middle">Ancestral Cycle</text>
  <text x="260" y="410" fill="#f3e3ff" font-size="11" text-anchor="middle">Egungun · Gelede</text>
  <text x="260" y="430" fill="#f3e3ff" font-size="10" text-anchor="middle">ancestor → projection → return</text>

  <!-- Origin Cycle (center right) -->
  <circle cx="820" cy="420" r="90" fill="none" stroke="url(#origin)" stroke-width="3"/>
  <text x="820" y="390" fill="#9fd3ff" font-size="16" text-anchor="middle">Origin Cycle</text>
  <text x="820" y="410" fill="#9fd3ff" font-size="11" text-anchor="middle">Ifẹ</text>
  <text x="820" y="430" fill="#9fd3ff" font-size="10" text-anchor="middle">origin → multiplicity → origin</text>

  <!-- Realm Cycle (bottom center) -->
  <circle cx="540" cy="540" r="100" fill="none" stroke="url(#realm)" stroke-width="3"/>
  <text x="540" y="510" fill="#d3fff7" font-size="16" text-anchor="middle">Realm Cycle</text>
  <text x="540" y="530" fill="#d3fff7" font-size="11" text-anchor="middle">Ọrun/Aiye</text>
  <text x="540" y="550" fill="#d3fff7" font-size="10" text-anchor="middle">above → below → above</text>

  <!-- Central hub -->
  <circle cx="540" cy="340" r="60" fill="#0b1b33" stroke="#4fb3ff" stroke-width="2"/>
  <text x="540" y="335" fill="#e3f3ff" font-size="16" text-anchor="middle">
    Cycle Hub
  </text>
  <text x="540" y="355" fill="#9fd3ff" font-size="11" text-anchor="middle">
    cycles + paradox + corridors
  </text>

  <!-- Connections -->
  <line x1="540" y1="340" x2="260" y2="220" stroke="#4fb3ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="540" y1="340" x2="820" y2="220" stroke="#4fb3ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="540" y1="340" x2="260" y2="420" stroke="#4fb3ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="540" y1="340" x2="820" y2="420" stroke="#4fb3ff" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="540" y1="340" x2="540" y2="540" stroke="#4fb3ff" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Caption -->
  <text x="540" y="680" fill="#ffffff" font-size="11" text-anchor="middle">
    Yoruba cycle diagram: kingship, empire, ancestral, origin, and realm cycles —
    cycle‑dense, paradox‑tight, origin‑multiplicity structured.
  </text>

</svg>


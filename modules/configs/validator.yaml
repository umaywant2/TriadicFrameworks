validator:
  repeats: 5
  windows: { size_cycles: 50, overlap_cycles: 0 }
  targets: ["capacity_mAh","internal_resistance_mOhm","energy_Wh"]
  asymmetry_response: "delta_capacity"   # or "delta_resistance"
  baseline_label: "S1_baseline"
  bands:
    cycle_fidelity: { excellent: 98.0, good: 95.0, watch: 90.0 }
    energy_stability_pct: { excellent: 0.5, good: 1.0, watch: 2.0 }
    ce_drift_abs: { excellent: 1e-5, good: 3e-5, watch: 1e-4 }
    ses_corr_abs: { excellent: 0.40, good: 0.25, watch: 0.15 }
  record:
    include_phase_tags: true
    include_states: true
    include_drivers: true
